<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turn it into a song — ZigZag Mind (preview)</title>
<style>
:root{
  --bg:#F6F4EF;--surface:#FFFFFF;--text:#1E2329;--muted:#555D66;--line:#E3DFD6;
  --primary:#2F6F6A;--on-primary:#FFFFFF;--primary-soft:#E3EFEC;
  --accent:#6C63C7;--accent-soft:#ECEAFB;--zag:#7BC4BB;--zag-dark:#2F6F6A;--cheek:#F2A98F;--eye:#1E2329;
  --safety:#B5562E;--on-safety:#FFFFFF;--safety-soft:#F7E6DD;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151A;--surface:#1B2027;--text:#ECEAE4;--muted:#A3A9B1;--line:#2A313A;
  --primary:#7BC4BB;--on-primary:#12151A;--primary-soft:#1F3634;--accent:#A59EF0;--accent-soft:#25233D;
  --zag-dark:#BFE6E0;--eye:#12151A;--safety:#F09A6E;--on-safety:#12151A;--safety-soft:#3A2219;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;min-height:64px}
.pill{min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:600;padding:0 14px;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
.help{border:1.5px solid var(--safety);background:var(--safety-soft)}
main{flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
h1{font-size:28px;line-height:1.2;margin:6px 0 0;letter-spacing:-.01em}
h2{font-size:19px;margin:8px 0 0}
p{margin:0}
.sub{color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:600;padding:0 18px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
textarea{width:100%;min-height:120px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:19px;padding:14px;resize:vertical}
.btn{min-height:56px;border-radius:16px;border:none;font:inherit;font-weight:700;font-size:17px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn.safety{background:var(--safety);color:var(--on-safety)}
.btn:disabled{opacity:.45;cursor:default}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.step{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.player{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.zags{width:150px;height:150px}
.bob{animation:bob .9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.lyrics{width:100%;min-height:150px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.lyric{font-size:21px;line-height:1.35;font-weight:700;color:var(--muted);opacity:.5;transition:opacity .3s,color .3s}
.lyric.now{opacity:1;color:var(--text)}
.lyric.still{color:var(--primary)}
.w{transition:color .15s}
.w.on{color:var(--accent)}
.bars{display:flex;gap:4px;align-items:flex-end;height:36px}
.bar{width:6px;border-radius:3px;background:var(--primary);height:6px;transition:height .12s}
.section{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-height:18px}
.song{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.song:first-child{border-top:none}
.song button{min-height:44px}
.note{font-size:13px;color:var(--muted);text-align:center}
.crisis{background:var(--safety-soft);border:1.5px solid var(--safety);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
:focus-visible{outline:3px solid #6C63C7;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="pill" id="songsBtn">My songs</button>
    <button class="pill" id="voiceBtn" aria-pressed="false">Voice off</button>
    <a class="pill help" href="tel:988" aria-label="Call 988 now">Help · 988</a>
  </div>
  <main id="main" aria-live="polite"></main>
  <p class="note" style="padding-bottom:16px">Preview · Made on your phone from your words. No AI. Nothing is sent anywhere.</p>
</div>

<script>
"use strict";
/* ================= SAFETY (same lists as the main site) ================= */
const RED = ["kill myself","killing myself","want to die","wanna die","wish i was dead","wish i were dead","end my life","end it all","suicide","suicidal","overdose","overdosed","hurt myself","hurting myself","cut myself","cutting myself","no reason to live","better off without me","better off dead","cant go on","dont want to live","dont want to be alive","dont want to be here anymore"];
const norm = t => " " + String(t||"").toLowerCase().replace(/[\u2018\u2019']/g,"").replace(/[^a-z0-9]+/g," ").trim() + " ";
const RED_N = RED.map(norm);
const isRed = t => RED_N.some(p => norm(t).includes(p));

/* ================= STATE ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let draft = { mood:null, lines:["","",""] };
let current = null;      // song being played {mood, lines:[a,b,c], still:[...], id?, date?}
let voiceOn = false;
const STORE = "zz.songs.preview";
function loadSongs(){ try { return JSON.parse(localStorage.getItem(STORE) || "[]"); } catch(_){ return []; } }
function saveSongs(a){ try { localStorage.setItem(STORE, JSON.stringify(a)); } catch(_){} }

const MOODS = {
  heavy:   { label:"Heavy",   root:57, bpm:[68,62], cutoff:900,  kick:"soft",  hat:false, verb:.45 },
  anxious: { label:"Anxious", root:62, bpm:[96,66], cutoff:1400, kick:"pulse", hat:true,  verb:.35 },
  angry:   { label:"Angry",   root:52, bpm:[92,72], cutoff:1800, kick:"hard",  hat:true,  verb:.3  },
  numb:    { label:"Numb",    root:60, bpm:[72,66], cutoff:800,  kick:"none",  hat:false, verb:.6  },
  mixed:   { label:"Mixed",   root:55, bpm:[84,70], cutoff:1200, kick:"soft",  hat:true,  verb:.4  }
};
const PROMPTS = [
  ["What's happening?", "Say it plainly. A few words is enough.", "I can't stop thinking about work"],
  ["What do you need right now?", "Not forever. Just right now.", "I need to slow down"],
  ["One thing that's still true", "Something real, even if small.", "Jordan still picks up when I call"]
];

/* ================= SCREENS ================= */
function render(html){ $("main").innerHTML = html; const h = $("main").querySelector("h1"); if (h){ h.tabIndex = -1; h.focus({preventScroll:true}); } window.scrollTo(0,0); }

function home(){
  stopSong();
  draft = { mood:null, lines:["","",""] };
  render(`
    <h1>Turn it into a song.</h1>
    <p class="sub">Three short lines in your own words. ZigZag Mind turns them into a song that starts where you are and ends somewhere steadier.</p>
    <h2>How does it feel right now?</h2>
    <div class="chips" role="group" aria-label="Mood">
      ${Object.entries(MOODS).map(([k,m]) => `<button class="chip" data-mood="${k}" aria-pressed="false">${m.label}</button>`).join("")}
    </div>
    <div class="stack"><button class="btn primary" id="go" disabled>Next</button></div>`);
  document.querySelectorAll("[data-mood]").forEach(b => b.onclick = () => {
    draft.mood = b.dataset.mood;
    document.querySelectorAll("[data-mood]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("go").disabled = false;
  });
  $("go").onclick = () => ask(0);
}

function ask(i){
  const [q, sub, ph] = PROMPTS[i];
  render(`
    <p class="step">Line ${i+1} of 3</p>
    <h1>${q}</h1>
    <p class="sub">${sub}</p>
    <label for="line" class="hint">Type it, or tap the mic on your keyboard to say it.</label>
    <textarea id="line" maxlength="120" placeholder="${esc(ph)}">${esc(draft.lines[i])}</textarea>
    <p class="hint" id="err" role="alert"></p>
    <div class="stack">
      <button class="btn primary" id="next">${i < 2 ? "Next" : "Make my song"}</button>
      ${i > 0 ? `<button class="btn secondary" id="back">Back</button>` : ""}
    </div>`);
  $("next").onclick = () => {
    const v = $("line").value.trim().replace(/\s+/g," ");
    if (!v){ $("err").textContent = "Write a few words first. Anything is okay."; return; }
    if (isRed(v)){ crisis(); return; }
    draft.lines[i] = v;
    if (i < 2) ask(i+1);
    else { current = { mood:draft.mood, lines:[...draft.lines], still:[] }; player(false); }
  };
  if (i > 0) $("back").onclick = () => { draft.lines[i] = $("line").value; ask(i-1); };
}

function crisis(){
  stopSong();
  render(`
    <div class="crisis">
      <h1 style="margin:0">Thank you for writing that.</h1>
      <p>Let's get you to a real person right now. There's no song for this one.</p>
      <div class="pair"><a class="btn safety" href="tel:988">Call 988</a><a class="btn safety" href="sms:988">Text 988</a></div>
      <a class="btn secondary" href="tel:911">Call 911 if someone is hurt or in danger</a>
      <p class="hint">In the real site, this opens the full crisis screen with your trusted people and plan.</p>
    </div>
    <button class="pill" id="back" style="align-self:center;margin-top:8px">That's not what I meant — go back</button>`);
  $("back").onclick = home;
}

const ZAGS = (open=false) => `<svg class="zags" id="zags" viewBox="0 0 220 220" role="img" aria-label="Zags">
  <path d="M92 52 L102 30 L110 46 L120 24 L128 52" fill="none" stroke="var(--zag-dark)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M110 48 C160 48 186 84 186 128 C186 170 154 196 110 196 C66 196 34 170 34 128 C34 84 60 48 110 48 Z" fill="var(--zag)"/>
  <ellipse cx="110" cy="160" rx="44" ry="26" fill="#fff" opacity=".28"/>
  <path d="M77 120 Q86 112 95 120" fill="none" stroke="var(--eye)" stroke-width="4" stroke-linecap="round"/>
  <path d="M125 120 Q134 112 143 120" fill="none" stroke="var(--eye)" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="70" cy="138" rx="10" ry="6" fill="var(--cheek)" opacity=".55"/><ellipse cx="150" cy="138" rx="10" ry="6" fill="var(--cheek)" opacity=".55"/>
  <ellipse id="mouth" cx="110" cy="143" rx="7" ry="${open ? 6 : 2}" fill="var(--eye)"/></svg>`;

function lyricHTML(text, idx, isStill){
  return `<p class="lyric${isStill ? " still" : ""}" id="ly${idx}">${text.split(" ").map((w,j) => `<span class="w" id="w${idx}_${j}">${esc(w)}</span>`).join(" ")}</p>`;
}

function player(isReplay){
  const all = [...current.lines, ...current.still];
  render(`
    <div class="player">
      ${ZAGS()}
      <div class="bars" aria-hidden="true">${Array.from({length:12},(_,i)=>`<span class="bar" id="b${i}"></span>`).join("")}</div>
      <p class="section" id="sec">${MOODS[current.mood].label} · ${isReplay ? "from " + esc(current.date || "") : "your song"}</p>
      <div class="lyrics">${all.map((t,i) => lyricHTML(t, i, i >= 2)).join("")}</div>
    </div>
    <div class="stack">
      <button class="btn primary" id="play">▶ Play my song</button>
      <p class="hint" style="text-align:center">No sound? Check your phone's silent switch and volume.</p>
    </div>`);
  $("play").onclick = () => {
    if (playing){ stopSong(); $("play").textContent = "▶ Play again"; return; }
    $("play").textContent = "■ Stop";
    playSong(current, () => afterSong(isReplay));
  };
}

function afterSong(isReplay){
  $("play").textContent = "▶ Play again";
  $("sec").textContent = "That's your song.";
  const extra = document.createElement("div");
  extra.className = "stack";
  extra.style.marginTop = "6px";
  if (!isReplay){
    extra.innerHTML = `
      <p class="sub" style="text-align:center">You turned a hard moment into something you made.</p>
      <button class="btn primary" id="keep">Keep it in My songs</button>
      <button class="btn secondary" id="again">Make another</button>
      <button class="btn secondary" id="person">Share how you're doing with someone</button>`;
  } else {
    extra.innerHTML = `
      <h2 style="text-align:center">How does this feel now?</h2>
      <div class="pair"><button class="btn secondary" data-now="lighter">Lighter</button><button class="btn secondary" data-now="same">About the same</button></div>
      <button class="btn secondary" data-now="heavier">Heavier</button>`;
  }
  $("main").appendChild(extra);
  if (!isReplay){
    $("keep").onclick = () => {
      const songs = loadSongs();
      const d = new Date();
      current.id = String(d.getTime());
      current.date = d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
      songs.unshift(current); saveSongs(songs.slice(0, 50));
      $("keep").textContent = "Kept ✓"; $("keep").disabled = true;
    };
    $("again").onclick = home;
    $("person").onclick = () => { location.href = "sms:?&body=" + encodeURIComponent("Rough day, but I'm working through it. Can we talk later?"); };
  } else {
    document.querySelectorAll("[data-now]").forEach(b => b.onclick = () => reflect(b.dataset.now));
  }
}

function reflect(now){
  const msg = {
    lighter: "That's worth noticing. You've been here before, and it moved.",
    same: "That's okay. Some things take longer.",
    heavier: "Thank you for being honest. This might be a moment for a person, not a song."
  }[now];
  render(`
    <h1>${msg}</h1>
    ${now === "heavier" ? `<div class="pair"><a class="btn safety" href="tel:988">Call 988</a><a class="btn safety" href="sms:988">Text 988</a></div>
      <a class="btn secondary" href="sms:">Text someone you trust</a>` : ""}
    <h2>Add something that's still true today</h2>
    <p class="sub">It becomes a new last line, so the song grows with you.</p>
    <textarea id="line" maxlength="120" placeholder="I made it through that week"></textarea>
    <p class="hint" id="err" role="alert"></p>
    <div class="stack">
      <button class="btn primary" id="add">Add it and play</button>
      <button class="btn secondary" id="skip">Not now</button>
    </div>`);
  $("add").onclick = () => {
    const v = $("line").value.trim().replace(/\s+/g," ");
    if (!v){ $("err").textContent = "Write a few words, or tap Not now."; return; }
    if (isRed(v)){ crisis(); return; }
    current.still.push(v);
    const songs = loadSongs().map(s => s.id === current.id ? current : s);
    saveSongs(songs);
    player(true);
  };
  $("skip").onclick = songsList;
}

function songsList(){
  stopSong();
  const songs = loadSongs();
  render(`
    <h1>My songs</h1>
    <p class="sub">Saved only on this phone. Listen back and notice what's changed.</p>
    <div class="card">${songs.length ? songs.map(s => `
      <div class="song">
        <div><strong>${esc(s.lines[0].slice(0,40))}${s.lines[0].length > 40 ? "…" : ""}</strong><p class="hint">${esc(s.date)} · ${MOODS[s.mood].label}${s.still.length ? ` · ${s.still.length} added later` : ""}</p></div>
        <div style="display:flex;gap:6px"><button class="pill" data-play="${s.id}">Play</button><button class="pill" data-del="${s.id}" aria-label="Delete">✕</button></div>
      </div>`).join("") : `<p class="sub">No songs yet.</p>`}</div>
    <div class="stack"><button class="btn primary" id="new">Make a new song</button></div>`);
  document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => { current = loadSongs().find(s => s.id === b.dataset.play); player(true); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { saveSongs(loadSongs().filter(s => s.id !== b.dataset.del)); songsList(); });
  $("new").onclick = home;
}

/* ================= MUSIC ENGINE (Web Audio, deterministic) ================= */
let ctx = null, master = null, verb = null, playing = false, timers = [], nodes = [];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function syllables(w){ const m = w.toLowerCase().replace(/[^a-z]/g,"").match(/[aeiouy]+/g); return Math.min(4, Math.max(1, m ? m.length : 1)); }

function setupAudio(mood){
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
  master.connect(comp); comp.connect(ctx.destination);
  verb = ctx.createConvolver();
  const len = ctx.sampleRate * 2.6, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.4); }
  verb.buffer = ir;
  const vg = ctx.createGain(); vg.gain.value = mood.verb;
  verb.connect(vg); vg.connect(master);
  nodes.push(master, comp, verb, vg);
}
function env(g, t, a, peak, hold, r){
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + a + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + r);
}
function pad(notes, t, dur, cutoff){
  const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff;
  const g = ctx.createGain(); env(g, t, 0.7, 0.07, Math.max(0.1, dur - 0.7), 1.2);
  f.connect(g); g.connect(master); g.connect(verb);
  notes.forEach(n => ["triangle","sawtooth"].forEach((type, k) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = mtof(n); o.detune.value = k ? 7 : -5;
    const og = ctx.createGain(); og.gain.value = k ? 0.35 : 0.6;
    o.connect(og); og.connect(f); o.start(t); o.stop(t + dur + 1.4); nodes.push(o);
  }));
}
function bass(n, t, dur){
  const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = mtof(n);
  const g = ctx.createGain(); env(g, t, 0.03, 0.22, Math.max(0.05, dur - 0.2), 0.3);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.4); nodes.push(o);
}
function lead(n, t, dur){
  const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = mtof(n);
  const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = mtof(n + 12);
  const lfo = ctx.createOscillator(); lfo.frequency.value = 5; const lg = ctx.createGain(); lg.gain.value = 4;
  lfo.connect(lg); lg.connect(o.detune);
  const g = ctx.createGain(); env(g, t, 0.015, 0.16, Math.max(0.02, dur * 0.55), Math.max(0.15, dur * 0.6));
  const g2 = ctx.createGain(); g2.gain.value = 0.25;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master); g.connect(verb);
  [o, o2, lfo].forEach(x => { x.start(t); x.stop(t + dur * 1.3 + 0.3); nodes.push(x); });
}
function kick(t, strength){
  const o = ctx.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
  const g = ctx.createGain(); env(g, t, 0.005, strength, 0.02, 0.22);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.35); nodes.push(o);
}
let noiseBuf = null;
function hat(t, vol){
  if (!noiseBuf){ noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1; }
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7000;
  const g = ctx.createGain(); env(g, t, 0.002, vol, 0.01, 0.05);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 0.1); nodes.push(s);
}

const MINOR_PROG = [[0,3,7],[8,12,15],[3,7,10],[10,14,17]];   // i  VI  III  VII
const PRE_PROG   = [[8,12,15],[10,14,17],[0,3,7],[0,3,7]];    // VI VII i  i
const MAJOR_PROG = [[0,4,7],[7,11,14],[9,12,16],[5,9,12]];    // I  V   vi IV
const MIN_PENTA = [0,3,5,7,10], MAJ_PENTA = [0,2,4,7,9];

function melodyFor(text, scaleRoot, penta){
  const words = text.split(" ").filter(Boolean);
  const notes = []; let pos = 0, deg = 4;
  words.forEach((w, wi) => {
    const syl = syllables(w), h = hash(w);
    for (let s = 0; s < syl; s++){
      const step = ((h >> (s * 3)) % 5) - 2;
      deg = Math.max(0, Math.min(9, deg + step));
      const lastOfWord = s === syl - 1;
      const endPhrase = lastOfWord && (wi === words.length - 1 || /[,.!?]$/.test(w));
      const dur = endPhrase ? 1.5 : (lastOfWord ? 0.75 : 0.5);
      const pitch = scaleRoot + 12 + penta[deg % 5] + 12 * Math.floor(deg / 5);
      notes.push({ beat:pos, dur, pitch, word:wi });
      pos += dur;
    }
  });
  return { notes, beats:pos };
}

function playSong(song, onEnd){
  stopSong();
  const mood = MOODS[song.mood];
  setupAudio(mood);
  playing = true;
  const minorRoot = mood.root - 12, majorRoot = mood.root + 3 - 12;
  const lines = [...song.lines, ...song.still];
  // sections: intro, verse(line0), pre(line1), chorus(line2 + still lines), outro
  const secs = [{ name:"", bars:2, prog:MINOR_PROG, root:minorRoot, major:false, line:-1 }];
  lines.forEach((t, i) => {
    const major = i >= 2;
    secs.push({ name: i === 0 ? "What's happening" : i === 1 ? "What I need" : "Still true", text:t, line:i,
      prog: major ? MAJOR_PROG : (i === 1 ? PRE_PROG : MINOR_PROG), root: major ? majorRoot : minorRoot, major });
  });
  secs.push({ name:"", bars:2, prog:MAJOR_PROG, root:majorRoot, major:true, line:-1, outro:true });
  let t = ctx.currentTime + 0.15;
  const startAt = t, wallStart = performance.now();
  const at = (time, fn) => timers.push(setTimeout(fn, Math.max(0, (time - startAt) * 1000 + 150)));
  secs.forEach((sec, si) => {
    const bpm = mood.bpm[0] + (mood.bpm[1] - mood.bpm[0]) * (si / (secs.length - 1));
    const spb = 60 / bpm;
    let mel = null;
    if (sec.text){
      mel = melodyFor(sec.text, sec.root + 12, sec.major ? MAJ_PENTA : MIN_PENTA);
      sec.bars = Math.max(2, Math.ceil((mel.beats + 1) / 4));
    }
    const secStart = t;
    for (let b = 0; b < sec.bars; b++){
      const bt = t + b * 4 * spb;
      const ch = sec.prog[b % 4].map(x => sec.root + 12 + x);
      const last = sec.outro && b === sec.bars - 1;
      pad(ch, bt, 4 * spb * (last ? 2 : 1), mood.cutoff + (sec.major ? 500 : 0));
      bass(sec.root + sec.prog[b % 4][0], bt, 4 * spb * 0.95);
      for (let q = 0; q < 4; q++){
        const qt = bt + q * spb;
        if (mood.kick === "hard" && (q === 0 || q === 2)) kick(qt, 0.55);
        else if (mood.kick === "pulse" && q % 2 === 0) kick(qt, 0.35);
        else if (mood.kick === "soft" && q === 0) kick(qt, 0.3);
        if (mood.hat && !last){ hat(qt + spb/2, 0.035); if (!sec.major) hat(qt, 0.02); }
        at(qt, () => pulseBars(sec.major));
      }
    }
    if (mel){
      const off = secStart + 0.5 * spb * 2;
      at(secStart, () => {
        document.querySelectorAll(".lyric").forEach(e => e.classList.remove("now"));
        const ly = $("ly" + sec.line); if (ly){ ly.classList.add("now"); ly.scrollIntoView({ block:"nearest", behavior:"smooth" }); }
        const se = $("sec"); if (se) se.textContent = sec.name;
        if (voiceOn && "speechSynthesis" in window){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(sec.text); u.rate = 0.82; u.pitch = 1.05; speechSynthesis.speak(u); } catch(_){} }
      });
      mel.notes.forEach(n => {
        const nt = off + n.beat * spb;
        lead(n.pitch, nt, n.dur * spb);
        at(nt, () => {
          document.querySelectorAll(".w.on").forEach(e => e.classList.remove("on"));
          const w = $(`w${sec.line}_${n.word}`); if (w) w.classList.add("on");
          const m = $("mouth"); if (m){ m.setAttribute("ry", "6"); setTimeout(() => m && m.setAttribute("ry", "2"), Math.min(220, n.dur * spb * 600)); }
        });
      });
    }
    if (sec.outro) at(secStart, () => { document.querySelectorAll(".w.on").forEach(e => e.classList.remove("on")); const se = $("sec"); if (se) se.textContent = ""; });
    t += sec.bars * 4 * spb;
  });
  const z = $("zags"); if (z) z.classList.add("bob");
  at(t + 2.2, () => { playing = false; const z2 = $("zags"); if (z2) z2.classList.remove("bob"); document.querySelectorAll(".lyric").forEach(e => e.classList.add("now")); onEnd(); });
}
function pulseBars(major){
  for (let i = 0; i < 12; i++){
    const b = $("b" + i); if (!b) return;
    b.style.height = (6 + Math.round(Math.random() * (major ? 30 : 20))) + "px";
    b.style.background = major ? "var(--primary)" : "var(--accent)";
  }
}
function stopSong(){
  timers.forEach(clearTimeout); timers = [];
  if (ctx){ nodes.forEach(n => { try { n.stop ? n.stop() : null; } catch(_){} try { n.disconnect(); } catch(_){} }); }
  nodes = []; playing = false;
  if ("speechSynthesis" in window) try { speechSynthesis.cancel(); } catch(_){}
  const z = $("zags"); if (z) z.classList.remove("bob");
}

/* ================= TOP BAR ================= */
$("songsBtn").onclick = songsList;
$("voiceBtn").onclick = () => {
  voiceOn = !voiceOn;
  $("voiceBtn").textContent = voiceOn ? "Voice on" : "Voice off";
  $("voiceBtn").setAttribute("aria-pressed", String(voiceOn));
};
home();

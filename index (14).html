<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<title>ZigZag Mind — Get through what's happening right now</title>
<style>
:root{
  --bg:#F6F4EF;--surface:#FFFFFF;--text:#1E2329;--text-muted:#5E6670;
  --primary:#2F6F6A;--on-primary:#FFFFFF;--primary-soft:#E3EFEC;
  --accent:#6C63C7;--accent-soft:#ECEAFB;
  --safety:#B5562E;--on-safety:#FFFFFF;--safety-soft:#F7E6DD;
  --line:#E3DFD6;--focus:#6C63C7;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151A;--surface:#1B2027;--text:#ECEAE4;--text-muted:#A3A9B1;
    --primary:#7BC4BB;--on-primary:#12151A;--primary-soft:#1F3634;
    --accent:#A59EF0;--accent-soft:#25233D;
    --safety:#F09A6E;--on-safety:#12151A;--safety-soft:#3A2219;
    --line:#2A313A;--focus:#A59EF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151A;--surface:#1B2027;--text:#ECEAE4;--text-muted:#A3A9B1;
  --primary:#7BC4BB;--on-primary:#12151A;--primary-soft:#1F3634;
  --accent:#A59EF0;--accent-soft:#25233D;
  --safety:#F09A6E;--on-safety:#12151A;--safety-soft:#3A2219;
  --line:#2A313A;--focus:#A59EF0;
  color-scheme:dark;
}
:root.crisis-mode{--bg:var(--safety-soft)}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;min-height:68px}
.icon-btn{width:48px;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-size:24px;line-height:1;display:grid;place-items:center}
.spacer{width:48px;height:48px}
.help-pill{min-height:48px;padding:0 16px 0 12px;border-radius:24px;border:1.5px solid var(--safety);background:var(--safety-soft);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.help-pill svg{width:20px;height:20px;flex:none}

.ybar{margin:0 20px 10px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--safety)}
.ybar p{margin:0 0 10px;font-weight:600;font-size:15px}
.ybar .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0 10px;text-align:center}
.chip.safety{background:var(--safety);color:var(--on-safety);border-color:var(--safety)}

main.screen{flex:1;display:flex;flex-direction:column;padding:4px 20px 0}
main.screen.enter{animation:enter .25s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.content{flex:1;padding-bottom:16px}
.actions{position:sticky;bottom:0;padding:20px 0 16px;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 20px);display:flex;flex-direction:column;gap:10px}

h1{font-size:28px;line-height:1.2;font-weight:650;letter-spacing:-.01em;margin:8px 0 8px}
h2{font-size:20px;line-height:1.25;font-weight:650;margin:28px 0 10px}
p{margin:0 0 12px}
.sub{color:var(--text-muted);font-size:15px}
.small{font-size:15px;color:var(--text-muted)}
.step-big{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:12vh 0 14px}
.step-big.tight{margin-top:24px}
.step-count{font-size:13px;color:var(--text-muted);margin-top:8px}

.hero{padding:20px 0 8px}
.brand{background:none;border:none;padding:0;color:var(--primary);
  font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  font-size:38px;font-weight:600;letter-spacing:-.01em;line-height:1;min-height:48px}
.hero .sub{margin:6px 0 0;font-size:17px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{min-height:108px;border-radius:20px;background:var(--surface);border:1px solid var(--line);
  padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-weight:600;font-size:17px;line-height:1.25}
.card .em{font-size:28px;line-height:1}
.card.wide{grid-column:1 / -1;min-height:76px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.card.safety{background:var(--safety-soft);border:1.5px solid var(--safety)}
.card .meta{display:block;font-weight:400;font-size:15px;color:var(--text-muted);margin-top:2px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.list .card{min-height:68px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}

.btn{min-height:56px;border-radius:16px;font-weight:600;font-size:17px;border:none;width:100%;padding:0 20px;
  display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn-safety{background:var(--safety);color:var(--on-safety)}
.btn-outline{background:var(--surface);color:var(--text);border:1.5px solid var(--safety)}
.btn:disabled{opacity:.45;cursor:default}
.btn .cap{display:block;font-weight:400;font-size:13px;opacity:.9}
.btn.two-line{flex-direction:column;gap:0;padding:8px 20px}
.link{background:none;border:none;color:var(--text-muted);text-decoration:underline;font-size:15px;min-height:48px;padding:0 8px;align-self:center}
.stack{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.rating{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.rate{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:17px}
.rate[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-top:8px}

.field{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;padding:12px 14px;margin-top:10px}
textarea.field{min-height:150px;resize:vertical}
.notice{border-radius:14px;padding:12px 14px;background:var(--primary-soft);font-size:15px;margin-top:12px}

.dots{display:flex;flex-wrap:wrap;gap:14px;margin:28px 0 8px}
.dot{width:60px;height:60px;border-radius:50%;border:2px solid var(--accent);background:transparent;transition:background .2s ease,transform .2s ease}
.dot[aria-pressed="true"]{background:var(--accent);transform:scale(.94)}
.count{font-size:72px;font-weight:600;color:var(--primary);text-align:center;margin:28px 0 0;font-variant-numeric:tabular-nums}

.tcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;transition:opacity .3s ease,transform .3s ease}
.tcard .t{font-weight:600;word-break:break-word}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.seg button{min-height:48px;font-size:13px;line-height:1.2;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;padding:4px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.parked{margin-top:16px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line);color:var(--text-muted);font-size:15px}
.choice{display:block;width:100%;text-align:left;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;margin-top:8px;font-weight:600}
.choice[aria-pressed="true"]{border:2px solid var(--primary);background:var(--primary-soft)}
.nextcard{background:var(--primary-soft);border-radius:20px;padding:28px 22px;margin-top:20px}
.nextcard .lbl{font-size:15px;color:var(--text-muted);margin-bottom:8px}
.nextcard .big{font-size:28px;line-height:1.25;font-weight:600}
.nextcard .for{font-size:15px;color:var(--text-muted);margin-top:12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.panel h3{margin:0 0 6px;font-size:17px}
.panel ul{margin:6px 0 0;padding-left:20px}
.note{font-size:15px;color:var(--text-muted);margin-top:16px}
.safety-row{display:grid;gap:8px;margin-top:20px;padding:14px;border-radius:16px;border:1.5px solid var(--safety);background:var(--surface);font-size:15px}
.safety-row a{font-weight:600}
.disclaimer{font-size:13px;color:var(--text-muted);text-align:center;margin:16px 0 0}

.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);z-index:5}
.tab{min-height:58px;background:none;border:none;font-size:13px;font-weight:600;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab[aria-current="page"]{color:var(--primary)}
.tab .bar{width:20px;height:3px;border-radius:2px;background:transparent}
.tab[aria-current="page"] .bar{background:var(--primary)}

.seg-theme{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.seg-theme button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg-theme button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

.dev{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:406px;margin:0 auto;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2);max-height:60%;overflow:auto}
.dev dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 10px}
.dev dt{color:var(--text-muted)}
.dev dd{margin:0;font-weight:600;word-break:break-word}
.dev .hd{display:flex;justify-content:space-between;align-items:center}
.dev .hd button{min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px;font-size:13px;font-weight:600}

/* Stage 3: craving timer */
.ring-wrap{position:relative;width:220px;height:220px;margin:16px auto 4px}
.ring{width:220px;height:220px;display:block}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--primary);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label .tm{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.ring-label .lb{font-size:15px;color:var(--text-muted);margin-top:6px}
.todo{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;margin-top:8px;text-align:left;font-weight:600;text-decoration:none}
.todo .ck{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--primary);display:grid;place-items:center;font-size:15px;color:var(--on-primary)}
.todo[aria-pressed="true"] .ck{background:var(--primary)}
.todo[aria-pressed="true"] .tx{color:var(--text-muted);text-decoration:line-through}
.wave{margin-top:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;padding-bottom:14px}
.wave svg{display:block;width:100%;height:90px}
.wave .mv{animation:waveMove 7s ease-in-out infinite alternate}
.wave path{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2}
@keyframes waveMove{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.wave ol{margin:6px 0 0;padding:0 18px 0 38px}
.wave li{margin-top:6px}
/* Stage 3: focus game */
.focus-area{position:relative;height:230px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-top:20px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.focus-area .track{position:absolute;left:28px;right:28px;top:50%;height:2px;background:var(--line)}
.target{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;border:3px solid var(--accent)}
.target.hit{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 var(--accent-soft)}50%{transform:scale(1.12);box-shadow:0 0 0 14px var(--accent-soft)}100%{transform:scale(1);box-shadow:0 0 0 0 transparent}}
.orb{position:absolute;top:50%;left:0;width:42px;height:42px;margin-top:-21px;border-radius:50%;background:var(--primary);will-change:transform}
.focus-meta{display:flex;justify-content:space-between;margin-top:12px;font-size:15px;color:var(--text-muted);min-height:22px}
/* Stage 3: thought parking drag */
.tc-top{display:flex;gap:12px;align-items:center}
.handle{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--text-muted);touch-action:none;cursor:grab;font-size:22px;background:var(--bg);border:1px solid var(--line)}
.tcard.dragging{position:relative;z-index:30;box-shadow:0 14px 34px rgba(0,0,0,.22);transition:none;opacity:.96}
.zone{border-radius:20px;padding:14px;margin-top:14px;border:2px solid transparent;min-height:84px;transition:border-color .15s ease,background .15s ease}
.zone.now{background:var(--primary-soft)}
.zone.later{background:var(--surface);border-color:var(--line)}
.zone.park{border:2px dashed var(--line)}
.zone.over{border-color:var(--primary)!important;border-style:solid!important}
.zone h3{margin:0;font-size:17px}
.zone .zh{font-size:13px;color:var(--text-muted);margin:2px 0 0}
.zone .tcard{margin-top:10px}
.tchip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 6px 6px 12px;margin-top:8px;border-radius:12px;background:var(--bg);font-size:15px;color:var(--text-muted);animation:park .4s ease-out}
.tchip button{min-height:40px;border:none;background:none;text-decoration:underline;color:var(--text-muted);font-size:13px;padding:0 8px}
@keyframes park{from{transform:scale(1.06);opacity:.4}to{transform:scale(1);opacity:1}}
.landed{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(1.04)}100%{transform:scale(1)}}

/* Stage 4 */
:root.reduce *,:root.reduce *::before,:root.reduce *::after{animation:none!important;transition:none!important}
.plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.edit-btn{min-height:44px;min-width:64px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;padding:0 12px;flex:none}
.empty{color:var(--text-muted);font-size:15px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hchip{min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:600;font-size:15px}
.hchip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.hchip .x{margin-left:6px;opacity:.8}
.fieldset{border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;margin-top:14px;background:var(--surface)}
.fieldset legend{font-weight:600;font-size:15px;padding:0 6px}
.fieldset label{display:block;font-size:13px;color:var(--text-muted);margin-top:10px}
.fieldset .field{margin-top:4px}
.err{color:var(--safety);font-weight:600;font-size:15px;margin-top:12px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:none}
.stat .n{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--primary);min-width:2ch;text-align:right}
.big-change{font-size:34px;font-weight:650;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.about-hero{padding:28px 0 8px}
.about-hero .brand{font-size:44px;line-height:1.05}
.about-hero .tag{font-size:24px;line-height:1.25;font-weight:600;margin:14px 0 8px}
.crisis-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;background:var(--safety-soft);border:1.5px solid var(--safety);margin-top:16px;font-size:15px;font-weight:600}
.crisis-bar a{white-space:nowrap}
.how{counter-reset:how;list-style:none;padding:0;margin:8px 0 0}
.how li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.how li::before{counter-increment:how;content:counter(how);width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:650;display:grid;place-items:center}
.how b{display:block}
.flash{border-radius:14px;padding:12px 14px;background:var(--primary-soft);font-size:15px;font-weight:600;margin-top:12px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
"use strict";

/* =========================================================
   NEXT — Stage 1 + Stage 2 prototype
   Deterministic only. No AI, no network calls, no analytics,
   no browser storage. All data lives in memory until reload.
   ========================================================= */

/* ---------- SAFETY PHRASE LISTS (edit here; clinician-reviewable) ---------- */
const RED_PHRASES = [
  "kill myself","killing myself","want to die","wanna die","wish i was dead","wish i were dead",
  "end my life","end it all","suicide","suicidal","overdose","overdosed","hurt myself","hurting myself",
  "cut myself","cutting myself","no reason to live","better off without me","better off dead",
  "can't go on","don't want to live","don't want to be alive","don't want to be here anymore"
];
const YELLOW_PHRASES = [
  "hopeless","can't take it","can't take this","give up","giving up","nobody cares","no one cares",
  "worthless","trapped","can't do this anymore"
];

function normalizeText(t){
  return " " + String(t || "").toLowerCase()
    .replace(/[\u2018\u2019']/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim() + " ";
}
const RED_N = RED_PHRASES.map(normalizeText);
const YELLOW_N = YELLOW_PHRASES.map(normalizeText);

function safetyCheck(text){
  const n = normalizeText(text);
  if (RED_N.some(p => n.includes(p))) return "RED";
  if (YELLOW_N.some(p => n.includes(p))) return "YELLOW";
  return "GREEN";
}

/* ---------- CRISIS CONTACTS ---------- */
const LINKS = {
  call988: "tel:988",
  text988: "sms:988",
  chat988: "https://988lifeline.org/chat",
  call911: "tel:911"
};
const HARD_TIME_MSG = "I'm having a really hard time. Can you call me?";
function smsLink(phone, body){
  const digits = String(phone).replace(/\D/g, "");
  return body ? `sms:${digits}?&body=${encodeURIComponent(body)}` : `sms:${digits}`;
}
function telLink(phone){ return `tel:${String(phone).replace(/\D/g, "")}`; }

/* ---------- INTERVENTION LIBRARY (array; look up with .find) ---------- */
const INTERVENTION_LIBRARY = [
  { id:"grounding", name:"Grounding", tryLabel:"Try grounding",
    description:"Notice what's around you, one sense at a time.", durationSec:120,
    states:["anxious","spiraling","craving","distraction"], intensityRange:[0,10], needsMobility:false,
    steps:["Put both feet on the floor.","Name 3 things you can see.","Notice 2 things you can hear.","Let one slow breath out."],
    completion:"tap_done" },
  { id:"walking", name:"Walking", tryLabel:"Try walking",
    description:"A short, slow walk.", durationSec:180,
    states:["anxious","spiraling","low","craving"], intensityRange:[0,10], needsMobility:true,
    steps:["Stand up when you're ready.","Walk slowly for 2 minutes. Anywhere is fine.","Notice each foot as it lands.","Stop and stand still for a moment."],
    completion:"tap_done" },

const STORE_KEY = "next.v1.sensitive";

  try { const k = "__next_test"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
  catch (_){ return false; }

function loadStore(){
  if (!STORAGE_OK) return;
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || "null");
    if (p){
      Object.assign(prefs, p.prefs || {});
      savedTheme = p.theme || null;
      persistOn = p.persist !== false;

    if (raw){

      store.sensitive = {
        plan:{ ...emptyPlan(), ...(d.plan || {}) },
        baseHistory:Array.isArray(d.history) ? d.history : [],
        activity:Array.isArray(d.activity) ? d.activity : []

function promoteYellow(s){
  if (s.safetyLevel === "GREEN") return { ...s, safetyLevel:"YELLOW", yellow:true };
  return { ...s, yellow:true };
}

function reducer(s, a){
  switch (a.type){
    case "SET_SCREEN": return { ...s, screen:a.screen };
    case "SET_SAFETY_LEVEL":
      if (a.level === "GREEN") return s;                       // never back to GREEN in a session
      if (a.level === "YELLOW") return { ...s, safetyLevel:"YELLOW", yellow:true };
      if (a.level === "RED") return { ...s, safetyLevel:"RED" };
      return s;
    case "SET_CURRENT_STATE": return { ...s, currentState:a.state };
    case "SET_CURRENT_INTERVENTION": return { ...s, currentInterventionId:a.id };
    case "SET_CURRENT_INTENSITY": return { ...s, currentIntensity:a.value };
    case "SET_BEFORE_RATING": return { ...s, currentBeforeRating:a.value, currentIntensity:a.value };
    case "INCREMENT_STILL_BAD": {
      const n = { ...s, stillBadCount:s.stillBadCount + 1 };
      return n.stillBadCount >= 2 ? promoteYellow(n) : n;
    }
    case "INCREMENT_HIGH_RATING": {
      const n = { ...s, highRatingCount:s.highRatingCount + 1 };
      return n.highRatingCount >= 2 ? promoteYellow(n) : n;
    }
    case "ADD_OUTCOME": return { ...s, sessionHistory:[ ...s.sessionHistory, a.outcome ] };
    case "ADD_PICK": return { ...s, interventionPicks:[ ...s.interventionPicks, a.id ] };
    case "INCREMENT_INTERVENTION_COUNT": return { ...s, interventionCount:s.interventionCount + 1 };
    case "SET_ENGINE_RESULT": return { ...s, lastEnginePick:a.pick, lastEngineReason:a.reason };
    case "RESET_CURRENT_FLOW": return { ...s, currentFlowStep:0, currentBeforeRating:null, currentIntensity:null, currentInterventionId:null };
    case "TOGGLE_DEV_PANEL": return { ...s, devPanelOpen:!s.devPanelOpen };
    case "EXIT_CRISIS": return { ...s, safetyLevel:"YELLOW", yellow:true, screen:"home" };
    case "DELETE_DATA": return { ...s, sessionHistory:[], interventionPicks:[], interventionCount:0,
      lastEnginePick:null, lastEngineReason:"", currentState:null, currentInterventionId:null,
      currentBeforeRating:null, currentIntensity:null };   // safety level is never reset
    default: return s;
  }
}

/* ---------- INTERVENTION ENGINE ---------- */
function interventionEngine({ state, intensity, history = [], yellow = false, playbook = {}, picks = [], interventionCount = 0, exclude = [] }){
  // Rule 1: filter by state
  let pool = INTERVENTION_LIBRARY.filter(i => i.states.includes(state));
  // Rule 2: filter by intensity range
  if (typeof intensity === "number") pool = pool.filter(i => intensity >= i.intensityRange[0] && intensity <= i.intensityRange[1]);
  // Rule 5: never the same as the last pick (unless nothing else is eligible)
  const last = picks.length ? picks[picks.length - 1] : null;
  let eligible = pool.filter(i => i.id !== last && !exclude.includes(i.id));
  if (!eligible.length) eligible = pool.filter(i => i.id !== last);
  if (!eligible.length) eligible = pool;
  if (!eligible.length) return { interventionId:null, reason:"No eligible intervention found." };

  const helps = (playbook.helps || []).filter(h => findIntervention(h));
  const out = (i, reason, extra = {}) => ({ interventionId:i.id, reason, isPreviouslyHelpful:false,
    usedHistoricalData:false, historicalUses:0, averageDrop:null, ...extra });

  // Rule 3: YELLOW priority (exploration disabled)
  if (yellow){
    const order = [
      ["connection","Reaching out to someone can help when things feel heavy."],
      ...helps.map(h => [h, "This is on your list of things that help."]),
      ["grounding","A grounding step can help steady things."],
      ["environment_change","A change of space can help."]
    ];
    for (const [id, reason] of order){
      const f = eligible.find(i => i.id === id);
      if (f) return out(f, reason);
    }
    return out(eligible[0], "One small step to try.");
  }

  // Rule 6: every 4th start tries something untried this session
  if ((interventionCount + 1) % 4 === 0){
    const untried = eligible.find(i => !picks.includes(i.id));
    if (untried) return out(untried, "Something you haven't tried today.");
  }

  // Rule 4: rank by average drop (needs 2+ uses with numeric before/after)
  const stat = id => {
    const r = history.filter(h => h.interventionId === id && h.state === state &&
      typeof h.before === "number" && typeof h.after === "number");
    if (r.length < 2) return null;
    return { uses:r.length, avg:r.reduce((sum, h) => sum + (h.before - h.after), 0) / r.length };
  };
  const scored = eligible.map(i => ({ i, s:stat(i.id) }))
    .filter(x => x.s && x.s.avg > 0)
    .sort((a, b) => (b.s.avg - a.s.avg) || (helps.includes(b.i.id) - helps.includes(a.i.id)));
  if (scored.length){
    const { i, s } = scored[0];
    // Rule 7: phrase as an offer, never a promise
    return out(i, `${i.name} helped you before.`, { isPreviouslyHelpful:true, usedHistoricalData:true,
      historicalUses:s.uses, averageDrop:Math.round(s.avg * 10) / 10 });
  }
  const pb = eligible.find(i => helps.includes(i.id));
  if (pb) return out(pb, "This is on your list of things that help.");
  return out(eligible[0], "One small step to try.");
}

function runEngine(){
  const r = interventionEngine({
    state:session.currentState,
    intensity:session.currentBeforeRating,
    history:[ ...store.sensitive.baseHistory, ...session.sessionHistory ],
    yellow:session.yellow,
    playbook:getPlan(),
    picks:session.interventionPicks,
    interventionCount:session.interventionCount,
    exclude:ui.exclude
  });
  ui.engine = r;
  dispatch({ type:"SET_ENGINE_RESULT", pick:r.interventionId, reason:r.reason });
  return r;
}

/* ---------- FLOW CONTROL ---------- */
const FLOW_FIRST = { anxious:"grounding", spiraling:"thought_parking", low:null, craving:"craving_delay", distraction:null };

function startFlow(stateId, opts = {}){
  if (blockIfRed()) return;
  dispatch({ type:"RESET_CURRENT_FLOW" });
  dispatch({ type:"SET_CURRENT_STATE", state:stateId });
  const theme = ui.theme;
  ui = freshUi(); ui.theme = theme;
  ui.lowFirst = !!opts.firstHydration;
  logActivity("moment");
  const first = opts.firstHydration ? "hydration" : FLOW_FIRST[stateId];
  dispatch({ type:"SET_ENGINE_RESULT", pick:first, reason:first ? "Default first step for this state." : "User chooses the first step." });
  go("before");
}

function beginAfterBefore(){
  if (blockIfRed()) return;
  const st = session.currentState;
  if (st === "anxious") startIntervention("grounding", { route:"anx-feet" });
  else if (st === "spiraling") startIntervention("thought_parking");
  else if (st === "low"){ if (ui.lowFirst) startIntervention("hydration"); else go("low-choose"); }
  else if (st === "craving") startIntervention("craving_delay");
  else if (st === "distraction") go("distraction-choose");
  else go("home");
}

function startIntervention(interventionId, opts = {}){
  if (blockIfRed()) return false;
  const it = findIntervention(interventionId);
  if (!it) return false;
  dispatch({ type:"ADD_PICK", id:interventionId });
  dispatch({ type:"INCREMENT_INTERVENTION_COUNT" });
  dispatch({ type:"SET_CURRENT_INTERVENTION", id:interventionId });
  ui.step = 0;
  let route = opts.route;
  if (!route) route = interventionId === "thought_parking" ? "spiral-input"
    : interventionId === "craving_delay" ? "craving-delay" : "intervention";
  if (interventionId === "craving_delay"){
    ui.cravingStart = Date.now();
    ui.cravingEnd = Date.now() + CRAVING_MS;
    ui.cravingDone = {}; ui.waveOpen = false;
  }
  if (route === "focus"){ ui.focusStart = null; }
  if (route === "ground"){ startGround(); return true; }
  go(route);
  return true;
}

function completeCheckIn({ after, action }){
  if (blockIfRed()) return;
  const afterVal = action === "skip" ? null : (typeof after === "number" ? after : null);
  const outcome = { source:"session", state:session.currentState, interventionId:session.currentInterventionId,
    before:session.currentBeforeRating, after:afterVal, timestamp:Date.now() };
  dispatch({ type:"ADD_OUTCOME", outcome });
  if (typeof afterVal === "number" && afterVal >= 9) recordHighRating();
  if (action === "still_bad") recordStillBad();
  ui.justStillBad = action === "still_bad";
  ui.rating = null; ui.exclude = []; ui.checkinNote = ""; ui.suggestIdx = 0; ui.checkinVariant = null;
  // the next step starts from where this one ended (null if skipped — never invented)
  dispatch({ type:"SET_BEFORE_RATING", value:afterVal });
  runEngine();
  go("recommendation");
}

function somethingElse(){
  if (blockIfRed()) return;
  const prev = ui.engine && ui.engine.interventionId;
  if (prev && !ui.exclude.includes(prev)) ui.exclude.push(prev);
  let r = runEngine();
  if (!r.interventionId || r.interventionId === prev){
    ui.exclude = prev ? [prev] : [];
    r = runEngine();
  }
  ui.suggestIdx++;
  render();
}

      <div style="display:flex;justify-content:center;margin:8px 0 12px">
        <button class="link" data-act="triage">I don't know — help me figure it out</button>
      </div>
      ${!getPlan().trustedPeople.length && !getPlan().helps.length ? `<button class="card wide" data-act="tab" data-arg="plan" style="margin-bottom:16px;width:100%"><span class="em" aria-hidden="true">📝</span><span>Build your plan for hard moments<span class="meta">Do it on a good day. It takes a few minutes.</span></span></button>` : ""}` };
  },

  triage(){
    const opts = [
      ["anxious","😰","My body feels tense or racing"],
      ["spiraling","🌀","My thoughts keep looping"],
      ["low","😔","I feel heavy, empty, or stuck"],
      ["craving","🌿","Something is pulling at me"],
      ["red","🛡️","I'm scared of what I might do"],
      ["cant","🤷","I can't tell"]
    ];
    return { close:true, body:`
      ${title("Which feels closest?")}
      <p class="sub">You don't have to explain everything.</p>
      <div class="list">${opts.map(([k,e,t]) =>
        `<button class="card${k === "red" ? " safety" : ""}" data-act="triagePick" data-arg="${k}"><span class="em" aria-hidden="true">${e}</span>${t}</button>`).join("")}
      </div>` };
  },

  before(){
    const [h, s] = BEFORE_HEAD[session.currentState] || ["",""];
    return { close:true, body:`
      ${title(h)}
      ${s ? `<p class="sub">${s}</p>` : ""}
      <h2>${session.currentState === "craving" ? "How strong is the craving right now?" : "How intense is this right now?"}</h2>
      <p class="small">Optional. You can skip this.</p>
      ${ratingRow(ui.rating, "calm", "the most intense")}`,
      actions:`<button class="btn btn-primary" data-act="beforeContinue">Continue</button>
        <button class="link" data-act="beforeSkip">Skip</button>` };
  },

  "anx-feet"(){
    return { close:true, body:`${stepTitle("Put both feet on the floor.")}<p class="sub">Just do this one thing.</p>`,
      actions:`<button class="btn btn-primary" data-act="feetDone">I've done it</button>` };
  },

  "anx-three"(){
    return { close:true, body:`
      ${stepTitle("Name 3 things you see.", true)}
      <p class="sub">Typing is optional. Saying them in your head works too.</p>
      <input class="field" id="three0" aria-label="Thing 1" autocomplete="off" maxlength="80">
      <input class="field" id="three1" aria-label="Thing 2" autocomplete="off" maxlength="80">
      <input class="field" id="three2" aria-label="Thing 3" autocomplete="off" maxlength="80">`,
      actions:`<button class="btn btn-primary" data-act="threeDone">Done</button>
        <button class="link" data-act="threeSkip">Skip</button>` };
  },

  "anx-steps"(){
    return { close:true, body:`${stepTitle("Take 10 slow steps.")}<p class="sub">Count them if it helps.</p>`,
      actions:`<button class="btn btn-primary" data-act="stepsDone">I took the steps</button>
        <button class="btn btn-secondary" data-act="palms">Press my palms together instead</button>` };
  },

  "anx-palms"(){
    return { close:true, body:`${stepTitle("Press your palms together for 10 seconds.", true)}
      <p class="sub">Firm, not painful. Notice the pressure.</p>
      <div class="count" id="count" aria-live="off">10</div>`,
      actions:`<button class="btn btn-primary" data-act="palmsDone">Done</button>` };
  },

  ground(){
    const g = GROUND[ui.groundIdx];
    const dots = ui.groundDots.map((on, i) =>
      `<button class="dot" data-act="dot" data-arg="${i}" aria-pressed="${on}" aria-label="Thing ${i + 1} of ${g.n}"></button>`).join("");
    const last = ui.groundIdx === GROUND.length - 1;
    return { close:!ui.noMode, body:`
      <p class="step-count">Part ${ui.groundIdx + 1} of 5</p>
      ${stepTitle(g.text, true)}
      <p class="sub">Tap a dot for each one. No need to type.</p>
      <div class="dots">${dots}</div>`,
      actions:`<button class="btn btn-primary" data-act="groundNext">${last ? "Done" : "Next"}</button>` };
  },

  checkin(){
    const crv = ui.checkinVariant === "craving";
    let note = ui.checkinNote;
    if (crv){
      const m = cravingMinutes();
      note = m >= 1 ? `You just put ${m} ${m === 1 ? "minute" : "minutes"} between the urge and the decision.` : "You took a moment before deciding.";
    }
    return { close:true, body:`
      ${note ? `<p class="notice">${esc(note)}</p>` : ""}
      ${title(crv ? "How strong is the craving now?" : "How do you feel now?")}
      <p class="sub">You can skip this.</p>
      ${ratingRow(ui.rating, "calm", "the most intense")}`,
      actions:`<button class="btn btn-primary" data-act="ciHelped">That helped</button>
        <button class="btn btn-secondary" data-act="ciBad">I still feel bad</button>
        ${crv ? `<button class="btn btn-secondary" data-act="crvMore">Add 5 more minutes</button>` : ""}
        <button class="link" data-act="ciSkip">Skip</button>` };
  },

  recommendation(){
    const r = ui.engine;
    const last = session.sessionHistory[session.sessionHistory.length - 1];
    let change = "";
    if (last && typeof last.before === "number" && typeof last.after === "number"){
      change = `<p class="notice">Change during this session: ${last.before} → ${last.after}</p>`;
    }
    const nonIdHelps = (getPlan().helps || []).filter(h => !findIntervention(h));
    const sugg = nonIdHelps.length ? nonIdHelps[ui.suggestIdx % nonIdHelps.length] : null;
    if (!r || !r.interventionId){
      return { close:true, body:`${change}${title("Nothing new to suggest right now.")}<p class="sub">You can stop here. That's okay.</p>`,
        actions:`<button class="btn btn-primary" data-act="home">Back to home</button>` };
    }
    const it = findIntervention(r.interventionId);
    const lead = ui.justStillBad ? `<p class="sub">Let's try something different.</p>` : "";
    const head = r.isPreviouslyHelpful
      ? `${title(esc(r.reason))}<p class="sub">Want to try it first?</p>`
      : `${title(esc(it.name))}<p class="sub">${esc(r.reason)} ${esc(it.description)}</p>`;
    return { close:true, body:`
      ${change}${lead}${head}
      ${sugg ? `<div class="panel"><h3>Something that helped you before: ${esc(helpLabel(sugg))}.</h3>
        <button class="btn btn-secondary" style="margin-top:10px" data-act="sugg" data-arg="${esc(sugg)}">I'll do that</button></div>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="recTry">${esc(it.tryLabel)}</button>
        <button class="btn btn-secondary" data-act="recElse">Something else</button>
        <button class="link" data-act="home">That's enough for now</button>` };
  },

  suggestion(){
    const t = SUGGESTION_TEXT[ui.sugg] || `Try this: ${helpLabel(ui.sugg)}.`;
    return { close:true, body:`${stepTitle(esc(t))}<p class="sub">From your list of things that help.</p>`,
      actions:`<button class="btn btn-primary" data-act="suggDone">Done</button>
        <button class="btn btn-secondary" data-act="suggElse">Something else</button>` };
  },

  intervention(){
    const it = findIntervention(session.currentInterventionId);
    if (!it) return SCREENS.home();
    const steps = it.steps;
    const i = Math.min(ui.step, steps.length - 1);
    const last = i === steps.length - 1;
    let extra = "";
    if (it.id === "connection"){
      const msg = session.yellow ? HARD_TIME_MSG : "hey";
      extra = `<div style="margin-top:20px">${personButtons(msg, false)}</div>
        <p class="note">ZigZag Mind never contacts anyone for you. These buttons open your phone.</p>`;
    }
    if (session.currentState === "craving"){
      extra += `<div class="safety-row" role="note">
        <a href="${LINKS.call911}">Already used, or took too much? Call 911.</a>
        <span>Shaking, sweating, confused, or seeing things? Withdrawal can be a medical emergency. Get medical help.</span>
        <a href="${LINKS.call988}">Call or text 988 for support.</a>
      </div>`;
    }
    return { close:true, body:`
      <p class="step-count">${esc(it.name)}${steps.length > 1 ? ` · Step ${i + 1} of ${steps.length}` : ""}</p>
      ${stepTitle(esc(steps[i]), it.id === "connection" || session.currentState === "craving")}
      ${extra}`,
      actions:`<button class="btn btn-primary" data-act="${last ? "ivDone" : "ivNext"}">${last ? "Done" : "Next"}</button>` };
  },

  "low-choose"(){
    return { close:true, body:`
      ${title("Let's do one tiny thing.")}
      <p class="sub">Pick whichever feels easiest.</p>
      <div class="list">
        <button class="card" data-act="lowPick" data-arg="hydration"><span class="em" aria-hidden="true">💧</span><span>Body<span class="meta">Drink water.</span></span></button>
        <button class="card" data-act="lowPick" data-arg="environment_change"><span class="em" aria-hidden="true">🪟</span><span>Space<span class="meta">Open a window or step outside.</span></span></button>
        <button class="card" data-act="lowPick" data-arg="connection"><span class="em" aria-hidden="true">💬</span><span>Connection<span class="meta">Text someone: hey</span></span></button>
      </div>` };
  },

  "spiral-input"(){
    return { close:true, body:`
      ${title("Let's get it out of your head.")}
      <label class="sub" for="thoughts">What's running through your mind? One thought per line.</label>
      <textarea class="field" id="thoughts" placeholder="I might lose my job&#10;I forgot to call back"></textarea>
      ${ui.msg ? `<p class="notice" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="spMake">Make cards</button>` };
  },

  "spiral-sort"(){
    const places = [["now","Now"],["later","Later"],["notmine","Not in my control"]];
    const allPlaced = ui.thoughts.every(t => t.place);
    const card = (t, idx) => `
      <div class="tcard${ui.landed === idx ? " landed" : ""}" data-idx="${idx}">
        <div class="tc-top">
          <span class="handle" data-drag="${idx}" aria-hidden="true">⠿</span>
          <div class="t">${esc(t.text)}</div>
        </div>
        <div class="seg" role="group" aria-label="Where does this go?">
          ${places.map(([k, l]) => `<button data-act="spPlace" data-arg="${idx}:${k}" aria-pressed="${t.place === k}">${l}</button>`).join("")}
        </div>
      </div>`;
    const list = place => ui.thoughts.map((t, idx) => ({ t, idx })).filter(x => x.t.place === place);
    const unsorted = list(null);
    const parked = list("notmine");
    return { close:true, body:`
      ${title("Where does each one go?")}
      <p class="sub">Drag a card by its handle into a box, or tap a button on the card.</p>
      ${unsorted.map(x => card(x.t, x.idx)).join("")}
      ${!unsorted.length ? `<p class="notice">Everything is sorted.</p>` : ""}
      <section class="zone now" data-zone="now" aria-label="Now">
        <h3>Now</h3><p class="zh">I can act on this.</p>
        ${list("now").map(x => card(x.t, x.idx)).join("")}
      </section>
      <section class="zone later" data-zone="later" aria-label="Later">
        <h3>Later</h3><p class="zh">Matters, just not today.</p>
        ${list("later").map(x => card(x.t, x.idx)).join("")}
      </section>
      <section class="zone park" data-zone="notmine" aria-label="Not in my control">
        <h3>Not in my control</h3><p class="zh">${parked.length ? `Parked: ${parked.length} ${parked.length === 1 ? "thing" : "things"} that aren't yours to fix right now.` : "Drop things here that you can't change right now."}</p>
        ${parked.map(x => `<div class="tchip"><span>${esc(x.t.text)}</span><button data-act="spPlace" data-arg="${x.idx}:notmine" aria-label="Unpark ${esc(x.t.text)}">Unpark</button></div>`).join("")}
      </section>`,
      actions:`<button class="btn btn-primary" data-act="spSortNext" ${allPlaced ? "" : "disabled"}>${allPlaced ? "Next" : "Sort each thought to continue"}</button>` };
  },

  "spiral-step"(){
    const now = ui.thoughts.filter(t => t.place === "now");
    if (!now.length){
      return { close:true, body:`${title("Nothing here needs doing right now.")}<p class="sub">You can let these wait.</p>`,
        actions:`<button class="btn btn-primary" data-act="spNone">Continue</button>` };
    }
    const pick = now[Math.min(ui.nowIdx, now.length - 1)];
    const chooser = now.length > 1 ? `<p class="small" style="margin-top:12px">Pick one to start with:</p>` +
      now.map((t, i) => `<button class="choice" data-act="spNowSel" data-arg="${i}" aria-pressed="${i === ui.nowIdx}">${esc(t.text)}</button>`).join("")
      : `<div class="tcard"><div class="t">${esc(pick.text)}</div></div>`;
    return { close:true, body:`
      ${title("What's the smallest step?")}
      ${chooser}
      <div class="stack" style="margin-top:16px">
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Put it on my calendar">Put it on my calendar</button>
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Text one person">Text one person</button>
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Write one sentence">Write one sentence</button>
      </div>
      <label class="small" for="ownstep" style="display:block;margin-top:16px">Or in your own words</label>
      <input class="field" id="ownstep" autocomplete="off" maxlength="120">
      ${ui.msg ? `<p class="notice" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="spOwn">Use my words</button>` };
  },

  "spiral-next"(){
    return { close:true, body:`
      ${title("Here's your one next step.")}
      <div class="nextcard">
        <div class="lbl">One next step</div>
        <div class="big">${esc(ui.nextStep)}</div>
        ${ui.nextFor ? `<div class="for">For: ${esc(ui.nextFor)}</div>` : ""}
      </div>
      <p class="note">Everything else can wait.</p>`,
      actions:`<button class="btn btn-primary" data-act="spNextDone">Continue</button>` };
  },

  "craving-delay"(){
    const left = (ui.cravingEnd || Date.now()) - Date.now();
    const done = left <= 0;
    const total = Math.max(CRAVING_MS, (ui.cravingEnd || 0) - (ui.cravingStart || 0));
    const frac = done ? 1 : 1 - left / total;
    const C = 2 * Math.PI * 100;
    const todo = CRAVING_STEPS.map(([k, t]) => `<button class="todo" data-act="crvStep" data-arg="${k}" aria-pressed="${!!(ui.cravingDone || {})[k]}">
        <span class="ck" aria-hidden="true">${(ui.cravingDone || {})[k] ? "✓" : ""}</span><span class="tx">${t}</span></button>`).join("");
    const p = person();
    return { close:true, body:`
      ${title(done ? "You gave it the time." : "Let's wait 15 minutes together.")}
      <p class="sub">The urge can rise and fall. You don't have to act on it.</p>
      <div class="ring-wrap" role="timer" aria-label="Time left">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="bg" cx="110" cy="110" r="100"/>
          <circle class="fg" id="crvRing" cx="110" cy="110" r="100" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/>
        </svg>
        <div class="ring-label"><span class="tm" id="crvTime">${done ? "Done" : fmtTime(left)}</span><span class="lb">${done ? "time's up" : "left"}</span></div>
      </div>
      <h2>While you wait</h2>
      <p class="small">Any of these, in any order. Skip what doesn't fit.</p>
      ${todo}
      <button class="todo" data-act="crvFocus"><span class="ck" aria-hidden="true"></span><span class="tx">Play the 1-minute Focus game</span></button>
      ${p ? `<a class="todo" href="${smsLink(p.phone, "Can you talk for a few minutes?")}"><span class="ck" aria-hidden="true"></span><span class="tx">Text ${esc(p.name)}</span></a>` : ""}
      <button class="btn btn-secondary" style="margin-top:16px" data-act="crvWave" aria-expanded="${!!ui.waveOpen}">${ui.waveOpen ? "Hide the wave" : "Ride the wave"}</button>
      ${ui.waveOpen ? `<div class="wave">
        <svg viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true"><g class="mv"><path d="M0 60 Q 50 20 100 60 T 200 60 T 300 60 T 400 60 T 500 60 T 600 60 T 700 60 T 800 60 V 90 H 0 Z"/></g></svg>
        <ol><li>Where do you feel it in your body?</li><li>Breathe into that spot.</li><li>Watch it rise and fall.</li></ol>
      </div>` : ""}
      <div class="safety-row" role="note">
        <a href="${LINKS.call911}">Already used, or took too much? Call 911.</a>
        <span>Shaking, sweating, confused, or seeing things? Withdrawal can be a medical emergency. Get medical help.</span>
        <a href="${LINKS.call988}">Call or text 988 for support.</a>
      </div>
      <div style="display:flex;justify-content:center;margin-top:8px"><button class="link" data-act="crvUsed">I already used</button></div>`,
      actions: done ? `<button class="btn btn-primary" data-act="crvCheck">Check in</button>`
        : `<button class="btn btn-secondary" data-act="crvCheck">Check in early</button>` };
  },

  "craving-used"(){
    return { close:true, body:`
      ${title("Thanks for telling me.")}
      <p class="sub">No judgment here. What matters is the next few minutes.</p>
      <div class="safety-row" role="note">
        <a href="${LINKS.call911}">Took too much, or feel unwell? Call 911.</a>
        <span>Shaking, sweating, confused, or seeing things? Withdrawal can be a medical emergency. Get medical help.</span>
        <a href="${LINKS.call988}">Call or text 988 for support.</a>
      </div>
      <h2>Want to do one small thing for the next 10 minutes?</h2>`,
      actions:`<button class="btn btn-primary" data-act="usedYes">Yes</button>
        <button class="btn btn-secondary" data-act="usedNo">Not right now</button>` };
  },

  focus(){
    return { close:true, body:`
      ${title("Tap when the dot is inside the ring.")}
      <p class="sub">No score. Just follow it.</p>
      <div class="focus-area" id="focusArea" tabindex="0" role="button" aria-label="Tap when the dot is inside the ring">
        <div class="track"></div><div class="target" id="focusTarget"></div><div class="orb" id="focusOrb"></div>
      </div>
      <div class="focus-meta"><span id="focusMsg" aria-live="polite"></span><span id="focusTime">1:00</span></div>`,
      actions:`<button class="btn btn-primary" data-act="focusDone">Done</button>` };
  },

  "distraction-choose"(){
    return { close:true, body:`
      ${title("Pick something to focus on.")}
      <div class="list">
        <button class="card" data-act="distFocus"><span class="em" aria-hidden="true">🎯</span><span>Focus<span class="meta">Tap when the dot reaches the ring. One minute.</span></span></button>
        <button class="card" data-act="distGround"><span class="em" aria-hidden="true">🖐️</span><span>Ground<span class="meta">Notice what's around you, one sense at a time.</span></span></button>
        <button class="card" data-act="distPark"><span class="em" aria-hidden="true">🗂️</span><span>Thought Parking<span class="meta">Get thoughts out of your head and sort them.</span></span></button>
        <button class="card" data-act="distQuick"><span class="em" aria-hidden="true">🧩</span><span>Quick distraction<span class="meta">A few small puzzles for your mind.</span></span></button>
      </div>` };
  },

  talk(){
    const msg = session.yellow ? HARD_TIME_MSG : "hey";
    return { close:false, body:`
      ${title("Talk to someone")}
      <p class="sub">ZigZag Mind never contacts anyone for you. These buttons open your phone.</p>
      ${person() ? `<h2>${esc(person().name)} <span class="small">(${esc(person().relationship)})</span></h2>${personButtons(msg, false)}` : `<p class="note">Add someone you trust (coming soon).</p>`}
      <h2>988 Suicide &amp; Crisis Lifeline</h2>
      <p class="small">Free, 24/7. Also for substance-use crises.</p>
      ${row988()}
      <a class="btn btn-secondary" style="margin-top:10px" href="${LINKS.chat988}" target="_blank" rel="noopener">Chat online with 988</a>`,
      actions:`<button class="btn btn-secondary" data-act="talkBack">Back</button>` };
  },

  crisis(){
    return { close:false, body:`
      ${title("I'm glad you told me.")}
      ${row988()}
      <div class="panel">
        <h3 style="font-size:20px;line-height:1.3">Are you in danger of hurting yourself or someone else right now?</h3>
        <div class="stack" style="margin-top:14px">
          <button class="btn btn-secondary" data-act="cYes">Yes</button>

  },

  "crisis-full"(){
    const p = person();
    return { close:false, body:`
      ${title("Please reach a person right now.")}
      <div class="stack" style="margin-top:12px">
        <a class="btn btn-safety two-line" href="${LINKS.call911}">Call 911<span class="cap">If someone is hurt, or someone else is in danger</span></a>
        ${row988().replace('style="margin-top:12px"', "")}
        <a class="btn btn-secondary" href="${LINKS.chat988}" target="_blank" rel="noopener">Chat online with 988</a>
        ${p ? personButtons(HARD_TIME_MSG, false) : `<p class="note">Add someone you trust (coming soon).</p>`}
        <button class="btn btn-secondary" data-act="cPlaces" aria-expanded="${ui.placesOpen}">Go where other people are</button>
        ${ui.placesOpen ? `<div class="panel" style="margin-top:0"><ul>${getPlan().places.length ? getPlan().places.map(x => `<li>${esc(x)}</li>`).join("") : "<li>A shop, a library, a friend's place — anywhere with people.</li>"}</ul></div>` : ""}
        <button class="btn btn-secondary" data-act="cPlan">Open my plan</button>
      </div>
      <p class="note">If you can, put distance between yourself and anything you could use to hurt yourself.</p>
      <p class="disclaimer">ZigZag Mind is not an emergency service.</p>
      <div style="display:flex;justify-content:center"><button class="link" data-act="cBack">That's not what I meant — go back</button></div>` };
  },

  "crisis-no"(){
    return { close:false, body:`
      ${title("Okay. Thank you for checking in with yourself.")}
      ${row988()}
      <h2>What would help right now?</h2>
      <div class="stack">
        <button class="btn btn-secondary" data-act="noTalk" aria-expanded="${ui.talkOpen}">Talk to someone</button>
        ${ui.talkOpen ? `<div class="panel" style="margin-top:0">${personButtons(HARD_TIME_MSG, true)}
          <p class="note" style="margin-bottom:0">ZigZag Mind never contacts anyone for you. These buttons open your phone.</p></div>` : ""}
        <button class="btn btn-secondary" data-act="noPlan">Open my plan</button>
        <button class="btn btn-secondary" data-act="noGround">Do something grounding</button>
      </div>
      <p class="disclaimer">ZigZag Mind is not an emergency service.</p>` };
  },

  "safety-check"(){
    return { close:false, body:`
      ${title("Do you feel safer than a few minutes ago?")}
      ${row988()}
      <div class="stack" style="margin-top:20px">
        <button class="btn btn-secondary" data-act="safeYes">Yes</button>
        <button class="btn btn-secondary" data-act="safeNo">No</button>
        <button class="btn btn-secondary" data-act="safeNotSure">Not sure</button>
      </div>
      <p class="disclaimer">ZigZag Mind is not an emergency service.</p>` };
  },

  plan(){

function computeProgress(){
  const since = Date.now() - 7 * 86400000;
  const hist = [ ...store.sensitive.baseHistory, ...session.sessionHistory ].filter(h => (h.timestamp || 0) >= since);
  const act = store.sensitive.activity.filter(a => a.ts >= since);
  const count = t => act.filter(a => a.type === t).length;
  const rated = hist.filter(h => typeof h.before === "number" && typeof h.after === "number");
  const by = {};
  rated.forEach(h => { if (!findIntervention(h.interventionId)) return; (by[h.interventionId] = by[h.interventionId] || []).push(h.before - h.after); });
  let best = null;
  Object.entries(by).forEach(([id, drops]) => {
    if (drops.length < 2) return;
    const avg = drops.reduce((a, b) => a + b, 0) / drops.length;
    if (avg > 0 && (!best || avg > best.avg)) best = { name:findIntervention(id).name, uses:drops.length, avg };
  });
  const r1 = x => Math.round(x * 10) / 10;
  return {
    moments:count("moment"), planUses:count("plan"), reach:count("reach"), actions:hist.length,
    best, rated:rated.length,
    avgBefore:rated.length ? r1(rated.reduce((a, h) => a + h.before, 0) / rated.length) : null,
    avgAfter:rated.length ? r1(rated.reduce((a, h) => a + h.after, 0) / rated.length) : null,
    hasSample:store.sensitive.baseHistory.some(h => h.source === "sample") || store.sensitive.activity.some(a => a.sample)
  };
}

function buildExport(){
  const strip = h => ({ state:h.state, interventionId:h.interventionId, before:h.before, after:h.after,
    date:h.timestamp ? new Date(h.timestamp).toISOString() : null, sample:h.source === "sample" || undefined });
  return {
    exportedAt:new Date().toISOString(),
    app:store.product.appVersion,
    plan:getPlan(),
    checkIns:[ ...store.sensitive.baseHistory, ...session.sessionHistory ].map(strip),
    activity:store.sensitive.activity.map(a => ({ type:a.type, date:new Date(a.ts).toISOString(), sample:a.sample || undefined }))
  };
}

/* ---------- SHELL ---------- */
const app = document.getElementById("app");
let lastRendered = null;
let palmsTimer = null;
let cravingTimer = null;
let focusRaf = null;

function cravingTick(){
  if (session.screen !== "craving-delay"){ clearInterval(cravingTimer); cravingTimer = null; return; }
  const left = ui.cravingEnd - Date.now();
  const tm = document.getElementById("crvTime");
  const ring = document.getElementById("crvRing");
  if (left <= 0){ clearInterval(cravingTimer); cravingTimer = null; render(); return; }
  if (tm) tm.textContent = fmtTime(left);
  if (ring){
    const C = 2 * Math.PI * 100;
    const total = Math.max(CRAVING_MS, ui.cravingEnd - ui.cravingStart);
    ring.setAttribute("stroke-dashoffset", (C * (left / total)).toFixed(1));
  }
}

function focusGeom(){
  const area = document.getElementById("focusArea"), orb = document.getElementById("focusOrb");
  if (!area || !orb) return null;
  return { area, orb, w:area.clientWidth, ow:orb.offsetWidth || 42 };
}
function focusLoop(ts){
  if (session.screen !== "focus"){ focusRaf = null; return; }
  const g = focusGeom();
  if (g){
    const t = (ts - ui.focusStart) / 1000;
    const period = reducedMotion() ? 8 : 4.5;
    const x = ((Math.sin(t * 2 * Math.PI / period) + 1) / 2) * (g.w - g.ow);
    const y = Math.sin(t * 2 * Math.PI / (period * 1.7)) * 18;
    ui.focusX = x;
    g.orb.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    const left = Math.max(0, 60 - t);
    const tEl = document.getElementById("focusTime");
    if (tEl) tEl.textContent = left > 0 ? fmtTime(left * 1000) : "That's a minute";
    if (left <= 0 && !ui.focusEndedMsg){
      ui.focusEndedMsg = true;
      const m = document.getElementById("focusMsg");
      if (m) m.textContent = "Stop whenever you like.";
    }
  }
  focusRaf = requestAnimationFrame(focusLoop);
}
function focusTap(){
  const g = focusGeom();
  if (!g) return;
  const orbCenter = (ui.focusX || 0) + g.ow / 2;
  if (Math.abs(orbCenter - g.w / 2) <= 24){
    const tg = document.getElementById("focusTarget"), m = document.getElementById("focusMsg");
    if (tg){ tg.classList.remove("hit"); void tg.offsetWidth; tg.classList.add("hit"); }
    if (m) m.textContent = "Nice.";
    buzz();
    clearTimeout(ui.focusMsgTimer);
    ui.focusMsgTimer = setTimeout(() => { const mm = document.getElementById("focusMsg"); if (mm && mm.textContent === "Nice.") mm.textContent = ""; }, 900);
  }
}

function render(){
  const s = session.screen;
  const def = (SCREENS[s] || SCREENS.home)();
  const changed = s !== lastRendered;
  const crisis = CRISIS_SCREENS.includes(s);
  document.documentElement.classList.toggle("crisis-mode", crisis);
  const showY = session.yellow && !NO_YBAR.includes(s);
  app.innerHTML = `
    <header class="top">${topBar(def)}${showY ? yellowBar() : ""}</header>
    <main class="screen${changed && !crisis ? " enter" : ""}">
      <div class="content">${def.body}</div>
      ${def.actions ? `<div class="actions">${def.actions}</div>` : ""}
    </main>
    ${def.nav ? tabBar() : ""}
    ${session.devPanelOpen ? devPanel() : ""}`;
  if (changed){
    window.scrollTo(0, 0);
    const h = document.getElementById("screen-title");
    if (h) h.focus({ preventScroll:true });
    lastRendered = s;
    clearInterval(palmsTimer); palmsTimer = null;
    clearInterval(cravingTimer); cravingTimer = null;
    if (focusRaf){ cancelAnimationFrame(focusRaf); focusRaf = null; }
    if (s === "craving-delay") cravingTimer = setInterval(cravingTick, 1000);
    if (s === "focus"){ if (!ui.focusStart) ui.focusStart = performance.now(); focusRaf = requestAnimationFrame(focusLoop); }
    if (s === "anx-palms"){
      let n = 10;
      palmsTimer = setInterval(() => {
        n--; const el = document.getElementById("count");
        if (el) el.textContent = Math.max(n, 0);
        if (n <= 0){ clearInterval(palmsTimer); palmsTimer = null; if (el) el.textContent = "✓"; }
      }, 1000);
    }
  }
}

    clearTimeout(ui.tapTimer);
    ui.tapTimer = setTimeout(() => { ui.taps = 0; }, 1500);
    if (ui.taps >= 5){ ui.taps = 0; dispatch({ type:"TOGGLE_DEV_PANEL" }); render(); }
  },
  devClose(){ dispatch({ type:"TOGGLE_DEV_PANEL" }); render(); },
  tab(arg){ if (arg === "plan") ui.planFrom = "tab"; ui.flash = ""; go(arg); },
  home(){ go("home"); },
  crisis(){ openCrisis(); },
  triage(){ if (blockIfRed()) return; go("triage"); },
  flow(arg){ startFlow(arg); },
  triagePick(arg){
    if (arg === "red"){ applySafetyResult("RED"); return; }
    if (arg === "cant"){ startFlow("low", { firstHydration:true }); return; }
    startFlow(arg);
  },
  rate(arg){ const v = Number(arg); ui.rating = ui.rating === v ? null : v; render(); },

  beforeContinue(){
    const v = typeof ui.rating === "number" ? ui.rating : null;
    dispatch({ type:"SET_BEFORE_RATING", value:v });
    if (typeof v === "number" && v >= 9) recordHighRating();
    ui.rating = null;
    beginAfterBefore();
  },
  beforeSkip(){ dispatch({ type:"SET_BEFORE_RATING", value:null }); ui.rating = null; beginAfterBefore(); },

  feetDone(){ if (blockIfRed()) return; buzz(); go("anx-three"); },
  threeDone(){
    if (blockIfRed()) return;
    const texts = [0,1,2].map(i => (document.getElementById("three" + i) || {}).value || "").map(t => t.trim()).filter(Boolean);
    for (const text of texts){
      const r = handleSafeTextSubmit({ text, onGreen(){}, onYellow(){ applySafetyResult("YELLOW"); }, onRed(){ applySafetyResult("RED"); } });
      if (r === "RED") return;
    }
    go("anx-steps");
  },
  threeSkip(){ if (blockIfRed()) return; go("anx-steps"); },
  stepsDone(){ if (blockIfRed()) return; startGround(); },
  palms(){ if (blockIfRed()) return; go("anx-palms"); },
  palmsDone(){ if (blockIfRed()) return; startGround(); },
  dot(arg){ const i = Number(arg); ui.groundDots[i] = !ui.groundDots[i]; if (ui.groundDots[i]) buzz(); render(); },
  groundNext(){
    if (blockIfRed()) return;
    if (ui.groundIdx < GROUND.length - 1){
      ui.groundIdx++;
      ui.groundDots = Array(GROUND[ui.groundIdx].n).fill(false);
      lastRendered = null; render();
    } else finishGround();
  },

  ciHelped(){ completeCheckIn({ after:ui.rating, action:"helped" }); },
  ciBad(){ completeCheckIn({ after:ui.rating, action:"still_bad" }); },
  ciSkip(){ completeCheckIn({ after:null, action:"skip" }); },

  recTry(){ if (!ui.engine || !ui.engine.interventionId) return; ui.justStillBad = false; startIntervention(ui.engine.interventionId); },
  recElse(){ somethingElse(); },
  sugg(arg){ if (blockIfRed()) return; ui.sugg = arg; go("suggestion"); },
  suggDone(){
    if (blockIfRed()) return;
    logActivity("plan");
    dispatch({ type:"SET_CURRENT_INTERVENTION", id:"playbook:" + ui.sugg });
    go("checkin");
  },
  suggElse(){ ui.suggestIdx++; go("recommendation"); },

  ivNext(){ if (blockIfRed()) return; buzz(); ui.step++; lastRendered = null; render(); },
  ivDone(){
    if (blockIfRed()) return;
    if (session.currentState === "low") ui.checkinNote = "That was one small step.";
    go("checkin");
  },
  lowPick(arg){ startIntervention(arg); },

  spMake(){
    if (blockIfRed()) return;
    const raw = (document.getElementById("thoughts") || {}).value || "";
    const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
    if (!lines.length){ ui.msg = "Write at least one thought, one per line."; render(); return; }
    for (const text of lines){
      const r = handleSafeTextSubmit({ text, onGreen(){}, onYellow(){ applySafetyResult("YELLOW"); }, onRed(){ applySafetyResult("RED"); } });
      if (r === "RED") return;               // no cards are created
    }
    ui.msg = "";
    ui.thoughts = lines.slice(0, 12).map(text => ({ text, place:null }));
    go("spiral-sort");
  },
  spPlace(arg){
    const [i, place] = arg.split(":");
    const t = ui.thoughts[Number(i)];
    if (t) t.place = t.place === place ? null : place;
    ui.landed = t && t.place ? Number(i) : null;
    render();
    ui.landed = null;
  },
  spUnpark(){ ui.thoughts.forEach(t => { if (t.place === "notmine") t.place = null; }); render(); },
  spSortNext(){ if (blockIfRed()) return; if (!ui.thoughts.every(t => t.place)) return; ui.nowIdx = 0; ui.msg = ""; go("spiral-step"); },
  spNowSel(arg){ ui.nowIdx = Number(arg); render(); },
  spTemplate(arg){
    if (blockIfRed()) return;
    const now = ui.thoughts.filter(t => t.place === "now");
    ui.nextStep = arg + ".";
    ui.nextFor = now[Math.min(ui.nowIdx, now.length - 1)].text;
    go("spiral-next");
  },
  spOwn(){
    if (blockIfRed()) return;
    const text = ((document.getElementById("ownstep") || {}).value || "").trim();
    if (!text){ ui.msg = "Type a step, or tap one of the options above."; render(); return; }
    const r = handleSafeTextSubmit({ text, onGreen(){}, onYellow(){ applySafetyResult("YELLOW"); }, onRed(){ applySafetyResult("RED"); } });
    if (r === "RED") return;
    const now = ui.thoughts.filter(t => t.place === "now");
    ui.msg = ""; ui.nextStep = text; ui.nextFor = now[Math.min(ui.nowIdx, now.length - 1)].text;
    go("spiral-next");
  },
  spNone(){ if (blockIfRed()) return; ui.nextStep = "Let the rest wait for now."; ui.nextFor = ""; go("spiral-next"); },
  spNextDone(){ if (blockIfRed()) return; go("checkin"); },

  distGround(){ startIntervention("grounding", { route:"ground" }); },
  distFocus(){ ui.focusReturn = null; startIntervention("distraction_game", { route:"focus" }); },
  distPark(){ startIntervention("thought_parking"); },

  crvStep(arg){ ui.cravingDone = ui.cravingDone || {}; ui.cravingDone[arg] = !ui.cravingDone[arg]; render(); },
  crvWave(){ ui.waveOpen = !ui.waveOpen; render(); },
  crvFocus(){ if (blockIfRed()) return; ui.focusReturn = "craving"; ui.focusStart = null; go("focus"); },
  crvCheck(){ if (blockIfRed()) return; ui.checkinVariant = "craving"; ui.rating = null; go("checkin"); },
  crvMore(){
    if (blockIfRed()) return;
    ui.cravingEnd = Math.max(Date.now(), ui.cravingEnd || 0) + 5 * 60 * 1000;
    ui.checkinVariant = null; go("craving-delay");
  },
  crvUsed(){ if (blockIfRed()) return; go("craving-used"); },
  usedYes(){
    if (blockIfRed()) return;
    recordUsed();
    dispatch({ type:"SET_BEFORE_RATING", value:null });
    ui.exclude = ["craving_delay"]; ui.justStillBad = false;
    runEngine(); go("recommendation");
  },
  usedNo(){ recordUsed(); go("home"); },

  focusDone(){
    if (blockIfRed()) return;
    if (ui.focusReturn === "craving"){ ui.focusReturn = null; ui.cravingDone = ui.cravingDone || {}; go("craving-delay"); return; }
    go("checkin");
  },
  distQuick(){ startIntervention("distraction_game"); },

  talk(){ ui.prevScreen = session.screen; go("talk"); },
  talkBack(){ go(ui.prevScreen || "home"); },

  cYes(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"RED" }); ui.placesOpen = false; go("crisis-full"); },
  cNotSure(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"RED" }); ui.placesOpen = false; go("crisis-full"); },
  cNo(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"YELLOW" }); ui.talkOpen = false; go("crisis-no"); },
  cBack(){ exitCrisis(); },
  cPlaces(){ ui.placesOpen = !ui.placesOpen; render(); },
  cPlan(){ ui.planFrom = "crisis"; logActivity("plan"); go("plan"); },

  noTalk(){ ui.talkOpen = !ui.talkOpen; render(); },
  noPlan(){ ui.planFrom = "no"; logActivity("plan"); go("plan"); },
  noGround(){ ui.noMode = true; startGround(); },
  planDone(){ go(ui.planFrom === "no" ? "safety-check" : "crisis-full"); },

  safeYes(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"YELLOW" }); go("home"); },
  safeNo(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"RED" }); ui.placesOpen = false; go("crisis-full"); },
  safeNotSure(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"RED" }); ui.placesOpen = false; go("crisis-full"); },

  planEdit(arg){
    const pb = getPlan();
    ui.editSection = arg; ui.formErr = ""; ui.flash = "";
    ui.draftHelps = [ ...pb.helps ]; ui.customDraft = "";
    ui.peopleDraft = null; ui.proDraft = null;
    go("plan-edit");
  },
  planCancel(){ ui.formErr = ""; ui.planFrom = "tab"; go("plan"); },
  helpToggle(arg){
    const c = document.getElementById("edCustom"); if (c) ui.customDraft = c.value;
    const d = ui.draftHelps;
    const i = d.indexOf(arg);
    if (i >= 0) d.splice(i, 1); else d.push(arg);
    render();
  },
  helpAdd(){
    const c = document.getElementById("edCustom");
    const v = (c ? c.value : "").trim().toLowerCase().slice(0, 40);
    ui.customDraft = "";
    if (v && !ui.draftHelps.includes(v)) ui.draftHelps.push(v);
    render();
  },
  planSave(){
    // My Plan fields are deliberately NOT run through safetyCheck.
    const pb = getPlan(), key = ui.editSection;
    const sec = PLAN_SECTIONS.find(x => x[0] === key);
    if (!sec) return;
    const val = id => ((document.getElementById(id) || {}).value || "").trim();
    const kind = sec[2];
    if (kind === "list"){
      pb[key] = val("edList").split("\n").map(x => x.trim().slice(0, 120)).filter(Boolean).slice(0, 10);
    } else if (kind === "text"){
      pb[key] = val("edText").slice(0, 300);
    } else if (kind === "helps"){
      const extra = val("edCustom").toLowerCase().slice(0, 40);
      if (extra && !ui.draftHelps.includes(extra)) ui.draftHelps.push(extra);
      pb.helps = [ ...ui.draftHelps ];
    } else if (kind === "people"){
      const people = [];
      ui.peopleDraft = [0,1,2].map(i => ({ name:val("pn" + i), phone:val("pp" + i), relationship:val("pr" + i) }));
      for (let i = 0; i < 3; i++){
        const name = val("pn" + i).slice(0, 40), phone = val("pp" + i).slice(0, 20), relationship = val("pr" + i).slice(0, 30);
        if (!name && !phone && !relationship) continue;
        if (!name || phone.replace(/\D/g, "").length < 7){
          ui.formErr = `Person ${i + 1} needs a name and a phone number with at least 7 digits.`;
          render(); return;
        }
        people.push({ name, phone, relationship });
      }
      pb.trustedPeople = people;
    } else if (kind === "pro"){
      const name = val("proN").slice(0, 40), phone = val("proP").slice(0, 20);
      ui.proDraft = { name, phone };
      if (phone && phone.replace(/\D/g, "").length < 7){ ui.formErr = "That phone number needs at least 7 digits."; render(); return; }
      pb.professional = { name, phone };
    }
    saveStore();
    ui.peopleDraft = null; ui.proDraft = null;
    ui.formErr = ""; ui.flash = "Saved."; ui.planFrom = "tab";
    go("plan");
  },
  exportData(){ ui.flash = ""; go("export"); },
  copyExport(){
    const box = document.getElementById("exportBox");
    const text = box ? box.value : "";
    const done = () => { ui.flash = "Copied."; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, () => { if (box){ box.focus(); box.select(); } ui.flash = "Select all and copy."; render(); });
    } else if (box){ box.focus(); box.select(); ui.flash = "Select all and copy."; render(); }
  },
  toSettings(){ ui.flash = ""; go("settings"); },
  askDelete(){ ui.flash = ""; go("confirm-delete"); },
  deleteAll(){
    store.sensitive = { plan:emptyPlan(), baseHistory:[], activity:[] };
    saveStore();
    dispatch({ type:"DELETE_DATA" });
    ui.engine = null;
    ui.flash = "Everything was deleted.";
    go("settings");
  },
  loadSample(){
    store.sensitive = { plan:samplePlan(), baseHistory:seedHistory(), activity:seedActivity() };
    saveStore();
    ui.flash = "Sample data loaded.";
    render();
  },
  about(){ ui.flash = ""; go("about"); },
  howScroll(){ const el = document.getElementById("how"); if (el) el.scrollIntoView({ behavior:reducedMotion() ? "auto" : "smooth" }); },
  motion(arg){ prefs.reduce = arg === "reduce"; document.documentElement.classList.toggle("reduce", prefs.reduce); savePrefs(); render(); },
  haptics(arg){ prefs.haptics = arg === "on"; if (prefs.haptics) buzz(); savePrefs(); render(); },
  persist(arg){
    persistOn = arg === "on";
    if (persistOn){ saveStore(); ui.flash = "Saving is on. Your data stays on this device."; }
    else { clearSaved(); ui.flash = "Saving is off. Saved data was removed from this device."; }
    savePrefs(); render();
  },

  theme(arg){
    ui.theme = arg;
    if (arg === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = arg;
    savePrefs();
    render();
  }
};

document.addEventListener("click", e => {
  const link = e.target.closest("a[href]");
  if (link && /^(tel:|sms:|https:\/\/988lifeline)/.test(link.getAttribute("href"))) logActivity("reach");
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  // NO-branch Call/Text: let the phone link open, and set the safety question
  // as the current screen in the same handler so it is waiting on return.
  if (el.hasAttribute("data-noexit")){
    dispatch({ type:"SET_SCREEN", screen:"safety-check" });
    setTimeout(render, 400);
    return;
  }
  if (el.tagName === "A") return;
  e.preventDefault();
  const fn = ACTIONS[act];
  if (fn) fn(el.getAttribute("data-arg"), el, e);
});

/* Focus game input */
document.addEventListener("pointerdown", e => {
  if (session.screen === "focus" && e.target.closest("#focusArea")){ e.preventDefault(); focusTap(); }
});
document.addEventListener("keydown", e => {
  if (session.screen === "focus" && document.activeElement && document.activeElement.id === "focusArea" && (e.key === " " || e.key === "Enter")){
    e.preventDefault(); focusTap();
  }
});

/* Thought Parking drag (handle only; tap buttons remain the accessible path) */
let drag = null;
document.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-drag]");
  if (!h || session.screen !== "spiral-sort") return;
  const card = h.closest(".tcard");
  if (!card) return;
  e.preventDefault();
  try { h.setPointerCapture(e.pointerId); } catch(_){}
  drag = { idx:Number(h.getAttribute("data-drag")), card, x0:e.clientX, y0:e.clientY, sy0:window.scrollY, zone:null };
  card.classList.add("dragging");
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0 + (window.scrollY - drag.sy0);
  drag.card.style.transform = `translate(${e.clientX - drag.x0}px, ${dy}px)`;
  drag.card.style.pointerEvents = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const zone = under && under.closest("[data-zone]");
  document.querySelectorAll(".zone.over").forEach(z => { if (z !== zone) z.classList.remove("over"); });
  if (zone) zone.classList.add("over");
  drag.zone = zone ? zone.getAttribute("data-zone") : null;
  if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 12);
  else if (e.clientY < 120) window.scrollBy(0, -12);
});
function endDrag(){
  if (!drag) return;
  const d = drag; drag = null;
  d.card.classList.remove("dragging");
  d.card.style.transform = ""; d.card.style.pointerEvents = "";
  document.querySelectorAll(".zone.over").forEach(z => z.classList.remove("over"));
  const t = ui.thoughts[d.idx];
  if (d.zone && t && t.place !== d.zone){
    t.place = d.zone;
    ui.landed = d.idx;
    render();
    ui.landed = null;
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

loadStore();
if (savedTheme && savedTheme !== "auto"){ ui.theme = savedTheme; document.documentElement.dataset.theme = savedTheme; }
document.documentElement.classList.toggle("reduce", !!prefs.reduce);
render();
</script>

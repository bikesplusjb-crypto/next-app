<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6F4EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ZigZag Mind">
<title>ZigZag Mind — Get through what's happening right now</title>
<style>
:root{
  --bg:#F7F4EE;--surface:#FFFFFF;--text:#252A2D;--text-muted:#667078;
  --primary:#356F6A;--on-primary:#FFFFFF;--primary-soft:#E2EEEA;
  --accent:#A9A4D6;--accent-soft:#EEEDF8;--accent-ink:#6E68B5;--secondary-accent:#91AFC0;
  --safety:#B85C43;--on-safety:#FFFFFF;--safety-soft:#F5E4DE;
  --line:#E3DED5;--border:var(--line);--focus:#6C63C7;
  --serif:"New York","Iowan Old Style","Charter","Georgia","Times New Roman",serif;
  --card-shadow:0 1px 2px rgba(37,42,45,.04),0 10px 28px rgba(37,42,45,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171A1C;--surface:#202427;--text:#EEECE6;--text-muted:#A7ADB0;
    --primary:#79BDB5;--on-primary:#171A1C;--primary-soft:#203936;
    --accent:#AAA4DD;--accent-soft:#2A2840;--accent-ink:#AAA4DD;--secondary-accent:#91AFC0;
    --safety:#E79570;--on-safety:#171A1C;--safety-soft:#3A241D;
    --line:#2E3438;--focus:#AAA4DD;--card-shadow:none;--zag-dark:#BFE6E0;--zag-eye:#12151A;--zag-cheek:#E59A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171A1C;--surface:#202427;--text:#EEECE6;--text-muted:#A7ADB0;
  --primary:#79BDB5;--on-primary:#171A1C;--primary-soft:#203936;
  --accent:#AAA4DD;--accent-soft:#2A2840;--accent-ink:#AAA4DD;--secondary-accent:#91AFC0;
  --safety:#E79570;--on-safety:#171A1C;--safety-soft:#3A241D;
  --line:#2E3438;--focus:#AAA4DD;--card-shadow:none;--zag-dark:#BFE6E0;--zag-eye:#12151A;--zag-cheek:#E59A80;
  color-scheme:dark;
}
:root.crisis-mode{--bg:var(--safety-soft)}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;min-height:68px}
.icon-btn{width:48px;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-size:24px;line-height:1;display:grid;place-items:center}
.spacer{width:48px;height:48px}
.help-pill{min-height:48px;padding:0 16px 0 12px;border-radius:24px;border:1.5px solid var(--safety);background:var(--safety-soft);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.help-pill svg{width:20px;height:20px;flex:none}

.ybar{margin:0 20px 8px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--safety)}
.ybar p{margin:0 0 8px;font-weight:600;font-size:15px}
.ybar .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0 10px;text-align:center}
.chip.safety{background:var(--safety);color:var(--on-safety);border-color:var(--safety)}

main.screen{flex:1;display:flex;flex-direction:column;padding:4px 20px 0}
main.screen.enter{animation:enter .25s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.content{flex:1;padding-bottom:16px}
.actions{position:sticky;bottom:0;padding:20px 0 16px;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 20px);display:flex;flex-direction:column;gap:10px}

h1{font-size:28px;line-height:1.2;font-weight:650;letter-spacing:-.01em;margin:8px 0 8px}
h2{font-size:20px;line-height:1.25;font-weight:650;margin:28px 0 10px}
p{margin:0 0 12px}
.sub{color:var(--text-muted);font-size:15px}
.small{font-size:15px;color:var(--text-muted)}
.step-big{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:12vh 0 14px}
.step-big.tight{margin-top:24px}
.step-count{font-size:13px;color:var(--text-muted);margin-top:8px}

.hero{padding:20px 0 8px}
.brand{background:none;border:none;padding:0;color:var(--primary);
  font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  font-size:38px;font-weight:600;letter-spacing:-.01em;line-height:1;min-height:48px}
.hero .sub{margin:6px 0 0;font-size:17px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{min-height:108px;border-radius:20px;background:var(--surface);border:1px solid var(--line);
  padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-weight:600;font-size:17px;line-height:1.25}
.card .em{font-size:28px;line-height:1}
.card.wide{grid-column:1 / -1;min-height:76px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.card.safety{background:var(--safety-soft);border:1.5px solid var(--safety)}
.card .meta{display:block;font-weight:400;font-size:15px;color:var(--text-muted);margin-top:2px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.list .card{min-height:68px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}

.btn{min-height:56px;border-radius:16px;font-weight:600;font-size:17px;border:none;width:100%;padding:0 20px;
  display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn-safety{background:var(--safety);color:var(--on-safety)}
.btn-outline{background:var(--surface);color:var(--text);border:1.5px solid var(--safety)}
.btn:disabled{opacity:.45;cursor:default}
.btn .cap{display:block;font-weight:400;font-size:13px;opacity:.9}
.btn.two-line{flex-direction:column;gap:0;padding:8px 20px}
.link{background:none;border:none;color:var(--text-muted);text-decoration:underline;font-size:15px;min-height:48px;padding:0 8px;align-self:center}
.stack{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.rating{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.rate{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:17px}
.rate[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-top:8px}

.field{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;padding:12px 14px;margin-top:10px}
textarea.field{min-height:150px;resize:vertical}
.notice{border-radius:14px;padding:12px 14px;background:var(--primary-soft);font-size:15px;margin-top:12px}

.dots{display:flex;flex-wrap:wrap;gap:14px;margin:28px 0 8px}
.dot{width:60px;height:60px;border-radius:50%;border:2px solid var(--accent-ink);background:transparent;transition:background .2s ease,transform .2s ease}
.dot[aria-pressed="true"]{background:var(--accent-ink);transform:scale(.94)}
.count{font-size:72px;font-weight:600;color:var(--primary);text-align:center;margin:28px 0 0;font-variant-numeric:tabular-nums}

.tcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;transition:opacity .3s ease,transform .3s ease}
.tcard .t{font-weight:600;word-break:break-word}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.seg button{min-height:48px;font-size:13px;line-height:1.2;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;padding:4px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.parked{margin-top:16px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line);color:var(--text-muted);font-size:15px}
.choice{display:block;width:100%;text-align:left;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;margin-top:8px;font-weight:600}
.choice[aria-pressed="true"]{border:2px solid var(--primary);background:var(--primary-soft)}
.nextcard{background:var(--primary-soft);border-radius:20px;padding:28px 22px;margin-top:20px}
.nextcard .lbl{font-size:15px;color:var(--text-muted);margin-bottom:8px}
.nextcard .big{font-size:28px;line-height:1.25;font-weight:600}
.nextcard .for{font-size:15px;color:var(--text-muted);margin-top:12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.panel h3{margin:0 0 6px;font-size:17px}
.panel ul{margin:6px 0 0;padding-left:20px}
.note{font-size:15px;color:var(--text-muted);margin-top:16px}
.safety-row{display:grid;gap:8px;margin-top:20px;padding:14px;border-radius:16px;border:1.5px solid var(--safety);background:var(--surface);font-size:15px}
.safety-row a{font-weight:600}
.disclaimer{font-size:13px;color:var(--text-muted);text-align:center;margin:16px 0 0}

.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);z-index:5}
.tab{min-height:58px;background:none;border:none;font-size:13px;font-weight:600;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab[aria-current="page"]{color:var(--primary)}
.tab .bar{width:20px;height:3px;border-radius:2px;background:transparent}
.tab[aria-current="page"] .bar{background:var(--primary)}

.seg-theme{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.seg-theme button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg-theme button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

.dev{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:406px;margin:0 auto;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2);max-height:60%;overflow:auto}
.dev dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 10px}
.dev dt{color:var(--text-muted)}
.dev dd{margin:0;font-weight:600;word-break:break-word}
.dev .hd{display:flex;justify-content:space-between;align-items:center}
.dev .hd button{min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px;font-size:13px;font-weight:600}

/* Stage 3: craving timer */
.ring-wrap{position:relative;width:220px;height:220px;margin:16px auto 4px}
.ring{width:220px;height:220px;display:block}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--primary);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label .tm{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.ring-label .lb{font-size:15px;color:var(--text-muted);margin-top:6px}
.todo{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;margin-top:8px;text-align:left;font-weight:600;text-decoration:none}
.todo .ck{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--primary);display:grid;place-items:center;font-size:15px;color:var(--on-primary)}
.todo[aria-pressed="true"] .ck{background:var(--primary)}
.todo[aria-pressed="true"] .tx{color:var(--text-muted);text-decoration:line-through}
.wave{margin-top:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;padding-bottom:14px}
.wave svg{display:block;width:100%;height:90px}
.wave .mv{animation:waveMove 7s ease-in-out infinite alternate}
.wave path{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2}
@keyframes waveMove{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.wave ol{margin:6px 0 0;padding:0 18px 0 38px}
.wave li{margin-top:6px}
/* Stage 3: focus game */
.focus-area{position:relative;height:230px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-top:20px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.focus-area .track{position:absolute;left:28px;right:28px;top:50%;height:2px;background:var(--line)}
.target{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;border:3px solid var(--accent-ink)}
.target.hit{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 var(--accent-soft)}50%{transform:scale(1.12);box-shadow:0 0 0 14px var(--accent-soft)}100%{transform:scale(1);box-shadow:0 0 0 0 transparent}}
.orb{position:absolute;top:50%;left:0;width:42px;height:42px;margin-top:-21px;border-radius:50%;background:var(--primary);will-change:transform}
.focus-meta{display:flex;justify-content:space-between;margin-top:12px;font-size:15px;color:var(--text-muted);min-height:22px}
/* Stage 3: thought parking drag */
.tc-top{display:flex;gap:12px;align-items:center}
.handle{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--text-muted);touch-action:none;cursor:grab;font-size:22px;background:var(--bg);border:1px solid var(--line)}
.tcard.dragging{position:relative;z-index:30;box-shadow:0 14px 34px rgba(0,0,0,.22);transition:none;opacity:.96}
.zone{border-radius:20px;padding:14px;margin-top:14px;border:2px solid transparent;min-height:84px;transition:border-color .15s ease,background .15s ease}
.zone.now{background:var(--primary-soft)}
.zone.later{background:var(--surface);border-color:var(--line)}
.zone.park{border:2px dashed var(--line)}
.zone.over{border-color:var(--primary)!important;border-style:solid!important}
.zone h3{margin:0;font-size:17px}
.zone .zh{font-size:13px;color:var(--text-muted);margin:2px 0 0}
.zone .tcard{margin-top:10px}
.tchip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 6px 6px 12px;margin-top:8px;border-radius:12px;background:var(--bg);font-size:15px;color:var(--text-muted);animation:park .4s ease-out}
.tchip button{min-height:40px;border:none;background:none;text-decoration:underline;color:var(--text-muted);font-size:13px;padding:0 8px}
@keyframes park{from{transform:scale(1.06);opacity:.4}to{transform:scale(1);opacity:1}}
.landed{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(1.04)}100%{transform:scale(1)}}

/* Stage 4 */
:root.reduce *,:root.reduce *::before,:root.reduce *::after{animation:none!important;transition:none!important}
.plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.edit-btn{min-height:44px;min-width:64px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;padding:0 12px;flex:none}
.empty{color:var(--text-muted);font-size:15px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hchip{min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:600;font-size:15px}
.hchip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.hchip .x{margin-left:6px;opacity:.8}
.fieldset{border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;margin-top:14px;background:var(--surface)}
.fieldset legend{font-weight:600;font-size:15px;padding:0 6px}
.fieldset label{display:block;font-size:13px;color:var(--text-muted);margin-top:10px}
.fieldset .field{margin-top:4px}
.err{color:var(--safety);font-weight:600;font-size:15px;margin-top:12px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:none}
.stat .n{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--primary);min-width:2ch;text-align:right}
.big-change{font-size:34px;font-weight:650;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.about-hero{padding:28px 0 8px}
.about-hero .brand{font-size:44px;line-height:1.05}
.about-hero .tag{font-size:24px;line-height:1.25;font-weight:600;margin:14px 0 8px}
.crisis-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;background:var(--safety-soft);border:1.5px solid var(--safety);margin-top:16px;font-size:15px;font-weight:600}
.crisis-bar a{white-space:nowrap}
.how{counter-reset:how;list-style:none;padding:0;margin:8px 0 0}
.how li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.how li::before{counter-increment:how;content:counter(how);width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:650;display:grid;place-items:center}
.how b{display:block}
.flash{border-radius:14px;padding:12px 14px;background:var(--primary-soft);font-size:15px;font-weight:600;margin-top:12px}

/* Stage 6.1: Home */
.home-hero{padding:4px 0 0}
.home-hero .brand{font-size:34px}
h1.home-tag{font-size:22px;font-weight:500;line-height:1.25;letter-spacing:-.01em;color:var(--text);margin:4px 0 0}
.home-sub{font-size:15px;line-height:1.4;color:var(--text-muted);margin:2px 0 0}
/* Large text (about 200%): keep "I don't feel safe" on the first screen. */
@media (max-width:320px){.home-sub,.home-hero .zz{display:none}h1.home-tag{font-size:18px}}
.btn-big{min-height:72px;font-size:19px;border-radius:20px;margin-top:10px}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.route{min-height:80px;border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:10px 14px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;font-weight:600;font-size:17px;line-height:1.25;text-align:left}
.ico{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary);flex:none}
.ico svg{width:22px;height:22px}
.ico.alt{background:var(--accent-soft);color:var(--accent-ink)}
.route .ico{width:34px;height:34px;border-radius:10px}
.route .ico svg{width:20px;height:20px}
.ico.safety{background:var(--surface);color:var(--safety)}
.lbl{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:14px 0 8px}
.sits{display:flex;flex-wrap:wrap;gap:8px}
.home-safe{width:100%;margin-top:12px;min-height:68px}
.home-safe + .btn-big{margin-top:12px}
/* Large text (200% makes a 390px phone ~195px wide): keep "I don't feel safe" compact so it fits on the first screen. */
@media (max-width:320px){.home-safe{padding:10px 12px;gap:10px;min-height:0}.home-safe .ico{width:30px;height:30px;border-radius:9px}.home-safe .ico svg{width:18px;height:18px}.home-safe .meta{font-size:13px}}

.shapes .shape svg{width:40px;height:40px}
.shapes button.shape[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary)}

/* Donation link (Settings and About only) */
.donate-row{border-top:1px solid var(--line);padding:14px 0 20px}

/* Helping others: Do something kind */

.link.inline{display:inline;min-height:0;padding:0;font-size:inherit}

:root{--zag:#7BC4BB;--zag-dark:#2F6F6A;--zag-cheek:#F2A98F;--zag-eye:#1E2329}
.zstage{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px;position:relative}

.ts-worst{color:var(--text-muted);font-size:17px;margin:24px 0 0}

.plan-now-btn{margin:6px 0 4px}
.panel.pn{margin-top:12px}
.panel.pn .lbl{margin:0 0 4px}

/* Stage 6.9: share the supporter guide */
.link.share-guide{display:block;min-height:44px;margin-top:4px;padding:0 4px;text-align:left}

/* Stage 6.6: Connect */
.panel.conn{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.panel.conn h3{margin:6px 0 0}
.panel.conn .lbl{margin:0}
.panel.conn .small{margin:0}
.panel.conn .btn{text-decoration:none;display:flex;align-items:center;justify-content:center}
.conn-more{color:var(--text-muted);font-size:15px;min-height:44px;display:flex;align-items:center}
.sit.idea{display:inline-flex;align-items:center;text-decoration:none;color:var(--text);text-align:left;line-height:1.25;padding:8px 16px}

/* Stage 6.5: Change the scene */
.list .card.scene-opt{min-height:60px}
.places{margin-top:8px}
.places .sit{display:inline-flex;align-items:center;text-decoration:none;color:var(--text)}
.scene-211{margin-top:20px}
.scene-211 .btn{text-decoration:none;display:flex;align-items:center;justify-content:center}

/* Stage 7 visual pass: calm, editorial, honest. Styling only; no flow or safety changes.
   Titles get a quiet system serif (nothing downloaded); cards lose their borders for a soft shadow;
   crisis screens stay plain: no serif, no shadows, no motion. */
h1,.step-big{font-family:var(--serif);font-weight:500;letter-spacing:-.015em}
h1{font-size:34px;line-height:1.15;margin:10px 0 10px}
h2{font-size:22px;line-height:1.25}
.step-big{font-size:32px;line-height:1.2}
.sub,.small{line-height:1.5}
.card,.route,.panel{border-color:transparent;box-shadow:var(--card-shadow)}
.card.safety,.card.zcard{box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .route,:root:not([data-theme="light"]) .panel{border-color:var(--line)}}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .route,:root[data-theme="dark"] .panel{border-color:var(--line)}
.btn-secondary{border-color:var(--line)}
/* The zigzag: a thin, soft line that changes direction and keeps going. Drawn once; static with reduced motion. */
.zz{display:block;width:120px;height:24px;margin:6px 0 2px;color:var(--primary);overflow:visible}
.zz path{fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:zzDraw .9s ease-out}
@keyframes zzDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
/* Crisis: clarity over beauty */
:root.crisis-mode h1{font-family:inherit;font-weight:700;font-size:32px;letter-spacing:-.01em}
:root.crisis-mode main.screen.enter{animation:none}
:root.crisis-mode .card,:root.crisis-mode .panel{box-shadow:none;border-color:var(--line)}

/* Large text or a short screen: only the top bar (Help, and the YELLOW 988 bar) stays pinned. See fitChrome(). */
:root.crowded .tabbar,:root.crowded .actions{position:static}
:root.crowded .actions{background:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<div id="app" aria-live="polite"></div>
<script>
"use strict";

/* Donation link. Paste the full https:// link between the quotes. Empty (or the placeholder) hides it everywhere.
   Shown only in Settings and About. Nothing about donating is stored, tracked or changes anything. */
const DONATE_URL = "https://ko-fi.com/zigzagmind";
function donateUrl(){ return /^https:\/\/\S+$/.test(DONATE_URL) ? DONATE_URL : ""; }

/* =========================================================
   NEXT — Stage 1 + Stage 2 prototype
   Deterministic only. No AI, no network calls, no analytics,
   no browser storage. All data lives in memory until reload.
   ========================================================= */

/* ---------- SAFETY PHRASE LISTS (edit here; clinician-reviewable) ---------- */
const RED_PHRASES = [
  "kill myself","killing myself","want to die","wanna die","wish i was dead","wish i were dead",
  "end my life","end it all","suicide","suicidal","overdose","overdosed","hurt myself","hurting myself",
  "cut myself","cutting myself","no reason to live","better off without me","better off dead",
  "can't go on","don't want to live","don't want to be alive","don't want to be here anymore",
  // OWNER-APPROVED INTERIM (2026-10-03), pending clinician confirmation. Each only increases escalation.
  "kms","unalive myself","unaliving myself","don't want to wake up","took all my pills","want to disappear","took too much",
  // Harm to others, OWNER-APPROVED INTERIM, pending clinician. The danger question already asks about "someone else".
  "kill him","kill her","kill them","kill someone","hurt someone","hurt somebody"
];
const YELLOW_PHRASES = [
  "hopeless","can't take it","can't take this","give up","giving up","nobody cares","no one cares",
  "worthless","trapped","can't do this anymore"
];

function normalizeText(t){
  return " " + String(t || "").toLowerCase()
    .replace(/[\u2018\u2019']/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim() + " ";
}
const RED_N = RED_PHRASES.map(normalizeText);
const YELLOW_N = YELLOW_PHRASES.map(normalizeText);

function safetyCheck(text){
  const n = normalizeText(text);
  if (RED_N.some(p => n.includes(p))) return "RED";
  if (YELLOW_N.some(p => n.includes(p))) return "YELLOW";
  return "GREEN";
}

/* ---------- CRISIS CONTACTS ---------- */
const LINKS = {
  call988: "tel:988",
  text988: "sms:988",
  chat988: "https://988lifeline.org/chat",
  call911: "tel:911",
  call211: "tel:211",
  findHelpline: "https://findahelpline.com"
};
const HARD_TIME_MSG = "I'm having a really hard time. Can you call me?";
/* 6.6 Connect. Warmline number and hours live only here. Hours are display text: the button is never disabled by clock. */
const WARMLINE = {
  name:"Florida Warm Line",
  tel:"tel:18009451355",
  hours:"Every day, 4pm–10pm Eastern.",
  about:"Not a crisis line. Just real people who've been through it.",
  elsewhere:"After 10pm or outside Florida: find a warmline near you",
  elsewhereUrl:"https://findahelpline.com"
};
/* Anti-stigma note (About in full; My Plan's professionals section shows the first sentence + Read more).
   Never on Home, crisis screens or Calm. Clinician-reviewable. */
const HELP_IS_STRENGTH = "Getting help is a strength, not a weakness. Seeing a psychiatrist, therapist or counselor is care for your mind, the same way you'd see a doctor for your body. It doesn't mean you're 'crazy', broken or weak. Lots of people get help at some point, and many feel better for it. If medication is suggested, that's a choice you make together with a professional, and it's okay either way.";
const HELP_IS_STRENGTH_SHORT = "Getting help is a strength, not a weakness.";
/* Helping others (About). The optional "Do something kind" step lives in the I feel low flow only. */
const HELPING_OTHERS = "Helping someone else can help you too. Small acts of kindness can lift your mood and make you feel less alone. It doesn't have to be big: a kind text, a thank-you, checking on a friend. Only if you have the energy. Taking care of yourself comes first.";
/* "Do something kind": the person picks someone and the words; ZigZag Mind only opens Messages on tap.
   Nothing about who was messaged is kept, and kind acts are never counted. */
const KIND_WORDS = ["Thinking of you","Thanks for being in my life","Hey, how are you doing lately?","Thank you for ___"];
const KIND_OFFLINE = ["Hold a door for someone.","Give someone a compliment.","Help a neighbor with something small."];
/* 6.8 Code word. Agreed on a good day; on a hard day one tap sends just the word. Never typed into ZigZag Mind to
   enter a mode. Suggestions are neutral on purpose. Saved as plan.codeWord = { personIndex, word, setAt, phone }. */
const CODE_WORDS = ["lighthouse","blue kite","pineapple","paper boat","sunflower","red balloon","penguin","maple leaf",
  "teacup","snow globe","cactus","marigold","kayak","honeybee","harbor"];
const SUPPORT_URL_TEXT = "zigzagmind.com/support";
/* 6.10 Check-in reminders: ask a trusted person to set reminders on THEIR phone. Only a first name goes in the link. */
const CHECKIN_ASK = "Would you check in on me now and then? This sets up reminders on your phone. No need to say anything special.";
const firstName = n => String(n || "").normalize("NFC").replace(/[^\p{L} -]/gu, "").replace(/\s+/g, " ").trim().split(" ")[0].slice(0, 20);
/* F1: the check-in link carries the PERSON'S OWN first name (optional, saved in the plan), never the supporter's. */
function checkinUrl(name = getPlan().myName){
  const u = new URL(supportUrl());
  const f = firstName(name);
  if (f) u.searchParams.set("for", f);
  u.hash = "checkins";
  return u.href;
}
/* People already asked (matched by phone, like the code word). */
function checkinAsked(){
  const digits = x => String(x || "").replace(/\D/g, "");
  const people = getPlan().trustedPeople || [];
  return (getPlan().checkinCircle || []).map(c => people.find(p => digits(p.phone) && digits(p.phone) === c.phone)).filter(Boolean);
}
/* 6.9 The supporter guide lives at support/ next to the app (zigzagmind.com/support). */
function supportUrl(){ try { return new URL("support/", location.href).href; } catch (_){ return "https://" + SUPPORT_URL_TEXT; } }
const codeWordSetupMsg = (name, word) => `Hey ${name}, I'm making a plan for hard days. If I ever text you "${word}", it means I'm struggling and need you to call me or come be with me. You don't have to fix anything. Here's a short guide: ${SUPPORT_URL_TEXT}`;
/* 6.11 Time and distance plan. The person's own words only: no examples, no suggestions of means, ever.
   Plan fields are exempt from safetyCheck. */
const TD_FIELDS = [
  ["keepAway","Things I'll keep away from myself during hard times","In your own words."],
  ["holder","Who will hold them, or where they'll go",""],
  ["getBack","When I'll get them back","For example: after I've talked it over with someone I trust."]
];
const TD_ASK = "Would you be willing to hold onto a few things for me for a while? I'll explain when we talk.";
/* 6.12 "Do this first": a plain first step for each of "things that help". */
const FIRST_STEP = { walking:"Take a short, slow walk.", breathing:"Breathe in for 4, out for 6. Do it five times.",
  environment_change:"Get some fresh air: open a window or step outside.", distraction_game:"Play a quick game to give your mind somewhere else to go.",
  connection:"Reach out to someone you trust." };
const FIRST_STEP_DEFAULT = "Put both feet on the floor and let one slow breath out.";
function firstStep(){
  const h = (getPlan().helps || [])[0];
  if (!h) return FIRST_STEP_DEFAULT;
  return FIRST_STEP[h] || SUGGESTION_TEXT[h] || `${helpLabel(h)}.`;
}
const MESSAGE_IDEAS = ["Can't sleep, you up?","Rough night. Can you talk for 5 minutes?","Want to catch up this week?"];
/* Human First (session only, never saved): after 2 taps on "Something else", or 2 finished steps without
   "That helped", ask once per visit whether a person would help more. */
const HUMAN_FIRST_AFTER = 2;
function smsLink(phone, body){
  const digits = String(phone).replace(/\D/g, "");
  return body ? `sms:${digits}?&body=${encodeURIComponent(body)}` : `sms:${digits}`;
}
function telLink(phone){ return `tel:${String(phone).replace(/\D/g, "")}`; }

/* ---------- INTERVENTION LIBRARY (array; look up with .find) ---------- */
const INTERVENTION_LIBRARY = [
  { id:"grounding", name:"Grounding", tryLabel:"Try grounding",
    description:"Notice what's around you, one sense at a time.", durationSec:120,
    states:["anxious","spiraling","craving","distraction"], intensityRange:[0,10], needsMobility:false,
    steps:["Put both feet on the floor.","Name 3 things you can see.","Notice 2 things you can hear.","Let one slow breath out."],
    completion:"tap_done" },
  { id:"walking", name:"Walking", tryLabel:"Try walking",
    description:"A short, slow walk.", durationSec:180,
    states:["anxious","spiraling","low","craving"], intensityRange:[0,10], needsMobility:true,
    steps:["Stand up when you're ready.","Walk slowly for 2 minutes. Anywhere is fine.","Notice each foot as it lands.","Stop and stand still for a moment."],
    completion:"tap_done" },
  { id:"breathing", name:"Breathing", tryLabel:"Try breathing",
    description:"Slow breaths, longer out than in.", durationSec:90,
    states:["anxious","spiraling","craving"], intensityRange:[0,10], needsMobility:false,
    steps:["Breathe in slowly while you count to 4.","Breathe out slowly while you count to 6.","Do that 5 more times, at your own pace."],
    completion:"tap_done" },
  { id:"thought_parking", name:"Thought Parking", tryLabel:"Park my thoughts",
    description:"Get thoughts out of your head and sort them.", durationSec:300,
    states:["spiraling"], intensityRange:[0,10], needsMobility:false,
    steps:["Write down what's on your mind.","Sort each thought.","Pick one small next step."],
    completion:"tap_done" },
  { id:"connection", name:"Reaching out", tryLabel:"Reach out to someone",
    description:"Send one short message to someone you trust.", durationSec:120,
    states:["anxious","spiraling","low","craving","distraction"], intensityRange:[0,10], needsMobility:false,
    steps:["Pick someone you trust.","Send them a short message. Even just: hey."],
    completion:"tap_done" },
  { id:"hydration", name:"Water", tryLabel:"Get some water",
    description:"A glass of water, slowly.", durationSec:60,
    states:["low","anxious","craving"], intensityRange:[0,10], needsMobility:true,
    steps:["Get a glass of water.","Drink it slowly."],
    completion:"tap_done" },

/* Melody and arrangement: pure functions, so tests can check them without audio. */
const SONG_MINOR_PROG = [[0,3,7],[8,12,15],[3,7,10],[10,14,17]];   // i  VI  III  VII
const SONG_PRE_PROG   = [[8,12,15],[10,14,17],[0,3,7],[0,3,7]];    // VI VII i  i
const SONG_MAJOR_PROG = [[0,4,7],[7,11,14],[9,12,16],[5,9,12]];    // I  V   vi IV
const SONG_MIN_PENTA = [0,3,5,7,10], SONG_MAJ_PENTA = [0,2,4,7,9];
function songHash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function songSyllables(w){ const m = w.toLowerCase().replace(/[^a-z]/g, "").match(/[aeiouy]+/g); return Math.min(4, Math.max(1, m ? m.length : 1)); }
function songMelody(text, scaleRoot, penta){
  const words = text.split(" ").filter(Boolean);
  const notes = []; let pos = 0, deg = 4;
  words.forEach((w, wi) => {
    const syl = songSyllables(w), h = songHash(w);
    for (let s = 0; s < syl; s++){
      const step = ((h >> (s * 3)) % 5) - 2;
      deg = Math.max(0, Math.min(9, deg + step));
      const lastOfWord = s === syl - 1;
      const endPhrase = lastOfWord && (wi === words.length - 1 || /[,.!?]$/.test(w));
      const dur = endPhrase ? 1.5 : (lastOfWord ? 0.75 : 0.5);
      notes.push({ beat:pos, dur, pitch:scaleRoot + 12 + penta[deg % 5] + 12 * Math.floor(deg / 5), word:wi });
      pos += dur;
    }
  });
  return { notes, beats:pos };
}
// intro → line 1 (minor) → line 2 (minor) → line 3 and any added "still true" lines (relative major) → outro (major)
function songPlan(song){
  const mood = SONG_MOODS[song.mood];
  const minorRoot = mood.root - 12, majorRoot = mood.root + 3 - 12;
  const lines = [...song.lines, ...(song.still || [])];
  const secs = [{ name:"", bars:2, prog:SONG_MINOR_PROG, root:minorRoot, major:false, line:-1 }];
  lines.forEach((t, i) => {
    const major = i >= 2;
    secs.push({ name:SONG_SECTION[Math.min(i, 2)], text:t, line:i,
      prog:major ? SONG_MAJOR_PROG : (i === 1 ? SONG_PRE_PROG : SONG_MINOR_PROG), root:major ? majorRoot : minorRoot, major });
  });
  secs.push({ name:"", bars:2, prog:SONG_MAJOR_PROG, root:majorRoot, major:true, line:-1, outro:true });
  secs.forEach((sec, si) => {
    sec.bpm = mood.bpm[0] + (mood.bpm[1] - mood.bpm[0]) * (si / (secs.length - 1));
    if (sec.text){
      sec.mel = songMelody(sec.text, sec.root + 12, sec.major ? SONG_MAJ_PENTA : SONG_MIN_PENTA);
      sec.bars = Math.max(2, Math.ceil((sec.mel.beats + 1) / 4));
    }
  });
  return { mood, minorRoot, majorRoot, secs };
}

/* RFC 5545 calendar file, built on the phone (same rules as the supporter guide's). */
function icsBuild(events, stamp = new Date()){
  const pad = n => String(n).padStart(2, "0");
  const local = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const utc = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
  const escT = t => String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const enc = new TextEncoder();
  const fold = line => {
    if (enc.encode(line).length <= 75) return line;
    const parts = []; let cur = "", limit = 75;
    for (const ch of line){ if (enc.encode(cur + ch).length > limit){ parts.push(cur); cur = ch; limit = 74; } else cur += ch; }
    parts.push(cur); return parts.join("\r\n ");
  };
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ZigZag Mind//First 30 days//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  events.forEach((e, i) => {
    lines.push("BEGIN:VEVENT", `UID:zz-${e.kind}-${utc(stamp)}-${i + 1}@zigzagmind.com`, `DTSTAMP:${utc(stamp)}`,
      `DTSTART:${local(e.start)}`, `DTEND:${local(new Date(e.start.getTime() + (e.minutes || 15) * 60000))}`,
      `SUMMARY:${escT(e.title)}`, ...(e.text ? [`DESCRIPTION:${escT(e.text)}`] : []),
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${escT(e.title)}`,`TRIGGER:${e.alarm || "PT0M"}`,"END:VALARM","END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.map(fold).join("\r\n") + "\r\n";
}

const HISTORY_CAP = 500;
let persistOn = true;
let savedTheme = null;
const STORAGE_OK = (() => {
  try { const k = "__next_test"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
  catch (_){ return false; }
})();
function loadStore(){
  if (!STORAGE_OK) return;
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || "null");
    if (p){
      Object.assign(prefs, p.prefs || {});
      if (!STRENGTH_OPTIONS.some(x => x[0] === prefs.strength)) prefs.strength = null;
      savedTheme = p.theme || null;
      persistOn = p.persist !== false;
    }
    const raw = persistOn ? localStorage.getItem(STORE_KEY) : null;
    if (raw){
      const d = JSON.parse(raw);
      store.sensitive = {
        plan:migratePlan({ ...emptyPlan(), ...(d.plan || {}) }),
        baseHistory:Array.isArray(d.history) ? d.history : [],
        activity:Array.isArray(d.activity) ? d.activity : [],
        afterCrisis:validAfterCrisis(d.afterCrisis),
        songs:validSongs(d.songs)
      };
    }
  } catch (_){ /* corrupted data: keep defaults */ }
}
function saveStore(){
  if (!STORAGE_OK || !persistOn) return;
  try {
    const history = [ ...store.sensitive.baseHistory, ...session.sessionHistory ].slice(-HISTORY_CAP);
    const activity = store.sensitive.activity.slice(-HISTORY_CAP);
    const ac = store.sensitive.afterCrisis;
    localStorage.setItem(STORE_KEY, JSON.stringify({ v:1, plan:store.sensitive.plan, history, activity, ...(ac ? { afterCrisis:ac } : {}), ...(songs().length ? { songs:songs() } : {}) }));
  } catch (_){}
}
function savePrefs(){
  if (!STORAGE_OK) return;
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ prefs:persistOn ? prefs : { ...prefs, strength:null }, theme:ui.theme, persist:persistOn })); } catch (_){}   // with saving off, the faith answer stays in memory
}
function clearSaved(){
  if (!STORAGE_OK) return;
  try { localStorage.removeItem(STORE_KEY); } catch (_){}
}
const getPlan = () => store.sensitive.plan;
/* Nothing is saved from crisis screens or while RED (no "moment", "reach" or "plan" entries): HANDOFF safety rule. */
function inCrisisMoment(){
  return session.safetyLevel === "RED" || CRISIS_SCREENS.includes(session.screen) ||
    (session.screen === "plan-now" && ui && ui.planFrom !== "tab");
}
function logActivity(type){
  if (inCrisisMoment()) return;
  store.sensitive.activity.push({ type, ts:Date.now() }); saveStore();
}

const prefs = { reduce:false, haptics:false, homeTipDismissed:false, onboarded:false, country:"auto", under18:false, strength:null };   // strength: 6.15, the person's own answer; null until they choose   // under18: remembered on this device
function finishOnboarding(){ prefs.onboarded = true; savePrefs(); }   // remembered in prefs only

/* Outside the US? Only ever ADDS "Find a helpline in your country" next to 988; never hides 911 or 988.
   "auto" uses the phone's time zone, then its language, as a hint. No location is read or sent. */
const US_ZONES = /^(America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage|Juneau|Sitka|Metlakatla|Yakutat|Nome|Adak|Boise|Detroit|Menominee|Indiana\/.+|Kentucky\/.+|North_Dakota\/.+|Indianapolis|Louisville|Fort_Wayne|Knox_IN|Atka|Shiprock|Puerto_Rico|St_Thomas|Virgin)|Pacific\/(Honolulu|Johnston|Midway|Wake|Guam|Saipan|Pago_Pago|Samoa)|US\/.+|Navajo)$/;
function likelyOutsideUS(){
  if (prefs.country === "us") return false;
  if (prefs.country === "other") return true;
  let tz = "";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (_){}
  if (tz && tz !== "UTC" && tz !== "Etc/UTC") return !US_ZONES.test(tz);
  const region = ((navigator.language || "").split("-")[1] || "").toUpperCase();
  return !!region && region !== "US";
}
/* iPhone Safari only, and only when not already opened from the home screen. Shown on Home until dismissed. */
function showHomeTip(){
  if (prefs.homeTipDismissed) return false;
  const ua = navigator.userAgent || "";
  const iPhoneSafari = /iPhone|iPod/.test(ua) && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua);
  let installed = navigator.standalone === true;
  try { installed = installed || !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); } catch (_){}
  return iPhoneSafari && !installed;
}
const mqReduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
function reducedMotion(){ return prefs.reduce || !!(mqReduce && mqReduce.matches); }
function buzz(){ if (prefs.haptics && navigator.vibrate) { try { navigator.vibrate(10); } catch(_){} } }

/* ---------- CENTRAL SESSION STATE ---------- */
const initialSession = {
  screen:"home",
  safetyLevel:"GREEN",
  yellow:false,
  stillBadCount:0,
  highRatingCount:0,
  sessionHistory:[],
  currentState:null,
  currentInterventionId:null,
  interventionPicks:[],
  lastEnginePick:null,
  lastEngineReason:"",
  interventionCount:0,
  currentIntensity:null,
  currentBeforeRating:null,
  currentFlowStep:0,
  devPanelOpen:false,
  elseTaps:0,            // Human First counters: this visit only, never saved
  unhelpedCount:0,
  humanFirstShown:false,
  sawCrisis:false,       // 6.17: set once any crisis screen shows this visit (hides Ridiculous mode); never saved
  ridiculousCount:0
};

function promoteYellow(s){
  if (s.safetyLevel === "GREEN") return { ...s, safetyLevel:"YELLOW", yellow:true };
  return { ...s, yellow:true };
}

function reducer(s, a){
  switch (a.type){
    case "SET_SCREEN": return { ...s, screen:a.screen };
    case "SET_SAFETY_LEVEL":
      if (a.level === "GREEN") return s;                       // never back to GREEN in a session
      if (a.level === "YELLOW") return { ...s, safetyLevel:"YELLOW", yellow:true };
      if (a.level === "RED") return { ...s, safetyLevel:"RED" };
      return s;
    case "SET_CURRENT_STATE": return { ...s, currentState:a.state };
    case "COUNT_ELSE": return { ...s, elseTaps:s.elseTaps + 1 };
    case "COUNT_UNHELPED": return { ...s, unhelpedCount:s.unhelpedCount + 1 };
    case "HUMAN_FIRST_SHOWN": return { ...s, humanFirstShown:true };
    case "SAW_CRISIS": return s.sawCrisis ? s : { ...s, sawCrisis:true };
    case "COUNT_RIDICULOUS": return { ...s, ridiculousCount:(s.ridiculousCount || 0) + 1 };
    case "SET_CURRENT_INTERVENTION": return { ...s, currentInterventionId:a.id };
    case "SET_CURRENT_INTENSITY": return { ...s, currentIntensity:a.value };
    case "SET_BEFORE_RATING": return { ...s, currentBeforeRating:a.value, currentIntensity:a.value };
    case "INCREMENT_STILL_BAD": {
      const n = { ...s, stillBadCount:s.stillBadCount + 1 };
      return n.stillBadCount >= 2 ? promoteYellow(n) : n;
    }
    case "INCREMENT_HIGH_RATING": {
      const n = { ...s, highRatingCount:s.highRatingCount + 1 };
      return n.highRatingCount >= 2 ? promoteYellow(n) : n;
    }
    case "ADD_OUTCOME": return { ...s, sessionHistory:[ ...s.sessionHistory, a.outcome ] };
    case "ADD_PICK": return { ...s, interventionPicks:[ ...s.interventionPicks, a.id ] };
    case "INCREMENT_INTERVENTION_COUNT": return { ...s, interventionCount:s.interventionCount + 1 };
    case "SET_ENGINE_RESULT": return { ...s, lastEnginePick:a.pick, lastEngineReason:a.reason };
    case "RESET_CURRENT_FLOW": return { ...s, currentFlowStep:0, currentBeforeRating:null, currentIntensity:null, currentInterventionId:null };
    case "TOGGLE_DEV_PANEL": return { ...s, devPanelOpen:!s.devPanelOpen };
    case "EXIT_CRISIS": return { ...s, safetyLevel:"YELLOW", yellow:true, screen:"home" };
    case "DELETE_DATA": return { ...s, sessionHistory:[], interventionPicks:[], interventionCount:0,
      lastEnginePick:null, lastEngineReason:"", currentState:null, currentInterventionId:null,
      currentBeforeRating:null, currentIntensity:null };   // safety level is never reset
    default: return s;
  }
}

let session = { ...initialSession };
function dispatch(action){
  session = reducer(session, action);
  if (action.type === "ADD_OUTCOME" || action.type === "DELETE_DATA") saveStore();
}

/* ---------- INTERVENTION ENGINE ---------- */
function interventionEngine({ state, intensity, history = [], yellow = false, playbook = {}, picks = [], interventionCount = 0, exclude = [], zigFrom = null, hidden = [], recentHigh = false }){
  // Rule 1: filter by state (and leave out anything hidden right now, e.g. Ridiculous mode during YELLOW)
  let pool = INTERVENTION_LIBRARY.filter(i => i.states.includes(state) && !hidden.includes(i.id));
  // Rule 2: filter by intensity range
  if (typeof intensity === "number") pool = pool.filter(i => intensity >= i.intensityRange[0] && intensity <= i.intensityRange[1]);
  // Rule 5: never the same as the last pick (unless nothing else is eligible)
  const last = picks.length ? picks[picks.length - 1] : null;
  let eligible = pool.filter(i => i.id !== last && !exclude.includes(i.id));
  if (!eligible.length) eligible = pool.filter(i => i.id !== last);
  if (!eligible.length) eligible = pool;
  if (!eligible.length) return { interventionId:null, reason:"No eligible intervention found." };

  const helps = (playbook.helps || []).filter(h => findIntervention(h));
  const out = (i, reason, extra = {}) => ({ interventionId:i.id, reason, isPreviouslyHelpful:false,
    usedHistoricalData:false, historicalUses:0, averageDrop:null, ...extra });

  // Rule 3: YELLOW priority (exploration disabled)
  if (yellow){
    const order = [
      ["connection","Reaching out to someone can help when things feel heavy."],
      ...helps.map(h => [h, "This is on your list of things that help."]),
      ["grounding","A grounding step can help steady things."],
      ["environment_change","A change of space can help."]
    ];
    for (const [id, reason] of order){
      const f = eligible.find(i => i.id === id);
      if (f) return out(f, reason);
    }
    return out(eligible[0], "One small step to try.");
  }

  // 6.17 Let's Zig (YELLOW priority already returned above; RED never reaches the engine)
  // Rule 2: after "didn't help", a different channel whenever an eligible alternative exists.
  if (zigFrom){
    const other = eligible.filter(i => i.channel && i.channel !== zigFrom);
    if (other.length) eligible = other;
  }
  // Rule 3: after a recent rating of 8+, prefer the simplest concrete channels (BODY, SPACE, PEOPLE).
  if (recentHigh){
    const simple = eligible.filter(i => SIMPLE_CHANNELS.includes(i.channel));
    if (simple.length) eligible = simple;
  }

  // Rule 6: every 4th start tries something untried this session
  if ((interventionCount + 1) % 4 === 0){
    const untried = eligible.find(i => !picks.includes(i.id));
    if (untried) return out(untried, "Something you haven't tried today.");
  }

  // Rule 4: rank by average drop (needs 2+ uses with numeric before/after)
  const stat = id => {
    const r = history.filter(h => h.interventionId === id && h.state === state &&
      typeof h.before === "number" && typeof h.after === "number");
    if (r.length < 2) return null;
    return { uses:r.length, avg:r.reduce((sum, h) => sum + (h.before - h.after), 0) / r.length };
  };
  const scored = eligible.map(i => ({ i, s:stat(i.id) }))
    .filter(x => x.s && x.s.avg > 0)
    .sort((a, b) => (b.s.avg - a.s.avg) || (helps.includes(b.i.id) - helps.includes(a.i.id)));
  if (scored.length){
    const { i, s } = scored[0];
    // Rule 7: phrase as an offer, never a promise
    return out(i, `${i.name} helped you before.`, { isPreviouslyHelpful:true, usedHistoricalData:true,
      historicalUses:s.uses, averageDrop:Math.round(s.avg * 10) / 10 });
  }
  const pb = eligible.find(i => helps.includes(i.id));
  if (pb) return out(pb, "This is on your list of things that help.");
  return out(eligible[0], "One small step to try.");
}

/* The most recent rating (before or after) given this visit, or null. */
function latestRating(){
  for (let k = session.sessionHistory.length - 1; k >= 0; k--){
    const h = session.sessionHistory[k];
    if (typeof h.after === "number") return h.after;
    if (typeof h.before === "number") return h.before;
  }
  return typeof session.currentBeforeRating === "number" ? session.currentBeforeRating : null;
}
function runEngine(){
  const r = interventionEngine({
    state:session.currentState,
    intensity:session.currentBeforeRating,
    history:[ ...store.sensitive.baseHistory, ...session.sessionHistory ],
    yellow:session.yellow,
    playbook:getPlan(),
    picks:session.interventionPicks,
    interventionCount:session.interventionCount,
    exclude:ui.exclude,
    zigFrom:ui.zigFrom || null,
    recentHigh:latestRating() >= 8,
    hidden:ridiculousAvailable() ? [] : ["ridiculous_mode"]
  });
  ui.engine = r;
  dispatch({ type:"SET_ENGINE_RESULT", pick:r.interventionId, reason:r.reason });
  return r;
}

/* ---------- FLOW CONTROL ---------- */
const FLOW_FIRST = { anxious:"grounding", spiraling:"thought_parking", low:null, craving:"craving_delay", distraction:null };

function startFlow(stateId, opts = {}){
  if (blockIfRed()) return;
  dispatch({ type:"RESET_CURRENT_FLOW" });
  dispatch({ type:"SET_CURRENT_STATE", state:stateId });
  const theme = ui.theme;
  ui = freshUi(); ui.theme = theme;
  ui.firstPick = opts.firstPick || null;
  logActivity("moment");
  const first = ui.firstPick || FLOW_FIRST[stateId];
  dispatch({ type:"SET_ENGINE_RESULT", pick:first, reason:first ? "Default first step for this state." : "User chooses the first step." });
  go("before");
}

function humanFirstDue(){
  return !session.humanFirstShown && session.safetyLevel !== "RED" &&
    (session.elseTaps >= HUMAN_FIRST_AFTER || session.unhelpedCount >= HUMAN_FIRST_AFTER);
}
/* Go to the next suggestion, unless it's time to ask (once) whether a person would help more. */
function toRecommendation(){
  if (humanFirstDue()){ dispatch({ type:"HUMAN_FIRST_SHOWN" }); go("human-first"); return; }
  go("recommendation");
}

function resetGame(id){
  const n = gamePlays++;
  ui.gamePart = 0; ui.gameDots = []; ui.gameFound = {};
  if (id === "distraction_color_hunt") ui.gameDots = Array(COLOR_HUNT[0].n).fill(false);
  if (id === "distraction_memory"){ ui.memRound = n % MEMORY_ROUNDS.length; ui.memPhase = "show"; ui.memPicked = {}; }
  if (id === "distraction_pattern"){ ui.patSeq = PATTERNS[n % PATTERNS.length]; ui.patInput = []; ui.patDone = false; ui.patPlaying = false; }
}

function beginAfterBefore(){
  if (blockIfRed()) return;
  const st = session.currentState;
  if (ui.firstPick){ startIntervention(ui.firstPick); return; }
  if (st === "anxious") startIntervention("grounding", { route:"anx-feet" });
  else if (st === "spiraling") startIntervention("thought_parking");
  else if (st === "low") go("low-choose");
  else if (st === "craving") startIntervention("craving_delay");
  else if (st === "distraction") go("distract");
  else go("home");
}

function startIntervention(interventionId, opts = {}){
  if (blockIfRed()) return false;
  const it = findIntervention(interventionId);
  if (!it) return false;
  dispatch({ type:"ADD_PICK", id:interventionId });
  dispatch({ type:"INCREMENT_INTERVENTION_COUNT" });
  dispatch({ type:"SET_CURRENT_INTERVENTION", id:interventionId });
  ui.step = 0;
  let route = opts.route;
  if (GAME_ROUTES[interventionId]){ resetGame(interventionId); if (!route) route = GAME_ROUTES[interventionId]; }
  if (interventionId === "change_scene" && !route) route = "scene";
  const R617 = { borrow_ten:"borrow", true_sentence:"ts", kind_stranger:"stranger", find_alive:"alive", ridiculous_mode:"ridiculous", touch_real_world:"touch" };
  if (R617[interventionId]){
    if (interventionId === "ridiculous_mode"){
      if (!ridiculousAvailable()) return false;
      ui.ridIdx = session.ridiculousCount || 0; dispatch({ type:"COUNT_RIDICULOUS" });
    }
    ui.borrowOpt = null; ui.borrowEnd = 0; ui.tsStep = 1; ui.tsWorst = ""; ui.tsTrue = ""; ui.msg = "";
    ui.strangerPicked = false; ui.alivePhase = null; ui.touchIdx = 0; ui.touchTex = {}; ui.anchorAnswer = null;
    ui.touchPhase = interventionId === "touch_real_world" && getPlan().anchor ? "anchor" : null;
    route = R617[interventionId];
  }
  if (interventionId === "song"){ route = "song"; ui.songMood = null; ui.songIdx = 0; ui.songLines = ["", "", ""]; ui.song = null; ui.songEnded = false; ui.songKept = false; ui.songReplay = false; ui.msg = ""; }
  if (interventionId === "zags"){ route = "zags"; if (!ui.zags || ui.zags.phase !== "hello") ui.zags = { phase:"hello", step:0, rounds:0, hard:0, breath:0, half:null }; }
  if (!route) route = interventionId === "thought_parking" ? "spiral-input"
    : interventionId === "craving_delay" ? "craving-delay"
    : interventionId === "still_true" ? "still-true" : "intervention";
  if (interventionId === "still_true"){ ui.trueIdx = 0; ui.trueCount = 0; }
  if (interventionId === "craving_delay"){
    ui.cravingStart = Date.now();
    ui.cravingEnd = Date.now() + CRAVING_MS;
    ui.cravingDone = {}; ui.waveOpen = false;
  }
  if (route === "focus"){ ui.focusStart = null; }
  if (route === "ground"){ startGround(); return true; }
  go(route);
  return true;
}

function completeCheckIn({ after, action, change }){
  if (blockIfRed()) return;
  const afterVal = action === "skip" ? null : (typeof after === "number" ? after : null);
  const outcome = { source:"session", state:session.currentState, interventionId:session.currentInterventionId,
    before:session.currentBeforeRating, after:afterVal, timestamp:Date.now() };
  if (change) outcome.change = change;   // games: "yes" | "a_little" | "no"
  if (outcome.interventionId === "change_scene" && ui.sceneOpt) outcome.option = ui.sceneOpt;
  const ended = session.currentInterventionId;
  dispatch({ type:"ADD_OUTCOME", outcome });
  if (typeof afterVal === "number" && afterVal >= 9) recordHighRating();
  if (action === "still_bad" || change === "no") recordStillBad();   // a game's "No" counts like "I still feel bad"
  ui.justStillBad = action === "still_bad" || change === "no";
  const endedIt = findIntervention(ended);
  ui.zigFrom = ui.justStillBad && endedIt && endedIt.channel ? endedIt.channel : null;   // 6.17 Let's Zig
  ui.rating = null; ui.exclude = []; ui.checkinNote = ""; ui.suggestIdx = 0; ui.checkinVariant = null;
  if (change === "no" && ended) ui.exclude = [ended];   // didn't change anything: offer something else
  // the next step starts from where this one ended (null if skipped — never invented)
  dispatch({ type:"SET_BEFORE_RATING", value:afterVal });
  if (action !== "helped") dispatch({ type:"COUNT_UNHELPED" });
  runEngine();
  if (action === "helped"){ go("phone-down"); return; }   // 6.17 B: success is putting the phone down
  toRecommendation();
}

function somethingElse(){
  if (blockIfRed()) return;
  const prev = ui.engine && ui.engine.interventionId;
  if (prev && !ui.exclude.includes(prev)) ui.exclude.push(prev);
  let r = runEngine();
  if (!r.interventionId || r.interventionId === prev){
    ui.exclude = prev ? [prev] : [];
    r = runEngine();
  }
  ui.suggestIdx++;
  dispatch({ type:"COUNT_ELSE" });
  if (humanFirstDue()){ dispatch({ type:"HUMAN_FIRST_SHOWN" }); go("human-first"); return; }
  render();
}

const CRAVING_MS = 15 * 60 * 1000;
const CRAVING_STEPS = [
  ["room","Move to another room."],
  ["water","Drink some water."],
  ["distance","Put some distance between you and the thing you're craving."],
  ["walk","Take a short walk."]
];
function fmtTime(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function cravingMinutes(){
  if (!ui.cravingStart) return 0;
  return Math.floor((Date.now() - ui.cravingStart) / 60000);
}
function recordUsed(){
  dispatch({ type:"ADD_OUTCOME", outcome:{ source:"session", state:"craving", interventionId:"craving_delay",
    before:session.currentBeforeRating, after:null, timestamp:Date.now() } });
}

const GROUND = [
  { n:5, text:"Notice 5 things you can see." },
  { n:4, text:"Notice 4 things you can feel." },
  { n:3, text:"Notice 3 things you can hear." },
  { n:2, text:"Notice 2 things you can smell." },
  { n:1, text:"Notice 1 thing you can taste." }
];
function startGround(){
  ui.groundIdx = 0;
  ui.groundDots = Array(GROUND[0].n).fill(false);
  go("ground");
}
function finishGround(){
  if (blockIfRed()) return;
  if (ui.noMode){
    dispatch({ type:"ADD_OUTCOME", outcome:{ source:"session", state:"crisis-no", interventionId:"grounding",
      before:null, after:null, timestamp:Date.now() } });
    ui.noMode = false;
    go("safety-check");
    return;
  }
  go("checkin");
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const person = () => getPlan().trustedPeople[0] || null;
/* The code word and who it goes to, or null. Matched by phone so editing the list never sends it to the wrong person. */
function codeWord(){
  const cw = getPlan().codeWord, people = getPlan().trustedPeople || [];
  if (!cw || !cw.word) return null;
  const digits = x => String(x || "").replace(/\D/g, "");
  const p = people.find(x => digits(x.phone) && digits(x.phone) === cw.phone);
  return p ? { word:cw.word, person:p } : null;
}
/* "Send my code word to [name]": opens Messages with the word only. noexit: crisis-no rule (safety check first). */
function codeWordButton(noexit, cls = "btn btn-outline"){
  const cw = codeWord();
  if (!cw) return "";
  const attr = noexit ? `data-act="noContact" data-noexit="1"` : "";
  return `<a class="${cls} codeword" href="${smsLink(cw.person.phone, cw.word)}" ${attr}>Send my code word to ${esc(cw.person.name)}</a>`;
}

function ratingRow(selected, legendLow, legendHigh){

  for (let i = 0; i <= 10; i++){
    b += `<button class="rate" data-act="rate" data-arg="${i}" aria-pressed="${selected === i}" aria-label="${i} out of 10">${i}</button>`;
  }
  return `<div class="rating" role="group" aria-label="Rating from 0 to 10">${b}</div>
    <div class="legend"><span>0 · ${legendLow}</span><span>10 · ${legendHigh}</span></div>`;
}

}

        <input class="field" id="kindThanks" maxlength="80" autocomplete="off" value="${esc(ui.kindThanks || "")}">` : ""}
      ${ui.msg ? `<p class="err" role="alert">${esc(ui.msg)}</p>` : ""}`,

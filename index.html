        <button class="link" data-act="kindBack">Not right now</button>` };
  },
  "kind-send"(){
    const p = (getPlan().trustedPeople || [])[ui.kindPerson];
    const text = ui.kindText || "";
    if (!p) return SCREENS.kind();
    return { close:true, body:`
      <p class="step-count">Something kind</p>
      ${stepTitle(`Your message to ${esc(p.name)}`, true)}
      <p class="kind-preview">${esc(text)}</p>
      <p class="sub">Tap below to open Messages with this ready. You decide whether to send it.</p>
      <a class="btn btn-primary kind-open" href="${smsLink(p.phone, text)}" data-kind="1">Open Messages</a>`,
      actions:`<button class="btn btn-secondary" data-act="kindDone">Done</button>
        <button class="link" data-act="kindBack">Not right now</button>` };
  },
  "kind-offline"(){
    return { close:true, body:`
      <p class="step-count">Something kind</p>
      ${stepTitle("Something small, without your phone.", true)}
      <ul class="kind-list">${KIND_OFFLINE.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <p class="sub">Any one is plenty. None is fine too.</p>`,
      actions:`<button class="btn btn-primary" data-act="kindDone">Done</button>
        <button class="link" data-act="kindBack">Not right now</button>` };
  },

  "spiral-input"(){
    return { close:true, body:`
      ${title("Let's get it out of your head.")}
      <label class="sub" for="thoughts">What's running through your mind? One thought per line.</label>
      <textarea class="field" id="thoughts" placeholder="I might lose my job&#10;I forgot to call back"></textarea>
      ${ui.msg ? `<p class="notice" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="spMake">Make cards</button>
        <button class="link" data-act="spAlsoTrue">Or: one sentence and what's also true</button>` };
  },

  "spiral-sort"(){
    const places = [["now","Now"],["later","Later"],["notmine","Not in my control"]];
    const allPlaced = ui.thoughts.every(t => t.place);
    const card = (t, idx) => `
      <div class="tcard${ui.landed === idx ? " landed" : ""}" data-idx="${idx}">
        <div class="tc-top">
          <span class="handle" data-drag="${idx}" aria-hidden="true">⠿</span>
          <div class="t">${esc(t.text)}</div>
        </div>
        <div class="seg" role="group" aria-label="Where does this go?">
          ${places.map(([k, l]) => `<button data-act="spPlace" data-arg="${idx}:${k}" aria-pressed="${t.place === k}">${l}</button>`).join("")}
        </div>
      </div>`;
    const list = place => ui.thoughts.map((t, idx) => ({ t, idx })).filter(x => x.t.place === place);
    const unsorted = list(null);
    const parked = list("notmine");
    return { close:true, body:`
      ${title("Where does each one go?")}
      <p class="sub">Drag a card by its handle into a box, or tap a button on the card.</p>
      ${unsorted.map(x => card(x.t, x.idx)).join("")}
      ${!unsorted.length ? `<p class="notice">Everything is sorted.</p>` : ""}
      <section class="zone now" data-zone="now" aria-label="Now">
        <h3>Now</h3><p class="zh">I can act on this.</p>
        ${list("now").map(x => card(x.t, x.idx)).join("")}
      </section>
      <section class="zone later" data-zone="later" aria-label="Later">
        <h3>Later</h3><p class="zh">Matters, just not today.</p>
        ${list("later").map(x => card(x.t, x.idx)).join("")}
      </section>
      <section class="zone park" data-zone="notmine" aria-label="Not in my control">
        <h3>Not in my control</h3><p class="zh">${parked.length ? `Parked: ${parked.length} ${parked.length === 1 ? "thing" : "things"} that aren't yours to fix right now.` : "Drop things here that you can't change right now."}</p>
        ${parked.map(x => `<div class="tchip"><span>${esc(x.t.text)}</span><button data-act="spPlace" data-arg="${x.idx}:notmine" aria-label="Unpark ${esc(x.t.text)}">Unpark</button></div>`).join("")}
      </section>`,
      actions:`<button class="btn btn-primary" data-act="spSortNext" ${allPlaced ? "" : "disabled"}>${allPlaced ? "Next" : "Sort each thought to continue"}</button>` };
  },

  "spiral-step"(){
    const now = ui.thoughts.filter(t => t.place === "now");
    if (!now.length){
      return { close:true, body:`${title("Nothing here needs doing right now.")}<p class="sub">You can let these wait.</p>`,
        actions:`<button class="btn btn-primary" data-act="spNone">Continue</button>` };
    }
    const pick = now[Math.min(ui.nowIdx, now.length - 1)];
    const chooser = now.length > 1 ? `<p class="small" style="margin-top:12px">Pick one to start with:</p>` +
      now.map((t, i) => `<button class="choice" data-act="spNowSel" data-arg="${i}" aria-pressed="${i === ui.nowIdx}">${esc(t.text)}</button>`).join("")
      : `<div class="tcard"><div class="t">${esc(pick.text)}</div></div>`;
    return { close:true, body:`
      ${title("What's the smallest step?")}
      ${chooser}
      <div class="stack" style="margin-top:16px">
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Put it on my calendar">Put it on my calendar</button>
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Text one person">Text one person</button>
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Write one sentence">Write one sentence</button>
      </div>
      <label class="small" for="ownstep" style="display:block;margin-top:16px">Or in your own words</label>
      <input class="field" id="ownstep" autocomplete="off" maxlength="120">
      ${ui.msg ? `<p class="notice" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="spOwn">Use my words</button>` };
  },

  "spiral-next"(){
    return { close:true, body:`
      ${title("Here's your one next step.")}
      <div class="nextcard">
        <div class="lbl">One next step</div>
        <div class="big">${esc(ui.nextStep)}</div>
        ${ui.nextFor ? `<div class="for">For: ${esc(ui.nextFor)}</div>` : ""}
      </div>
      <p class="note">Everything else can wait.</p>`,
      actions:`<button class="btn btn-primary" data-act="spNextDone">Continue</button>` };
  },

  "craving-delay"(){
    const left = (ui.cravingEnd || Date.now()) - Date.now();
    const done = left <= 0;
    const total = Math.max(CRAVING_MS, (ui.cravingEnd || 0) - (ui.cravingStart || 0));
    const frac = done ? 1 : 1 - left / total;
    const C = 2 * Math.PI * 100;
    const todo = CRAVING_STEPS.map(([k, t]) => `<button class="todo" data-act="crvStep" data-arg="${k}" aria-pressed="${!!(ui.cravingDone || {})[k]}">
        <span class="ck" aria-hidden="true">${(ui.cravingDone || {})[k] ? "✓" : ""}</span><span class="tx">${t}</span></button>`).join("");
    const p = person();
    return { close:true, body:`
      ${title(done ? "You gave it the time." : "Let's wait 15 minutes together.")}
      <p class="sub">The urge can rise and fall. You don't have to act on it.</p>
      <div class="ring-wrap" role="timer" aria-label="Time left">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="bg" cx="110" cy="110" r="100"/>
          <circle class="fg" id="crvRing" cx="110" cy="110" r="100" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/>
        </svg>
        <div class="ring-label"><span class="tm" id="crvTime">${done ? "Done" : fmtTime(left)}</span><span class="lb">${done ? "time's up" : "left"}</span></div>
      </div>
      <h2>While you wait</h2>
      <p class="small">Any of these, in any order. Skip what doesn't fit.</p>
      ${todo}
      <button class="todo" data-act="crvFocus"><span class="ck" aria-hidden="true"></span><span class="tx">Play the 1-minute Focus game</span></button>
      ${p ? `<a class="todo" href="${smsLink(p.phone, "Can you talk for a few minutes?")}"><span class="ck" aria-hidden="true"></span><span class="tx">Text ${esc(p.name)}</span></a>` : ""}
      <button class="btn btn-secondary" style="margin-top:16px" data-act="crvWave" aria-expanded="${!!ui.waveOpen}">${ui.waveOpen ? "Hide the wave" : "Ride the wave"}</button>
      ${ui.waveOpen ? `<div class="wave">
        <svg viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true"><g class="mv"><path d="M0 60 Q 50 20 100 60 T 200 60 T 300 60 T 400 60 T 500 60 T 600 60 T 700 60 T 800 60 V 90 H 0 Z"/></g></svg>
        <ol><li>Where do you feel it in your body?</li><li>Breathe into that spot.</li><li>Watch it rise and fall.</li></ol>
      </div>` : ""}
      <div class="safety-row" role="note">
        <a href="${LINKS.call911}">Already used, or took too much? Call 911.</a>
        <span>Shaking, sweating, confused, or seeing things? Withdrawal can be a medical emergency. Get medical help.</span>
        <span>For support: <a href="${LINKS.call988}">Call 988</a> · <a href="${LINKS.text988}">Text 988</a></span>
      </div>
      <div style="display:flex;justify-content:center;margin-top:8px"><button class="link" data-act="crvBorrow">Or borrow ten minutes instead</button></div>
      <div style="display:flex;justify-content:center"><button class="link" data-act="crvUsed">I already used</button></div>`,
      actions: done ? `<button class="btn btn-primary" data-act="crvCheck">Check in</button>`
        : `<button class="btn btn-secondary" data-act="crvCheck">Check in early</button>` };
  },

  "craving-used"(){
    return { close:true, body:`
      ${title("Thanks for telling me.")}
      <p class="sub">No judgment here. What matters is the next few minutes.</p>
      <div class="safety-row" role="note">
        <a href="${LINKS.call911}">Took too much, or feel unwell? Call 911.</a>
        <span>Shaking, sweating, confused, or seeing things? Withdrawal can be a medical emergency. Get medical help.</span>
        <span>For support: <a href="${LINKS.call988}">Call 988</a> · <a href="${LINKS.text988}">Text 988</a></span>
      </div>
      <h2>Want to do one small thing for the next 10 minutes?</h2>`,
      actions:`<button class="btn btn-primary" data-act="usedYes">Yes</button>
        <button class="btn btn-secondary" data-act="usedNo">Not right now</button>` };
  },

  focus(){
    const sixty = session.currentInterventionId === "distraction_60_second";
    return { close:true, body:`
      ${title(sixty ? "For the next 60 seconds, your only job is to beat the timer." : "Tap when the dot is inside the ring.")}
      <p class="sub">${sixty ? "Tap when the dot is inside the ring. No score." : "No score. Just follow it."}</p>
      <div class="focus-area" id="focusArea" tabindex="0" role="button" aria-label="Tap when the dot is inside the ring">
        <div class="track"></div><div class="target" id="focusTarget"></div><div class="orb" id="focusOrb"></div>
      </div>
      <div class="focus-meta"><span id="focusMsg" aria-live="polite"></span><span id="focusTime">1:00</span></div>`,
      actions:`<button class="btn btn-primary" data-act="focusDone">Done</button>` };
  },

  /* 6.7: Zags. One screen; the phase decides what he says. */
  zags(){
    const z = ui.zags || { phase:"hello", step:0, rounds:0, hard:0 };
    const line = zagsLine(z);
    const voice = ("speechSynthesis" in window)
      ? `<button class="chip zvoice" data-act="zagsVoice" aria-pressed="${!!ui.zagsVoice}">${ui.zagsVoice ? "Voice on" : "Voice off"}</button>` : "";
    const p = person();
    const people = `${p ? `<div class="pair">
        <a class="btn btn-secondary" href="${smsLink(p.phone)}">Text ${esc(p.name)}</a>
        <a class="btn btn-secondary" href="${telLink(p.phone)}">Call ${esc(p.name)}</a></div>` : ""}
      <a class="btn btn-secondary" href="${WARMLINE.tel}">Call the Warm Line</a>
      ${p ? "" : `<button class="btn btn-secondary" data-act="route" data-arg="connect">Find someone to talk to</button>`}`;
    let sub = "", actions = "";
    switch (z.phase){
      case "hello":
        actions = `<button class="btn btn-primary" data-act="zagsBreathe">Okay, Zags</button>
          <button class="link" data-act="zagsBye">Not right now</button>`; break;
      case "breathe":
        sub = z.half ? `Breath ${z.breath + 1} of ${zagsBreaths()}` : "";
        actions = `<button class="btn btn-secondary" data-act="zagsSkip">Skip breathing</button>`; break;
      case "steps":
        actions = `<button class="btn btn-primary" data-act="zagsNext">${z.step === ZAGS_STEPS.length - 1 ? "Okay" : "Done"}</button>`; break;
      case "check":
        actions = `<button class="btn btn-primary" data-act="zagsFeel" data-arg="better">A bit better</button>
          <button class="btn btn-secondary" data-act="zagsFeel" data-arg="hard">Still hard</button>
          <button class="btn btn-secondary" data-act="zagsFeel" data-arg="worse">Worse</button>`; break;
      case "better":
        sub = `${WARMLINE.name}: ${WARMLINE.hours}`;
        actions = `${people}<button class="btn btn-secondary" data-act="zagsBye">I'm okay for now</button>`; break;
      case "again":
        actions = `<button class="btn btn-primary" data-act="zagsBreathe">One more round</button>${people}
          <button class="link" data-act="zagsBye">Not right now</button>`; break;
      case "hard":
        sub = `${WARMLINE.name}: ${WARMLINE.hours}`;
        actions = `${people}${row988()}`; break;
      default:   // bye: still ends at a person
        actions = `<button class="btn btn-primary" data-act="route" data-arg="connect">Reach someone</button>
          <button class="btn btn-secondary" data-act="home">Done</button>`;
    }
    const calm = z.phase === "breathe" && z.half === "out";
    return { close:true, body:`
      <div class="zstage${z.phase === "breathe" ? "" : " idle"}">
        ${voice}
        ${zagsSvg(z.half, calm)}
        <p id="screen-title" tabindex="-1" class="bubble">${line}</p>
        <p class="zsub" id="zagsSub" aria-live="polite">${sub}</p>
      </div>`,
      actions:`${actions}<p class="note znote">${ZAGS_NOTE}</p>` };
  },

  /* 6.8: Code word setup. choose_person → choose_word → compose_sms → confirm. */
  "cw-person"(){
    const people = getPlan().trustedPeople || [];
    return { close:false, body:`
      <p class="lbl">Set up with your people · Code word</p>
      ${title("Who should get your code word?")}
      <p class="sub">Pick someone who'd want to know when things are hard.</p>
      ${people.length ? `<div class="list">${people.map((p, i) =>
        `<button class="card" data-act="cwPerson" data-arg="${i}">${icon("people")}<span>${esc(p.name)}${p.relationship ? `<span class="meta">${esc(p.relationship)}</span>` : ""}</span></button>`).join("")}</div>`
        : `<p class="note">Add someone you trust first. Then come back here.</p>
          <button class="btn btn-secondary" data-act="planEdit" data-arg="trustedPeople">Add someone</button>`}`,
      actions:`<button class="btn btn-secondary" data-act="cwCancel">Back to My Plan</button>` };
  },
  "cw-word"(){
    const p = (getPlan().trustedPeople || [])[ui.cwPerson];
    if (!p) return SCREENS["cw-person"]();
    const opts = ui.cwOptions || [];
    const own = ui.cwOwn;
    const word = own ? (ui.cwOwnText || "") : ui.cwWord;
    return { close:false, body:`
      <p class="lbl">Set up with your people · Code word</p>
      ${title(`Pick a word for ${esc(p.name)}.`)}
      <p class="sub">On a hard day, you'll send just this word. ${esc(p.name)} will know what it means. No explaining.</p>
      <div class="sits cw-words">${opts.map(w => `<button class="sit" data-act="cwWord" data-arg="${esc(w)}" aria-pressed="${!own && ui.cwWord === w}">${esc(w)}</button>`).join("")}
        <button class="sit" data-act="cwOwn" aria-pressed="${!!own}">My own word</button></div>
      <button class="link" data-act="cwShuffle">Show other words</button>
      ${own ? `<label for="cwOwnBox" class="small" style="display:block;margin-top:10px">Your word</label>
        <input class="field" id="cwOwnBox" maxlength="30" autocomplete="off" value="${esc(ui.cwOwnText || "")}">` : ""}
      ${ui.msg ? `<p class="err" role="alert">${esc(ui.msg)}</p>` : ""}
      ${word && !own ? `<p class="lbl" style="margin-top:16px">Your message to ${esc(p.name)}</p><p class="msg-preview">${esc(codeWordSetupMsg(p.name, word))}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="cwNext">Next</button>
        <button class="btn btn-secondary" data-act="cwCancel">Back to My Plan</button>` };
  },
  "cw-send"(){
    const p = (getPlan().trustedPeople || [])[ui.cwPerson];
    if (!p || !ui.cwFinal) return SCREENS["cw-person"]();
    const text = codeWordSetupMsg(p.name, ui.cwFinal);
    return { close:false, body:`
      <p class="lbl">Set up with your people · Code word</p>
      ${title(`Your message to ${esc(p.name)}`)}
      <p class="msg-preview">${esc(text)}</p>
      <a class="btn btn-primary cw-open" href="${smsLink(p.phone, text)}">Open Messages</a>
      <p class="note">ZigZag Mind never sends anything for you. You tap Send.</p>
      <h2>Did you send it?</h2>`,
      actions:`<button class="btn btn-primary" data-act="cwSaved">Yes, I sent it</button>
        <button class="btn btn-secondary" data-act="cwCancel">Not yet</button>` };
  },

  /* 6.10: Check-in reminders. choose_person → share_link (or text it) → confirm. */
  "ci-name"(){
    return { close:false, body:`
      <p class="lbl">Set up with your people · Check-in reminders</p>
      ${title("What name should their reminders show?")}
      <p class="sub">Your first name, so their calendar says "Check in on [your name]". Optional. If you leave it blank, it says "your friend".</p>
      <label for="ciNameBox" class="small" style="display:block;margin-top:12px">Your first name (saved in your plan)</label>
      <input class="field" id="ciNameBox" maxlength="40" autocomplete="given-name" value="${esc(getPlan().myName || "")}">`,
      actions:`<button class="btn btn-primary" data-act="ciName">Next</button>
        <button class="btn btn-secondary" data-act="ciCancel">Back to My Plan</button>` };
  },
  "ci-person"(){
    const people = getPlan().trustedPeople || [];
    return { close:false, body:`
      <p class="lbl">Set up with your people · Check-in reminders</p>
      ${title("Who would you like to check in on you?")}
      <p class="sub">They'll get a link that adds gentle reminders to their own calendar. Nothing is sent by ZigZag Mind.</p>
      ${people.length ? `<div class="list">${people.map((p, i) =>
        `<button class="card" data-act="ciPerson" data-arg="${i}">${icon("people")}<span>${esc(p.name)}${p.relationship ? `<span class="meta">${esc(p.relationship)}</span>` : ""}</span></button>`).join("")}</div>`
        : `<p class="note">Add someone you trust first. Then come back here.</p>
          <button class="btn btn-secondary" data-act="planEdit" data-arg="trustedPeople">Add someone</button>`}`,
      actions:`<button class="btn btn-secondary" data-act="ciCancel">Back to My Plan</button>` };
  },
  "ci-send"(){
    const p = (getPlan().trustedPeople || [])[ui.ciPerson];
    if (!p) return SCREENS["ci-person"]();
    const url = checkinUrl(), text = `${CHECKIN_ASK} ${url}`;
    return { close:false, body:`
      <p class="lbl">Set up with your people · Check-in reminders</p>
      ${title(`Your message to ${esc(p.name)}`)}
      <p class="msg-preview">${esc(text)}</p>
      <a class="btn btn-primary ci-open" href="${smsLink(p.phone, text)}">Text it to ${esc(p.name)}</a>
      <button class="btn btn-secondary" style="margin-top:10px" data-act="ciShare">Share another way</button>
      ${ui.flash ? `<p class="flash" role="status">${esc(ui.flash)}</p>` : ""}
      <p class="note">ZigZag Mind never sends anything for you. ${firstName(getPlan().myName) ? `The link has only your first name, ${esc(firstName(getPlan().myName))}, nothing else from your plan.` : "The link has no name and nothing from your plan. Their reminders will say \"your friend\"."}</p>
      <h2>Did you send it?</h2>`,
      actions:`<button class="btn btn-primary" data-act="ciSaved">Yes, I sent it</button>
        <button class="btn btn-secondary" data-act="ciCancel">Not yet</button>` };
  },

  /* 6.12: I need my plan: the essentials, read-only, in this order. Same plan data; never a second plan.
     From the NO branch, calling or texting moves to the safety check in the same tap, and "I'm done" goes there too. */
  "plan-now"(){
    const pb = getPlan(), no = ui.planFrom === "no";
    const attr = no ? ` data-act="noContact" data-noexit="1"` : "";
    const td = pb.timeDistance || {};
    const tdLines = TD_FIELDS.filter(([k]) => td[k]).map(([k, t]) => `<p class="td-q">${t}</p><p class="td-a">${esc(td[k])}</p>`).join("");
    const people = pb.trustedPeople || [];
    return { close:false, body:`
      ${title("Your plan.")}
      <p class="sub">Just the essentials, right now.</p>
      <div class="panel pn"><p class="lbl">Do this first</p><p class="pn-first">${esc(firstStep())}</p></div>
      <div class="panel pn"><p class="lbl">Reach a person</p>
        ${codeWord() ? codeWordButton(no, "btn btn-primary") : ""}
        ${people.length ? people.map(p => `<div class="pair" style="margin-top:10px">
            <a class="btn btn-outline" href="${telLink(p.phone)}"${attr} aria-label="Call ${esc(p.name)}">Call ${esc(p.name)}</a>
            <a class="btn btn-outline" href="${smsLink(p.phone, HARD_TIME_MSG)}"${attr} aria-label="Text ${esc(p.name)}">Text ${esc(p.name)}</a></div>`).join("")
          : `<p class="small" style="margin:6px 0 0">No one in your plan yet. 988 is below, any time.</p>`}</div>
      ${pb.places.length ? `<div class="panel pn"><p class="lbl">Places I can go</p><p>${pb.places.map(esc).join(" · ")}</p></div>` : ""}
      ${tdLines ? `<div class="panel pn"><p class="lbl">My time and distance plan</p>${tdLines}</div>` : ""}
      ${pb.reminders.length ? `<div class="panel pn"><p class="lbl">What I want to remember</p>${pb.reminders.map(x => `<p>${esc(x)}</p>`).join("")}</div>` : ""}
      <p class="lbl" style="margin-top:18px">Crisis support</p>
      ${row988().replace(/<a class="btn btn-safety"/g, `<a class="btn btn-safety"${no ? ' data-act="noContact" data-noexit="1"' : ""}`)}
      <a class="btn btn-safety two-line" style="margin-top:10px" href="${LINKS.call911}"${attr}>Call 911<span class="cap">If someone is hurt or in danger</span></a>
      <p class="note">ZigZag Mind is not an emergency service.</p>`,
      actions:`<button class="btn btn-primary" data-act="planDone">I'm done</button>` };
  },

  /* 6.6: Connect (I just feel alone). Zags (6.7) and the code word (6.8) join this screen when they're built. */
  connect(){
    const people = getPlan().trustedPeople || [];
    const first = people[0];
    return { close:true, body:`
      ${title("You don't have to sit with this alone.")}
      <div class="panel conn">
        <p class="lbl">Talk to someone who's been there</p>
        <h3>${WARMLINE.name}</h3>
        <p class="small">${WARMLINE.hours} ${WARMLINE.about}</p>
        <a class="btn btn-primary" href="${WARMLINE.tel}">Call the Warm Line</a>
        <a class="conn-more" href="${WARMLINE.elsewhereUrl}" target="_blank" rel="noopener">${WARMLINE.elsewhere}</a>
      </div>
      <div class="panel conn" id="connPeople">
        <p class="lbl">Reach one of your people</p>
        ${people.length ? people.map(p => `<h3>${esc(p.name)}${p.relationship ? ` <span class="small">· ${esc(p.relationship)}</span>` : ""}</h3>
          <div class="pair">
            <a class="btn btn-secondary" href="${smsLink(p.phone)}" aria-label="Text ${esc(p.name)}">Text</a>
            <a class="btn btn-secondary" href="${telLink(p.phone)}" aria-label="Call ${esc(p.name)}">Call</a>
          </div>`).join("") + `
          ${codeWordButton(false)}
          <p class="small" style="margin:14px 0 8px">Don't know what to say${people.length > 1 ? ` to ${esc(first.name)}` : ""}? Tap one:</p>
          <div class="sits">${MESSAGE_IDEAS.map(m => `<a class="sit idea" href="${smsLink(first.phone, m)}">${esc(m)}</a>`).join("")}</div>`
        : `<p class="small">Add someone you trust, and they'll be here with Text and Call.</p>
          <button class="btn btn-secondary" data-act="planFromConnect">Add someone to My Plan</button>`}
      </div>
      <button class="card wide zcard" data-act="zags" data-arg="connect" style="margin-top:14px">${zagsFace()}<span>Stay with Zags for a few minutes<span class="meta">Until someone calls back</span></span></button>
      <button class="link" data-act="songStart" data-arg="connect">Make a song while you wait</button>
      ${faithOn() ? `<button class="link faith-link" data-act="faith">Need a little hope?</button>` : ""}
      <p class="lbl">If it gets heavier</p>
      ${row988()}` };
  },

  "human-first"(){
    const p = person();
    const call = p ? `<a class="btn btn-primary" href="${telLink(p.phone)}">Call someone</a>` : `<button class="btn btn-primary" data-act="route" data-arg="connect">Call someone</button>`;
    const text = p ? `<a class="btn btn-secondary" href="${smsLink(p.phone)}">Text someone</a>` : `<button class="btn btn-secondary" data-act="route" data-arg="connect">Text someone</button>`;
    return { close:true, body:`
      ${title("Would talking to a person help more than another answer?")}
      ${p ? `<p class="sub">${esc(p.name)} is in your plan.</p>` : ""}`,
      actions:`${call}${text}
        <button class="btn btn-secondary" data-act="hfPeople">Be around people</button>
        <button class="link" data-act="hfNotNow">Not right now</button>` };
  },

  /* 6.13: After the ER or hospital. */
  "after-setup"(){
    return { close:true, body:`
      ${title("When did you leave?")}
      <p class="sub">For the next 30 days, ZigZag Mind keeps a few things close: 988, your people, and a short, optional checklist. You can end this any time in Settings.</p>
      <div class="list">${AFTER_LEFT.map(([k, t]) => `<button class="card" data-act="afterLeft" data-arg="${k}"><span>${t}</span></button>`).join("")}</div>` };
  },
  after(){
    const a = afterCrisis() || { done:{} };
    const p = person();
    const done = k => k === "code" ? !!codeWord() || !!a.done.code : k === "checkin" ? checkinAsked().length > 0 || !!a.done.checkin : !!a.done[k];
    const box = k => `<button class="after-box" data-act="afterToggle" data-arg="${k}" aria-pressed="${done(k)}" aria-label="Mark as done: ${esc(AFTER_ITEMS.find(x => x[0] === k)[1])}">${done(k) ? "✓" : ""}</button>`;
    const item = (k, extra) => `<div class="after-item">${box(k)}<div class="after-txt"><b>${AFTER_ITEMS.find(x => x[0] === k)[1]}</b>${extra || ""}</div></div>`;
    return { close:true, body:`
      ${afterBar()}
      ${title("Welcome home. One small thing at a time.")}
      <p class="sub">All optional. Any order.</p>
      ${item("tell", p ? `<a class="btn btn-secondary after-btn" href="${smsLink(p.phone, AFTER_HOME_MSG)}">Text ${esc(p.name)}</a>`
        : `<button class="btn btn-secondary after-btn" data-act="planEdit" data-arg="trustedPeople">Add someone to My Plan</button>`)}
      ${item("code", codeWord() ? `<span class="small">Done · ${esc(codeWord().word)} with ${esc(codeWord().person.name)}</span>` : `<button class="btn btn-secondary after-btn" data-act="cwStart">Set it up</button>`)}
      ${item("appt", `<span class="small">${AFTER_NO_APPT}</span>
        <div class="after-appt"><label for="apptDate" class="small">Date</label><input class="field" type="date" id="apptDate">
        <label for="apptTime" class="small">Time (optional)</label><input class="field" type="time" id="apptTime"></div>
        <button class="btn btn-secondary after-btn" data-act="afterAppt">Add it to my calendar</button>`)}
      ${item("checkin", checkinAsked().length ? `<span class="small">Asked: ${checkinAsked().map(x => esc(x.name)).join(", ")}</span>` : `<button class="btn btn-secondary after-btn" data-act="ciStart">Ask someone</button>`)}
      ${item("daily", `<span class="small">Adds them to your own calendar.</span><button class="btn btn-secondary after-btn" data-act="afterDaily">Add daily reminders</button>`)}
      ${ui.flash ? `<p class="flash" role="status">${esc(ui.flash)}</p>` : ""}
      <p class="small" style="margin-top:18px">${HELP_IS_STRENGTH}</p>` };
  },

  /* 6.15 Faith & hope (opt-in) */
  faith(){
    if (!faithOn()) return SCREENS.home();
    return { close:true, body:`
      <p class="step-count">Faith &amp; hope</p>
      ${title("Need a little hope?")}
      <p class="sub">Pick what fits right now.</p>
      <div class="list">${FAITH_PASSAGES.map(([k, m]) => `<button class="card" data-act="faithPick" data-arg="${k}"><span>${m}</span></button>`).join("")}</div>` };
  },
  "faith-passage"(){
    const f = FAITH_PASSAGES.find(x => x[0] === ui.faithKey);
    if (!faithOn() || !f) return SCREENS.home();
    const p = person();
    return { close:true, body:`
      <p class="step-count">${f[1]}</p>
      ${stepTitle(`“${f[2]}”`, true)}
      <p class="small">${f[3]} (KJV)</p>
      <p class="sub" style="margin-top:18px">Take this with you. Then:</p>
      <div class="sits faith-next">
        <button class="sit" data-act="faithPray">Pray</button>
        ${p ? `<a class="sit" href="${smsLink(p.phone, HARD_TIME_MSG)}">Text someone</a>` : `<button class="sit" data-act="route" data-arg="connect">Text someone</button>`}
        <button class="sit" data-act="lowPick" data-arg="walking">Take a walk</button>
        <button class="sit" data-act="lowPick" data-arg="grounding">Ground myself</button>
        <button class="sit" data-act="planNow">Open my plan</button>
      </div>` };
  },
  "faith-pray"(){
    if (!faithOn()) return SCREENS.home();
    return { close:true, body:`${stepTitle(FAITH_PRAY, true)}`,
      actions:`<button class="btn btn-primary" data-act="home">Done</button>
        <button class="btn btn-secondary" data-act="route" data-arg="connect">I'd like to talk to someone</button>` };
  },

  /* 6.14 Tech check */
  tech(){
    return { close:true, body:`
      ${title("Tech check")}
      <p class="sub">${TC_INTRO}</p>
      <div class="list">${TC_OPTIONS.map(([k, t, m]) => `<button class="card" data-act="tcPick" data-arg="${k}">${icon("phone", true)}<span>${t}${m ? `<span class="meta">${m}</span>` : ""}</span></button>`).join("")}</div>` };
  },
  "tc-reliance"(){
    return { close:true, body:`
      ${stepTitle(TC_RELIANCE, true)}
      <div class="list tc-sda">${TC_SDA.map(([h, t]) => `<div class="panel"><h3>${h}</h3><p class="small" style="margin:4px 0 0">${t}</p></div>`).join("")}</div>`,
      actions:`<button class="btn btn-primary" data-act="tcLoop">Start a 10-minute break</button>
        <button class="btn btn-secondary" data-act="tcReflect">I'm done</button>` };
  },
  "tc-check"(){
    return { close:true, body:`
      ${stepTitle(TC_CHECK_Q, true)}
      <p class="sub">Either is okay. Just notice which.</p>`,
      actions:`<button class="btn btn-secondary" data-act="tcLoop">Information</button>
        <button class="btn btn-secondary" data-act="tcLoop">Reassurance</button>` };
  },
  "tc-loop"(){
    const running = ui.tcLoopEnd && ui.tcLoopEnd > Date.now();
    const done = ui.tcLoopDone || {};
    return { close:true, body:`
      <p class="step-count">10-minute loop break</p>
      ${ui.tcLoopOver ? stepTitle(TC_LOOP_END, true) : `${title("Break the loop")}
        <p class="borrow-time" id="tcTime" role="timer" aria-label="Time left">${fmtTime(running ? ui.tcLoopEnd - Date.now() : TC_LOOP_MS)}</p>`}
      <div class="tc-steps">${TC_LOOP_STEPS.map(([k, t]) => `<div class="after-item"><button class="after-box" data-act="tcStep" data-arg="${k}" aria-pressed="${!!done[k]}" aria-label="Done: ${t}">${done[k] ? "✓" : ""}</button><div class="after-txt"><b>${t}</b>
        ${k === "game" ? `<div class="sits"><button class="sit" data-act="route" data-arg="head">A quick game</button><button class="sit" data-act="route" data-arg="scene">Change the scene</button></div>` : ""}</div></div>`).join("")}</div>
      ${ui.tcLoopOver ? "" : `<p class="sub" style="margin-top:12px">${TC_LOOP_ASK}</p>`}`,
      actions:`<button class="btn btn-primary" data-act="tcReflect">${ui.tcLoopOver ? "Next" : "I'm done"}</button>` };
  },
  "tc-fomo"(){
    const miss = ui.tcMiss || {};
    const d = ui.tcFomo || {};
    return { close:true, body:`
      ${title("Afraid you're falling behind?")}
      <h2>What are you afraid of missing?</h2>
      <div class="chips" role="group" aria-label="What you're afraid of missing">${TC_FOMO_MISS.map(x => `<button class="hchip" data-act="tcMiss" data-arg="${esc(x)}" aria-pressed="${!!miss[x]}">${x}</button>`).join("")}</div>
      ${TC_FOMO_FIELDS.map(([k, l, ph]) => `<label class="td-label" for="tcF_${k}">${l}</label><textarea class="field" id="tcF_${k}" maxlength="200" placeholder="${esc(ph)}" style="min-height:76px">${esc(d[k] || "")}</textarea>`).join("")}
      <p class="small" style="margin-top:8px">Only on this screen. Not saved.</p>
      ${ui.msg ? `<p class="err" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="tcFomoNext">Next</button>` };
  },
  "tc-fomo-end"(){
    const one = (ui.tcFomo || {}).do;
    return { close:true, body:`
      ${one ? `<p class="lbl">One thing I can actually do</p><p class="td-a">${esc(one)}</p>` : ""}
      ${stepTitle(TC_FOMO_END, true)}
      <h2>Talk it over with someone</h2>
      ${tcPersonButtons(HARD_TIME_MSG)}
      <p class="small" style="margin-top:16px">${TC_FOMO_USING} <button class="link inline" data-act="flow" data-arg="craving">Help with an urge</button></p>`,
      actions:`<button class="btn btn-primary" data-act="tcCheckin">Done</button>` };
  },
  "tc-attached"(){
    const g = ui.tcGives || {}, r = ui.tcReplacing || {};
    const p = person();
    return { close:true, body:`
      ${title(ui.tcKey === "instead" ? "Using AI instead of people" : "Getting attached to an AI")}
      <p class="sub">${TC_ATTACHED}</p>
      <h2>What does it give you?</h2>
      <div class="chips" role="group" aria-label="What it gives you">${TC_GIVES.map(x => `<button class="hchip" data-act="tcGive" data-arg="${esc(x)}" aria-pressed="${!!g[x]}">${x}</button>`).join("")}</div>
      <h2>What might it be replacing?</h2>
      <div class="chips" role="group" aria-label="What it might be replacing">${TC_REPLACING.map(x => `<button class="hchip" data-act="tcReplace" data-arg="${esc(x)}" aria-pressed="${!!r[x]}">${x}</button>`).join("")}</div>
      <p class="small" style="margin-top:8px">Just for you to notice. Not saved.</p>
      <h2>Would one real-world connection help right now?</h2>
      <div class="list tc-real">
        ${p ? `<a class="btn btn-secondary" href="${smsLink(p.phone, "hey")}">Text someone</a><a class="btn btn-secondary" href="${telLink(p.phone)}">Call someone</a>`
          : `<button class="btn btn-secondary" data-act="route" data-arg="connect">Text someone</button><button class="btn btn-secondary" data-act="route" data-arg="connect">Call someone</button>`}
        <button class="btn btn-secondary" data-act="hfPeople">Be around people</button>
        <button class="btn btn-secondary" data-act="route" data-arg="scene">Go somewhere</button>
        <button class="btn btn-secondary" data-act="tcLoop">Take a tech break</button>
      </div>
      <div class="panel tc-boundary">
        <h3>Set a boundary with your AI</h3>
        <p class="small" style="margin:4px 0 8px">Paste this into your AI's custom instructions.</p>
        <blockquote id="tcBoundary">${TC_BOUNDARY}</blockquote>
        <button class="btn btn-secondary" data-act="tcCopy">Copy boundary text</button>
        ${ui.flash ? `<p class="flash" role="status">${esc(ui.flash)}</p>` : ""}
        <p class="small" style="margin:8px 0 0">${TC_BOUNDARY_NOTE}</p>
      </div>`,
      actions:`<button class="btn btn-primary" data-act="tcReflect">I'm done</button>` };
  },
  "tc-loss"(){
    const step = ui.tcStep || 0;
    if (step === 0) return { close:true, body:`${stepTitle(TC_LOSS, true)}`, actions:`<button class="btn btn-primary" data-act="tcLossNext">Next</button>` };
    if (step === 1) return { close:true, body:`<p class="step-count">One moment</p>${stepTitle(TC_LOSS_GROUND, true)}`, actions:`<button class="btn btn-primary" data-act="tcLossNext">Done</button>` };
    if (step === 2) return { close:true, body:`
      ${title("Write what you'd want to say")}
      <p class="sub">Optional. Only on this screen. Not saved.</p>
      <label class="sr" for="tcLossBox">What you'd want to say</label>
      <textarea class="field" id="tcLossBox" maxlength="500" style="min-height:140px"></textarea>
      ${ui.msg ? `<p class="err" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="tcLossWrite">Done writing</button><button class="link" data-act="tcLossSkip">Skip</button>` };
    return { close:true, body:`
      ${ui.tcWrote ? `<p class="notice">You said it. It isn't kept anywhere.</p>` : ""}
      ${title("Tell one person")}
      <p class="sub">"${TC_LOSS_MSG}"</p>
      ${tcPersonButtons(TC_LOSS_MSG)}`,
      actions:`<button class="btn btn-primary" data-act="tcCheckin">Done</button>` };
  },
  "tc-reflect"(){
    return { close:true, body:`
      ${title("Which feels closest right now?")}
      <p class="sub">Only you can say. Nothing is scored or saved.</p>`,
      actions:`${TC_REFLECT.map((x, i) => `<button class="btn btn-secondary" data-act="tcCheckin" data-arg="r${i}">${x}</button>`).join("")}
        <button class="link" data-act="tcCheckin">Skip</button>` };
  },

  /* 6.16 Turn it into a song. */
  song(){
    const kept = songs().length;
    return { close:true, body:`
      ${title("Turn it into a song.")}
      <p class="sub">${SONG_INTRO}</p>
      <h2>How does it feel right now?</h2>
      <div class="chips" role="group" aria-label="How it feels">
        ${Object.entries(SONG_MOODS).map(([k, m]) => `<button class="hchip" data-act="songMood" data-arg="${k}" aria-pressed="${ui.songMood === k}">${m.label}</button>`).join("")}
      </div>`,
      actions:`<button class="btn btn-primary" data-act="songNext"${ui.songMood ? "" : " disabled"}>Next</button>
        ${kept ? `<button class="link" data-act="songList">My songs</button>` : ""}` };
  },
  "song-line"(){
    const i = ui.songIdx || 0;
    const [q, sub, ph] = SONG_PROMPTS[i];
    return { close:true, body:`
      <p class="step-count">Line ${i + 1} of 3</p>
      ${title(q)}
      <p class="sub">${sub}</p>
      <label class="small" for="songBox" style="display:block;margin-top:14px">${SONG_TYPE_HINT}</label>
      <textarea class="field" id="songBox" maxlength="${SONG_LINE_MAX}" placeholder="${esc(ph)}">${esc((ui.songLines || [])[i] || "")}</textarea>
      ${ui.msg ? `<p class="err" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="songLine">${i < 2 ? "Next" : "Make my song"}</button>
        ${i > 0 ? `<button class="btn btn-secondary" data-act="songBack">Back</button>` : ""}` };
  },
  "song-play"(){
    const s = ui.song;
    if (!s) return SCREENS.song();
    const all = [...s.lines, ...s.still];
    const lyric = (t, i) => `<p class="lyric${i >= 2 ? " still" : ""}${ui.songEnded ? " now" : ""}" id="ly${i}">${t.split(" ").map((w, j) => `<span class="w" id="sw${i}_${j}">${esc(w)}</span>`).join(" ")}</p>`;
    const voice = ("speechSynthesis" in window)
      ? `<button class="chip zvoice" data-act="songVoice" aria-pressed="${!!ui.songVoice}">${ui.songVoice ? "Voice on" : "Voice off"}</button>` : "";
    let after = "", acts = "";
    if (ui.songEnded && !ui.songReplay){
      const p = person();
      after = `<p class="sub song-made">${SONG_MADE}</p>`;
      acts = `<button class="btn btn-primary" data-act="songKeep"${ui.songKept ? " disabled" : ""}>${ui.songKept ? "Kept in My songs" : "Keep it in My songs"}</button>
        <a class="btn btn-secondary" href="${smsLink(p ? p.phone : "", SONG_SHARE_MSG)}">Share how you're doing with someone</a>
        <button class="btn btn-secondary" data-act="songDone">Done</button>
        <button class="link" data-act="songAgain">Make another</button>`;
    } else if (ui.songEnded){
      after = `<h2 class="song-q">How does this feel now?</h2>`;
      acts = Object.entries(SONG_REFLECT).map(([k, [l]]) => `<button class="btn btn-secondary" data-act="songReflect" data-arg="${k}">${l}</button>`).join("");
    } else acts = "";
    return { close:true, body:`
      <div class="song-player">
        ${songZagsSvg()}
        <div class="song-bars" aria-hidden="true">${Array.from({ length:12 }, (_, i) => `<span class="song-bar" id="sb${i}"></span>`).join("")}</div>
        <p class="step-count" id="songSec" aria-live="polite">${ui.songEnded ? "That's your song." : `${SONG_MOODS[s.mood].label} · ${s.date ? "from " + esc(songDate(s.date)) : "your song"}`}</p>
        <h1 id="screen-title" tabindex="-1" class="sr">Your song</h1>
        <div class="lyrics">${all.map(lyric).join("")}</div>
        <button class="btn btn-primary" id="songPlayBtn" data-act="songToggle">${ui.songEnded ? "▶ Play again" : "▶ Play my song"}</button>
        <p class="small">${SONG_SILENT}</p>
        ${voice}
        ${after}
      </div>`,
      actions:acts };
  },
  "song-reflect"(){
    const k = ui.songNow, heavier = k === "heavier";
    const p = person();
    return { close:true, body:`
      ${stepTitle((SONG_REFLECT[k] || SONG_REFLECT.same)[1], true)}
      ${heavier ? `<div class="pair" style="margin-top:14px"><a class="btn btn-safety" href="tel:988">Call 988</a><a class="btn btn-safety" href="sms:988">Text 988</a></div>
        ${p ? `<a class="btn btn-secondary" style="margin-top:10px" href="${smsLink(p.phone, HARD_TIME_MSG)}">Text ${esc(p.name)}</a>`
          : `<button class="btn btn-secondary" style="margin-top:10px" data-act="route" data-arg="connect">Text someone you trust</button>`}` : ""}
      <h2>Add something that's still true today</h2>
      <p class="sub">It becomes a new last line, so the song grows with you.</p>
      <label class="sr" for="songBox">Something that's still true today</label>
      <textarea class="field" id="songBox" maxlength="${SONG_LINE_MAX}" placeholder="I made it through that week"></textarea>
      ${ui.msg ? `<p class="err" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="songAdd">Add it and play</button>
        <button class="btn btn-secondary" data-act="songList">Not now</button>` };
  },
  "song-list"(){
    const list = songs();
    return { close:true, body:`
      ${title("My songs")}
      <p class="sub">Saved only on this phone. Listen back and notice what's changed.</p>
      ${ui.flash ? `<p class="flash" role="status">${esc(ui.flash)}</p>` : ""}
      <div class="panel">${list.length ? list.map(s => {
        const name = s.lines[0].length > 40 ? s.lines[0].slice(0, 40) + "…" : s.lines[0];
        if (ui.songDel === s.id) return `<div class="song-row"><span><b>Delete this song?</b><span class="small">${esc(name)}</span></span>
          <span class="song-btns"><button class="edit-btn" data-act="songDelYes" data-arg="${esc(s.id)}">Delete</button><button class="edit-btn" data-act="songDelNo">Keep</button></span></div>`;
        return `<div class="song-row"><span><b>${esc(name)}</b><span class="small">${esc(songDate(s.date))} · ${SONG_MOODS[s.mood].label}${s.still.length ? ` · ${s.still.length} added later` : ""}</span></span>
          <span class="song-btns"><button class="edit-btn" data-act="songOpen" data-arg="${esc(s.id)}" aria-label="Play: ${esc(name)}">Play</button><button class="edit-btn" data-act="songDel" data-arg="${esc(s.id)}" aria-label="Delete: ${esc(name)}">Delete</button></span></div>`;
      }).join("") : `<p class="empty">No songs yet.</p>`}</div>`,
      actions:`<button class="btn btn-primary" data-act="songNew">Make a new song</button>` };
  },

  /* 6.17 C: Borrow ten minutes. Leaving early is never failing. */
  borrow(){
    return { close:true, body:`
      ${stepTitle("You don't have to decide the rest of your day.", true)}
      <p class="sub" style="font-size:19px">Just borrow the next ten minutes.</p>
      <div class="sits borrow-opts">${BORROW_OPTIONS.map(([k, t]) => `<button class="sit" data-act="borrowPick" data-arg="${k}">${t}</button>`).join("")}</div>` };
  },
  "borrow-step"(){
    const o = BORROW_OPTIONS.find(x => x[0] === ui.borrowOpt) || BORROW_OPTIONS[0];
    const p = person();
    const running = ui.borrowEnd && ui.borrowEnd > Date.now();
    return { close:true, body:`
      <p class="step-count">Borrow ten minutes</p>
      ${stepTitle(o[2])}
      ${o[0] === "call" && p ? `<a class="btn btn-secondary" href="${telLink(p.phone)}">Call ${esc(p.name)}</a>` : ""}
      ${running ? `<p class="borrow-time" id="borrowTime" role="timer" aria-label="Time left">${fmtTime(ui.borrowEnd - Date.now())}</p><p class="sub" style="text-align:center">Leave any time.</p>`

      actions:`<button class="btn btn-primary" data-act="borrowDone">I'm done</button>` };
  },
  "borrow-end"(){ return endScreen("The ten minutes are yours."); },

  /* 6.17 D: the worst sentence → what's also true. Both lines safety-checked; nothing saved. */
  ts(){
    const second = ui.tsStep === 2;
    return { close:true, body:`
      <p class="step-count">What's also true</p>

      <label class="sr" for="tsBox">${second ? "What's also true" : "The sentence your brain keeps repeating"}</label>
      <input class="field" id="tsBox" maxlength="120" autocomplete="off" value="${esc(second ? (ui.tsTrue || "") : (ui.tsWorst || ""))}">
      ${second ? `<p class="small" style="margin:12px 0 6px">If it helps, tap one:</p>
        <div class="sits">${TS_EXAMPLES.map((x, i) => `<button class="sit" data-act="tsExample" data-arg="${i}">${esc(x)}</button>`).join("")}</div>` : ""}
      ${ui.msg ? `<p class="err" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="tsNext">Next</button>` };

  "ts-show"(){
    return { close:true, body:`
      <p class="step-count">What's also true</p>
      <p class="ts-worst">${esc(ui.tsWorst || "")}</p>
      ${stepTitle(esc(ui.tsTrue || ""), true)}`,
      actions:endActions() };
  },

  /* 6.17 E: Talk to yourself like a friend would. */
  stranger(){
    if (ui.strangerPicked) return endScreen("You can give yourself the same.");
    return { close:true, body:`
      ${stepTitle("If someone you cared about felt like this, what would you tell them?", true)}
      <div class="list">${STRANGER_OPTIONS.map((t, i) => `<button class="card" data-act="strangerPick" data-arg="${i}"><span>${t}</span></button>`).join("")}</div>` };
  },

  /* 6.17 F: Find something alive. */
  alive(){
    if (ui.alivePhase === "end") return endScreen("You spent a moment noticing something outside yourself.");
    if (ui.alivePhase === "pet" || ui.alivePhase === "outside"){
      return { close:true, body:`
        <p class="step-count">Find something alive</p>
        ${stepTitle(ui.alivePhase === "pet" ? ALIVE_PET : ALIVE_OUTSIDE)}`,
        actions:`<button class="btn btn-primary" data-act="aliveDone">Done</button>` };
    }
    return { close:true, body:`
      ${stepTitle("Find something alive.", true)}
      <p class="sub" style="font-size:19px">Do you have a pet nearby?</p>`,
      actions:`<button class="btn btn-primary" data-act="alivePet" data-arg="yes">Yes</button>
        <button class="btn btn-secondary" data-act="alivePet" data-arg="no">No</button>` };
  },

  /* 6.17 G: Ridiculous mode. Hidden in YELLOW and after any crisis screen; two missions per visit at most. */
  ridiculous(){
    const line = RIDICULOUS_LINES[(ui.ridIdx || 0) % RIDICULOUS_LINES.length];
    return { close:true, body:`
      <p class="step-count">Make this less serious. Just for a moment.</p>
      ${stepTitle(esc(line))}`,
      actions:`<button class="btn btn-primary" data-act="ridDone">Okay. Back to reality.</button>` };
  },

  /* 6.17 H: Touch something real. One prompt at a time; texture chips optional. */
  touch(){
    if (ui.touchPhase === "end") return endScreen("You found something real.");
    if (ui.touchPhase === "anchor"){
      return { close:true, body:`
        <p class="step-count">Find something real</p>
        ${stepTitle(ui.anchorAnswer === "yes" ? "Hold it for a moment." : ui.anchorAnswer === "no" ? "Find something else you can safely hold." : `Do you have your anchor nearby?`)}
        ${ui.anchorAnswer ? "" : `<p class="sub">${esc(getPlan().anchor || "")}</p>`}`,
        actions: ui.anchorAnswer ? `<button class="btn btn-primary" data-act="touchNext">Next</button>`
          : `<button class="btn btn-primary" data-act="anchorAns" data-arg="yes">Yes</button><button class="btn btn-secondary" data-act="anchorAns" data-arg="no">No</button>` };
    }
    const i = ui.touchIdx || 0;
    const chosen = ui.touchTex || {};
    return { close:true, body:`
      ${i === 0 ? `${stepTitle("Find something real.", true)}<p class="sub" style="font-size:19px">${TOUCH_PROMPTS[0]}</p>` : `<p class="step-count">Find something real</p>${stepTitle(TOUCH_PROMPTS[i])}`}
      <p class="small" style="margin:14px 0 6px">Optional: how does it feel?</p>
      <div class="sits">${TEXTURES.map(t => `<button class="sit" data-act="touchTex" data-arg="${t}" aria-pressed="${!!chosen[t]}">${t}</button>`).join("")}</div>`,
      actions:`<button class="btn btn-primary" data-act="touchNext">${i >= TOUCH_PROMPTS.length - 1 ? "Done" : "Next"}</button>
        <button class="link" data-act="touchDone">Done</button>` };
  },

  /* 6.5: Change the scene. */
  scene(){
    return { close:true, body:`

      <p class="sub">Sometimes your brain needs a different place, not another question. Pick one.</p>

        `<button class="card scene-opt" data-act="scenePick" data-arg="${k}">${icon("door")}<span>${t}</span></button>`).join("")}
        <button class="card scene-opt" data-act="sceneAlive">${icon("leaf")}<span>Find something alive</span></button>
      </div>
      <h2 id="placesHead" tabindex="-1">Somewhere to go</h2>

      <div class="panel scene-211">
        <h3>Need real-world help near you?</h3>
        <p class="small" style="margin:0 0 10px">211 connects you to local help: food, housing, support groups. Free.</p>
        <a class="btn btn-secondary" href="${LINKS.call211}">Call 211</a>
      </div>` };

  "scene-step"(){

      <p class="step-count">Change the scene</p>

      <p class="sub">Tap Done when you've done it, or whenever you're ready.</p>`,
      actions:`<button class="btn btn-primary" data-act="sceneDone">Done</button>` };
  },

  /* 6.4: Get out of my head. ("Thoughts stuck on repeat? Break the loop" waits for 6.14.) */
  distract(){
    return { close:true, body:`
      ${title("Get out of my head.")}

      <button class="card wide song-card" data-act="songStart" data-arg="head">${icon("head", true)}<span>Turn it into a song<span class="meta">Three lines in your words, made into a short song</span></span></button>

      </div>` };

  "g-color"(){
    const part = COLOR_HUNT[ui.gamePart || 0] || COLOR_HUNT[0];
    const dots = (ui.gameDots && ui.gameDots.length ? ui.gameDots : Array(part.n).fill(false)).map((on, i) =>
      `<button class="dot ${part.color}" data-act="gDot" data-arg="${i}" aria-pressed="${on}" aria-label="${part.color[0].toUpperCase() + part.color.slice(1)} thing ${i + 1}"></button>`).join("");

  "g-around"(){
    const found = ui.gameFound || {};
    return { close:true, body:`

      ${stepTitle("Look around you. Find each one.", true)}
      <p class="sub">Tap each one when you find it. Skip any you like.</p>

        <span class="ck" aria-hidden="true">${found[i] ? "✓" : ""}</span><span class="tx">${t}</span></button>`).join("")}`,
      actions:`<button class="btn btn-primary" data-act="gDone">Done</button>` };
  },

  "g-cats"(){
    const i = Math.min(ui.gamePart || 0, CATEGORIES.length - 1);
    const n = Math.min((ui.gameDots || []).length, CATEGORY_N);
    const last = i === CATEGORIES.length - 1;
    return { close:true, body:`
      <p class="step-count">Rapid categories · Part ${i + 1} of ${CATEGORIES.length}</p>
      ${stepTitle(CATEGORIES[i][1], true)}
      <p class="sub">Out loud or in your head. Tap the button for each one.</p>
      <div class="dots" aria-hidden="true">${Array.from({ length:CATEGORY_N }, (_, k) => `<span class="dot${k < n ? " on" : ""}"></span>`).join("")}</div>
      <button class="btn btn-secondary" data-act="gTally">I named one</button>`,
      actions:`<button class="btn btn-primary" data-act="gNext">${last ? "Done" : "Next"}</button>` };
  },

  "g-memory"(){
    const round = MEMORY_ROUNDS[ui.memRound || 0];
    const phase = ui.memPhase || "show";
    const shape = (k, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${MEMORY_SHAPES[k]}</svg>${extra}`;
    if (phase === "show"){
      return { close:true, body:`
        <p class="step-count">Memory snap</p>
        ${stepTitle("Look at these 6 shapes.", true)}
        <p class="sub">They'll hide in a few seconds.</p>
        <ul class="shapes" aria-label="Shapes to remember">${round.show.map(k => `<li class="shape" role="img" aria-label="${k}">${shape(k)}</li>`).join("")}</ul>` };
    }
    const picked = ui.memPicked || {};
    if (phase === "pick"){
      return { close:true, body:`
        <p class="step-count">Memory snap</p>
        ${stepTitle("Tap the ones you remember.", true)}
        <p class="sub">Guessing is fine.</p>
        <div class="shapes">${round.all.map(k => `<button class="shape" data-act="memPick" data-arg="${k}" aria-pressed="${!!picked[k]}" aria-label="${k}">${shape(k)}</button>`).join("")}</div>`,
        actions:`<button class="btn btn-primary" data-act="memReveal">Show me</button>` };

        return `<li class="shape${was ? " was" : ""}${picked[k] ? " picked" : ""}" role="img" aria-label="${k}${was ? ", was there" : ""}${picked[k] ? ", you tapped it" : ""}">${shape(k)}</li>`; }).join("")}</ul>`,
      actions:`<button class="btn btn-primary" data-act="gDone">Done</button>` };
  },

  "g-pattern"(){
    const done = !!ui.patDone;
    return { close:true, body:`
      <p class="step-count">Pattern break</p>
      ${stepTitle(done ? "That's the pattern." : "Watch the pads light up, then tap them back.", true)}
      <p class="sub">${done ? "Take a breath." : "Missed one? It just plays again."}</p>
      <div class="pads">${PATTERN_PADS.map((p, i) => `<button class="pad p${i}" id="pad${i}" data-act="padTap" data-arg="${i}" aria-label="Pad, ${p}"></button>`).join("")}</div>

function computeProgress(){
  const since = Date.now() - 7 * 86400000;
  const hist = [ ...store.sensitive.baseHistory, ...session.sessionHistory ].filter(h => (h.timestamp || 0) >= since);
  const act = store.sensitive.activity.filter(a => a.ts >= since);
  const count = t => act.filter(a => a.type === t).length;
  const rated = hist.filter(h => typeof h.before === "number" && typeof h.after === "number");
  const by = {};
  rated.forEach(h => { if (!findIntervention(h.interventionId)) return; (by[h.interventionId] = by[h.interventionId] || []).push(h.before - h.after); });
  let best = null;
  Object.entries(by).forEach(([id, drops]) => {
    if (drops.length < 2) return;
    const avg = drops.reduce((a, b) => a + b, 0) / drops.length;
    if (avg > 0 && (!best || avg > best.avg)) best = { name:findIntervention(id).name, uses:drops.length, avg };
  });
  const r1 = x => Math.round(x * 10) / 10;
  return {
    moments:count("moment"), planUses:count("plan"), reach:count("reach"), actions:hist.length,
    best, rated:rated.length,
    avgBefore:rated.length ? r1(rated.reduce((a, h) => a + h.before, 0) / rated.length) : null,
    avgAfter:rated.length ? r1(rated.reduce((a, h) => a + h.after, 0) / rated.length) : null,
    hasSample:store.sensitive.baseHistory.some(h => h.source === "sample") || store.sensitive.activity.some(a => a.sample)
  };
}

function buildExport(){
  const strip = h => ({ state:h.state, interventionId:h.interventionId, before:h.before, after:h.after,
    date:h.timestamp ? new Date(h.timestamp).toISOString() : null, sample:h.source === "sample" || undefined });
  return {
    exportedAt:new Date().toISOString(),
    app:store.product.appVersion,
    plan:getPlan(),
    checkIns:[ ...store.sensitive.baseHistory, ...session.sessionHistory ].map(strip),
    activity:store.sensitive.activity.map(a => ({ type:a.type, date:new Date(a.ts).toISOString(), sample:a.sample || undefined })),
    first30Days:store.sensitive.afterCrisis ? { start:new Date(store.sensitive.afterCrisis.start).toISOString(), until:new Date(store.sensitive.afterCrisis.until).toISOString(), done:store.sensitive.afterCrisis.done } : undefined,
    songs:songs().length ? songs().map(x => ({ date:new Date(x.date).toISOString(), mood:x.mood, lines:x.lines, still:x.still })) : undefined
  };
}

function cravingTick(){
  if (session.screen !== "craving-delay"){ clearInterval(cravingTimer); cravingTimer = null; return; }
  const left = ui.cravingEnd - Date.now();
  const tm = document.getElementById("crvTime");
  const ring = document.getElementById("crvRing");
  if (left <= 0){ clearInterval(cravingTimer); cravingTimer = null; render(); return; }
  if (tm) tm.textContent = fmtTime(left);
  if (ring){
    const C = 2 * Math.PI * 100;
    const total = Math.max(CRAVING_MS, ui.cravingEnd - ui.cravingStart);
    ring.setAttribute("stroke-dashoffset", (C * (left / total)).toFixed(1));
  }
}

function focusGeom(){
  const area = document.getElementById("focusArea"), orb = document.getElementById("focusOrb");
  if (!area || !orb) return null;
  return { area, orb, w:area.clientWidth, ow:orb.offsetWidth || 42 };
}
function focusLoop(ts){
  if (session.screen !== "focus"){ focusRaf = null; return; }
  const g = focusGeom();
  if (g){
    const t = (ts - ui.focusStart) / 1000;
    const period = reducedMotion() ? 8 : 4.5;
    const x = ((Math.sin(t * 2 * Math.PI / period) + 1) / 2) * (g.w - g.ow);
    const y = reducedMotion() ? 0 : Math.sin(t * 2 * Math.PI / (period * 1.7)) * 18;   // reduced motion: slower, side to side only
    ui.focusX = x;
    g.orb.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    const left = Math.max(0, 60 - t);
    const tEl = document.getElementById("focusTime");
    if (tEl) tEl.textContent = left > 0 ? fmtTime(left * 1000) : "That's a minute";
    if (left <= 0 && !ui.focusEndedMsg){
      ui.focusEndedMsg = true;
      const m = document.getElementById("focusMsg");
      if (m) m.textContent = session.currentInterventionId === "distraction_60_second" ? "You beat the timer." : "Stop whenever you like.";
    }
  }
  focusRaf = requestAnimationFrame(focusLoop);
}
function focusTap(){
  const g = focusGeom();
  if (!g) return;
  const orbCenter = (ui.focusX || 0) + g.ow / 2;
  if (Math.abs(orbCenter - g.w / 2) <= 24){
    const tg = document.getElementById("focusTarget"), m = document.getElementById("focusMsg");
    if (tg){ tg.classList.remove("hit"); void tg.offsetWidth; tg.classList.add("hit"); }
    if (m) m.textContent = "Nice.";
    buzz();
    clearTimeout(ui.focusMsgTimer);

/* 6.7 Zags runtime: breathing timer, the drawing, and optional on-device voice. */
let zagsTimer = null, zagsFadeRaf = null;
function zagsBreaths(){ return reducedMotion() ? 3 : 4; }
function zagsLine(z){
  z = z || { phase:"hello" };
  if (z.phase === "breathe") return z.half ? ZAGS_LINES[z.half] : ZAGS_LINES.quiet;
  if (z.phase === "steps") return ZAGS_LINES[ZAGS_STEPS[z.step || 0]];
  return ZAGS_LINES[{ hello:"hello", check:"check", better:"better", again:"again", hard:"stillHard", bye:"bye" }[z.phase] || "hello"];
}
function zagsPhase(phase){
  if (phase !== "breathe") zagsStopBreathing();
  ui.zags.phase = phase;
  if (phase === "steps" && ui.zags.step >= ZAGS_STEPS.length) ui.zags.step = 0;
  lastRendered = null; render();
  zagsSpeak(zagsLine(ui.zags));
}
function zagsSpeak(text){
  if (!ui.zagsVoice || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.88; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch (_){}
}
function zagsHush(){ try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (_){} }
function zagsStopBreathing(){ clearTimeout(zagsTimer); zagsTimer = null; cancelAnimationFrame(zagsFadeRaf); zagsFadeRaf = null; }
function zagsStartBreathing(){
  zagsStopBreathing();
  const z = ui.zags;
  const tick = () => {
    if (session.screen !== "zags" || session.safetyLevel === "RED" || !ui.zags || ui.zags.phase !== "breathe"){ zagsStopBreathing(); return; }
    if (z.half === "in"){ z.half = "out"; }
    else { if (z.half === "out") z.breath++; z.half = "in"; }
    if (z.breath >= zagsBreaths()){ z.half = null; z.step = 0; zagsPhase("steps"); return; }
    zagsShowBreath(z);
    zagsSpeak(ZAGS_LINES[z.half]);
    zagsTimer = setTimeout(tick, z.half === "in" ? ZAGS_IN_MS : ZAGS_OUT_MS);
  };
  zagsTimer = setTimeout(tick, 2600);
}
/* Update in place (no re-render) so focus stays put; the sub-line is a polite live region. */
function zagsShowBreath(z){
  const b = document.getElementById("screen-title"), sub = document.getElementById("zagsSub"), body = document.getElementById("zbody");
  if (b) b.textContent = ZAGS_LINES[z.half];
  if (sub) sub.textContent = `Breath ${z.breath + 1} of ${zagsBreaths()}`;
  const eyesOpen = document.getElementById("zEyesOpen"), eyesCalm = document.getElementById("zEyesCalm");
  if (eyesOpen) eyesOpen.style.display = z.half === "out" ? "none" : "";
  if (eyesCalm) eyesCalm.style.display = z.half === "out" ? "" : "none";
  if (!body) return;
  if (reducedMotion()){ zagsFade(z.half === "in", z.half === "in" ? ZAGS_IN_MS : ZAGS_OUT_MS); return; }   // color fade, no scaling
  body.classList.toggle("zin", z.half === "in");
  body.classList.toggle("zout", z.half === "out");
}
/* Reduced motion: Zags gets lighter as you breathe in and deeper as you breathe out. Color only, nothing moves. */
const ZAGS_DEEP = [123,196,187], ZAGS_LIGHT = [184,226,220];
function zagsFade(toLight, ms){
  cancelAnimationFrame(zagsFadeRaf);
  const el = document.getElementById("zfill");
  if (!el) return;
  const from = (el.getAttribute("data-rgb") || ZAGS_DEEP.join(",")).split(",").map(Number), to = toLight ? ZAGS_LIGHT : ZAGS_DEEP;
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / ms);
    const c = from.map((v, i) => Math.round(v + (to[i] - v) * k));
    el.setAttribute("fill", `rgb(${c.join(",")})`); el.setAttribute("data-rgb", c.join(","));
    if (k < 1 && session.screen === "zags") zagsFadeRaf = requestAnimationFrame(step);
  };
  zagsFadeRaf = requestAnimationFrame(step);
}

/* 6.8: three different neutral suggestions (not the ones just shown, when possible). */
function pickCodeWords(avoid = []){
  let pool = CODE_WORDS.filter(w => !avoid.includes(w));
  if (pool.length < 3) pool = CODE_WORDS.slice();
  const out = [];
  while (out.length < 3){ const w = pool[Math.floor(Math.random() * pool.length)]; if (!out.includes(w)) out.push(w); }
  return out;
}

function memHide(){
  memTimer = null;
  if (session.screen !== "g-memory" || ui.memPhase !== "show") return;
  ui.memPhase = "pick"; lastRendered = null; render();

function patGap(){ return reducedMotion() ? 950 : 700; }
function lightPad(i, ms){
  document.querySelectorAll(".pad.lit").forEach(p => p.classList.remove("lit"));
  const el = document.getElementById("pad" + i);
  if (!el) return;
  el.classList.add("lit");
  clearTimeout(patLitTimer);
  patLitTimer = setTimeout(() => el.classList.remove("lit"), ms);

function setPatMsg(t){ const m = document.getElementById("patMsg"); if (m) m.textContent = t; }
function playPattern(){
  if (session.screen !== "g-pattern" || ui.patDone) return;
  clearTimeout(patTimer);
  ui.patInput = []; ui.patPlaying = true; setPatMsg("Watch.");
  const seq = ui.patSeq || PATTERNS[0], gap = patGap();
  let k = 0;
  const step = () => {
    if (session.screen !== "g-pattern"){ ui.patPlaying = false; return; }
    if (k < seq.length){ lightPad(seq[k], gap * 0.7); k++; patTimer = setTimeout(step, gap); return; }
    ui.patPlaying = false; patTimer = null; setPatMsg("Your turn.");

function patternTap(i){
  if (ui.patPlaying || ui.patDone) return;

/* With large text (e.g. 200%) the pinned top bar, action buttons and tab bar can cover most of the screen.
   If together they'd take more than 40% of it, let the bottom ones scroll with the page. Help stays pinned. */
function fitChrome(){
  const root = document.documentElement;
  root.classList.remove("crowded");
  const h = sel => { const el = document.querySelector(sel); return el ? el.offsetHeight : 0; };
  const pinned = h("header.top") + h(".actions") + h(".tabbar");
  root.classList.toggle("crowded", window.innerHeight > 0 && pinned > window.innerHeight * 0.4);
}
window.addEventListener("resize", () => fitChrome());

function render(){
  // Until onboarding is done, anything that would land on Home (first launch, leaving a crisis
  // screen, "I feel safer") starts onboarding instead. Crisis screens are never gated.
  if (session.screen === "home" && !prefs.onboarded) dispatch({ type:"SET_SCREEN", screen:"ob-about" });
  // F6: once someone says they're under 18, onboarding stays on the under-18 screen on this device. Crisis screens are never gated.
  if (prefs.under18 && !prefs.onboarded && /^ob-/.test(session.screen) && session.screen !== "ob-minor") dispatch({ type:"SET_SCREEN", screen:"ob-minor" });
  const s = session.screen;
  const def = (SCREENS[s] || SCREENS.home)();
  const changed = s !== lastRendered;
  const crisis = CRISIS_SCREENS.includes(s);
  if (crisis && !session.sawCrisis) dispatch({ type:"SAW_CRISIS" });
  document.documentElement.classList.toggle("crisis-mode", crisis);
  const showY = session.yellow && !NO_YBAR.includes(s);
  app.innerHTML = `
    <header class="top">${topBar(def)}${showY ? yellowBar() : ""}</header>
    <main class="screen${changed && !crisis ? " enter" : ""}">
      <div class="content">${def.body}</div>
      ${def.actions ? `<div class="actions">${def.actions}</div>` : ""}
    </main>
    ${def.nav ? tabBar() : ""}
    ${session.devPanelOpen ? devPanel() : ""}`;
  fitChrome();
  if (changed){
    window.scrollTo(0, 0);
    const h = document.getElementById("screen-title");
    if (h) h.focus({ preventScroll:true });
    lastRendered = s;
    clearInterval(palmsTimer); palmsTimer = null;
    clearInterval(cravingTimer); cravingTimer = null;
    if (focusRaf){ cancelAnimationFrame(focusRaf); focusRaf = null; }
    clearTimeout(memTimer); memTimer = null;
    zagsStopBreathing();
    clearInterval(borrowTimer); borrowTimer = null;
    if (s === "borrow-step" && ui.borrowEnd) borrowTimer = setInterval(borrowTick, 1000);
    if (s !== "zags") zagsHush();
    if (s !== "song-play") songStop();
    clearInterval(tcTimer); tcTimer = null;
    if (s === "tc-loop" && ui.tcLoopEnd) tcTimer = setInterval(tcTick, 1000);   // leaving the player (Help, X, RED) stops the song at once
    if (s === "zags" && ui.zags && ui.zags.phase === "breathe") zagsStartBreathing();
    if (s !== "g-pattern"){ clearTimeout(patTimer); patTimer = null; }
    if (s === "craving-delay") cravingTimer = setInterval(cravingTick, 1000);
    if (s === "g-memory" && ui.memPhase === "show") memTimer = setTimeout(memHide, MEMORY_SHOW_MS);
    if (s === "g-pattern" && !ui.patDone && !ui.patPlaying) playPattern();
    if (s === "focus"){ if (!ui.focusStart) ui.focusStart = performance.now(); focusRaf = requestAnimationFrame(focusLoop); }
    if (s === "anx-palms"){
      let n = 10;
      palmsTimer = setInterval(() => {
        n--; const el = document.getElementById("count");
        if (el) el.textContent = Math.max(n, 0);
        if (n <= 0){ clearInterval(palmsTimer); palmsTimer = null; if (el) el.textContent = "✓"; }
      }, 1000);
    }
  }
}

    if (blockIfRed()) return;

    if (ui.focusReturn === "craving"){ ui.focusReturn = null; ui.cravingDone = ui.cravingDone || {}; go("craving-delay"); return; }
    go("checkin");
  },

  talk(){ ui.prevScreen = session.screen; go("talk"); },
  talkBack(){ go(ui.prevScreen || "home"); },

  cYes(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"RED" }); ui.placesOpen = false; go("crisis-full"); },
  cNotSure(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"RED" }); ui.placesOpen = false; go("crisis-full"); },
  cNo(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"YELLOW" }); ui.talkOpen = false; go("crisis-no"); },
  cBack(){ exitCrisis(); },
  /* OWNER-APPROVED INTERIM, pending clinician: from the full crisis screen (after "Yes"/"I'm not sure"),
     "That's not what I meant" asks "Do you feel safer?" instead of going Home. */
  cFullBack(){ go("safety-check"); },
  cPlaces(){ ui.placesOpen = !ui.placesOpen; render(); },
  cPlan(){ ui.planFrom = "crisis"; logActivity("plan"); go("plan-now"); },

  noTalk(){ ui.talkOpen = !ui.talkOpen; render(); },
  noPlan(){ ui.planFrom = "no"; logActivity("plan"); go("plan-now"); },
  noGround(){ ui.noMode = true; startGround(); },
  planDone(){ go(ui.planFrom === "no" ? "safety-check" : ui.planFrom === "tab" ? "plan" : "crisis-full"); },
  planNow(){ ui.flash = ""; ui.planFrom = "tab"; logActivity("plan"); go("plan-now"); },

  safeYes(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"YELLOW" }); go("home"); },
  safeNo(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"RED" }); ui.placesOpen = false; go("crisis-full"); },
  safeNotSure(){ dispatch({ type:"SET_SAFETY_LEVEL", level:"RED" }); ui.placesOpen = false; go("crisis-full"); },

  planEdit(arg){
    const pb = getPlan();
    ui.editSection = arg; ui.formErr = ""; ui.flash = "";
    ui.draftHelps = [ ...pb.helps ]; ui.customDraft = ""; ui.anchorDraft = null;
    ui.peopleDraft = null; ui.proDraft = null;
    go("plan-edit");
  },
  planCancel(){ ui.formErr = ""; ui.planFrom = "tab"; go("plan"); },
  helpToggle(arg){
    const c = document.getElementById("edCustom"); if (c) ui.customDraft = c.value;
    const an = document.getElementById("edAnchor"); if (an) ui.anchorDraft = an.value;
    const d = ui.draftHelps;
    const i = d.indexOf(arg);
    if (i >= 0) d.splice(i, 1); else d.push(arg);
    render();
  },
  helpAdd(){
    const an = document.getElementById("edAnchor"); if (an) ui.anchorDraft = an.value;
    const c = document.getElementById("edCustom");
    const v = (c ? c.value : "").trim().toLowerCase().slice(0, 40);
    ui.customDraft = "";
    if (v && !ui.draftHelps.includes(v)) ui.draftHelps.push(v);
    render();
  },
  planSave(){
    // My Plan fields are deliberately NOT run through safetyCheck.
    const pb = getPlan(), key = ui.editSection;
    const sec = PLAN_SECTIONS.find(x => x[0] === key);
    if (!sec) return;
    const val = id => ((document.getElementById(id) || {}).value || "").trim();
    const kind = sec[2];
    if (kind === "list"){
      pb[key] = val("edList").split("\n").map(x => x.trim().slice(0, 120)).filter(Boolean).slice(0, 10);
    } else if (kind === "text"){
      pb[key] = val("edText").slice(0, 300);
    } else if (kind === "td"){
      pb.timeDistance = { keepAway:val("td0").slice(0, 400), holder:val("td1").slice(0, 200), getBack:val("td2").slice(0, 200) };
    } else if (kind === "helps"){
      const extra = val("edCustom").toLowerCase().slice(0, 40);
      if (extra && !ui.draftHelps.includes(extra)) ui.draftHelps.push(extra);
      pb.helps = [ ...ui.draftHelps ];
      pb.anchor = val("edAnchor").slice(0, 40);   // 6.17 H: plan field, exempt from safetyCheck
    } else if (kind === "people"){
      const people = [];
      ui.peopleDraft = [0,1,2].map(i => ({ name:val("pn" + i), phone:val("pp" + i), relationship:val("pr" + i) }));
      for (let i = 0; i < 3; i++){
        const name = val("pn" + i).slice(0, 40), phone = val("pp" + i).slice(0, 20), relationship = val("pr" + i).slice(0, 30);
        if (!name && !phone && !relationship) continue;
        if (!name || phone.replace(/\D/g, "").length < 7){
          ui.formErr = `Person ${i + 1} needs a name and a phone number with at least 7 digits.`;
          render(); return;
        }
        people.push({ name, phone, relationship });
      }
      pb.trustedPeople = people;
    } else if (kind === "pro"){
      const name = val("proN").slice(0, 40), phone = val("proP").slice(0, 20);
      ui.proDraft = { name, phone };
      if (phone && phone.replace(/\D/g, "").length < 7){ ui.formErr = "That phone number needs at least 7 digits."; render(); return; }
      pb.professional = { name, phone };
    }
    saveStore();
    ui.peopleDraft = null; ui.proDraft = null;
    ui.formErr = ""; ui.flash = "Saved."; ui.planFrom = "tab";
    go("plan");
  },
  exportData(){ ui.flash = ""; go("export"); },
  copyExport(){
    const box = document.getElementById("exportBox");
    const text = box ? box.value : "";
    const done = () => { ui.flash = "Copied."; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, () => { if (box){ box.focus(); box.select(); } ui.flash = "Select all and copy."; render(); });
    } else if (box){ box.focus(); box.select(); ui.flash = "Select all and copy."; render(); }
  },
  toSettings(){ ui.flash = ""; go("settings"); },
  askDelete(){ ui.flash = ""; go("confirm-delete"); },
  deleteAll(){
    store.sensitive = { plan:emptyPlan(), baseHistory:[], activity:[], afterCrisis:null, songs:[] };
    saveStore();
    prefs.strength = null; savePrefs();   // 6.15: a faith answer is personal, so it goes too
    dispatch({ type:"DELETE_DATA" });
    ui.engine = null;
    ui.flash = "Everything was deleted.";
    go("settings");
  },
  loadSample(){
    store.sensitive = { plan:samplePlan(), baseHistory:seedHistory(), activity:seedActivity(), afterCrisis:store.sensitive.afterCrisis || null, songs:songs() };
    saveStore();
    ui.flash = "Sample data loaded.";
    render();
  },
  about(){ ui.flash = ""; go("about"); },
  howScroll(){ const el = document.getElementById("how"); if (el) el.scrollIntoView({ behavior:reducedMotion() ? "auto" : "smooth" }); },
  motion(arg){ prefs.reduce = arg === "reduce"; document.documentElement.classList.toggle("reduce", prefs.reduce); savePrefs(); render(); },
  haptics(arg){ prefs.haptics = arg === "on"; if (prefs.haptics) buzz(); savePrefs(); render(); },
  country(arg){ if (["auto","us","other"].includes(arg)){ prefs.country = arg; savePrefs(); } render(); },
  persist(arg){
    persistOn = arg === "on";
    if (persistOn){ saveStore(); ui.flash = "Saving is on. Your data stays on this device."; }
    else { clearSaved(); ui.flash = "Saving is off. Saved data was removed from this device."; }
    savePrefs(); render();
  },

  theme(arg){
    ui.theme = arg;
    if (arg === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = arg;
    savePrefs();
    render();
  }
};

document.addEventListener("click", e => {
  const link = e.target.closest("a[href]");
  if (link && !link.hasAttribute("data-kind") && /^(tel:|sms:|https:\/\/988lifeline)/.test(link.getAttribute("href"))) logActivity("reach");
  if (session.screen === "zags" && ui.zagsVoice) zagsHush();   // Zags's voice stops the moment the person taps anything
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  // NO-branch Call/Text: let the phone link open, and set the safety question
  // as the current screen in the same handler so it is waiting on return.
  if (el.hasAttribute("data-noexit")){
    dispatch({ type:"SET_SCREEN", screen:"safety-check" });
    setTimeout(render, 400);
    return;
  }
  if (el.tagName === "A") return;
  e.preventDefault();
  const fn = ACTIONS[act];
  if (fn) fn(el.getAttribute("data-arg"), el, e);
});

/* Focus game input */
document.addEventListener("pointerdown", e => {
  if (session.screen === "focus" && e.target.closest("#focusArea")){ e.preventDefault(); focusTap(); }
});
document.addEventListener("keydown", e => {
  if (session.screen === "focus" && document.activeElement && document.activeElement.id === "focusArea" && (e.key === " " || e.key === "Enter")){
    e.preventDefault(); focusTap();
  }
});

/* Thought Parking drag (handle only; tap buttons remain the accessible path) */
let drag = null;
document.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-drag]");
  if (!h || session.screen !== "spiral-sort") return;
  const card = h.closest(".tcard");
  if (!card) return;
  e.preventDefault();
  try { h.setPointerCapture(e.pointerId); } catch(_){}
  drag = { idx:Number(h.getAttribute("data-drag")), card, x0:e.clientX, y0:e.clientY, sy0:window.scrollY, zone:null };
  card.classList.add("dragging");
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0 + (window.scrollY - drag.sy0);
  drag.card.style.transform = `translate(${e.clientX - drag.x0}px, ${dy}px)`;
  drag.card.style.pointerEvents = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const zone = under && under.closest("[data-zone]");
  document.querySelectorAll(".zone.over").forEach(z => { if (z !== zone) z.classList.remove("over"); });
  if (zone) zone.classList.add("over");
  drag.zone = zone ? zone.getAttribute("data-zone") : null;
  if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 12);
  else if (e.clientY < 120) window.scrollBy(0, -12);
});
function endDrag(){
  if (!drag) return;
  const d = drag; drag = null;
  d.card.classList.remove("dragging");
  d.card.style.transform = ""; d.card.style.pointerEvents = "";
  document.querySelectorAll(".zone.over").forEach(z => z.classList.remove("over"));
  const t = ui.thoughts[d.idx];
  if (d.zone && t && t.place !== d.zone){
    t.place = d.zone;
    ui.landed = d.idx;
    render();
    ui.landed = null;
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

loadStore();
if (savedTheme && savedTheme !== "auto"){ ui.theme = savedTheme; document.documentElement.dataset.theme = savedTheme; }
document.documentElement.classList.toggle("reduce", !!prefs.reduce);
render();

// Offline support: sw.js keeps this page on the device so crisis screens open with no connection.
try {
  if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
} catch (_){}
</script>

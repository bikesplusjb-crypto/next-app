function computeProgress(){
  const since = Date.now() - 7 * 86400000;
  const hist = [ ...store.sensitive.baseHistory, ...session.sessionHistory ].filter(h => (h.timestamp || 0) >= since);
  const act = store.sensitive.activity.filter(a => a.ts >= since);
  const count = t => act.filter(a => a.type === t).length;
  const rated = hist.filter(h => typeof h.before === "number" && typeof h.after === "number");
  const by = {};
  rated.forEach(h => { if (!findIntervention(h.interventionId)) return; (by[h.interventionId] = by[h.interventionId] || []).push(h.before - h.after); });
  let best = null;
  Object.entries(by).forEach(([id, drops]) => {
    if (drops.length < 2) return;
    const avg = drops.reduce((a, b) => a + b, 0) / drops.length;
    if (avg > 0 && (!best || avg > best.avg)) best = { name:findIntervention(id).name, uses:drops.length, avg };
  });
  const r1 = x => Math.round(x * 10) / 10;
  return {
    moments:count("moment"), planUses:count("plan"), reach:count("reach"), actions:hist.length,
    best, rated:rated.length,
    avgBefore:rated.length ? r1(rated.reduce((a, h) => a + h.before, 0) / rated.length) : null,
    avgAfter:rated.length ? r1(rated.reduce((a, h) => a + h.after, 0) / rated.length) : null,
    hasSample:store.sensitive.baseHistory.some(h => h.source === "sample") || store.sensitive.activity.some(a => a.sample)
  };
}

function buildExport(){
  const strip = h => ({ state:h.state, interventionId:h.interventionId, before:h.before, after:h.after,
    date:h.timestamp ? new Date(h.timestamp).toISOString() : null, sample:h.source === "sample" || undefined });
  return {
    exportedAt:new Date().toISOString(),
    app:store.product.appVersion,
    plan:getPlan(),
    checkIns:[ ...store.sensitive.baseHistory, ...session.sessionHistory ].map(strip),
    activity:store.sensitive.activity.map(a => ({ type:a.type, date:new Date(a.ts).toISOString(), sample:a.sample || undefined }))
  };
}

function focusGeom(){
  const area = document.getElementById("focusArea"), orb = document.getElementById("focusOrb");
  if (!area || !orb) return null;
  return { area, orb, w:area.clientWidth, ow:orb.offsetWidth || 42 };
}
function focusLoop(ts){
  if (session.screen !== "focus"){ focusRaf = null; return; }
  const g = focusGeom();
  if (g){
    const t = (ts - ui.focusStart) / 1000;
    const period = reducedMotion() ? 8 : 4.5;
    const x = ((Math.sin(t * 2 * Math.PI / period) + 1) / 2) * (g.w - g.ow);
    const y = reducedMotion() ? 0 : Math.sin(t * 2 * Math.PI / (period * 1.7)) * 18;   // reduced motion: slower, side to side only
    ui.focusX = x;
    g.orb.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    const left = Math.max(0, 60 - t);
    const tEl = document.getElementById("focusTime");
    if (tEl) tEl.textContent = left > 0 ? fmtTime(left * 1000) : "That's a minute";
    if (left <= 0 && !ui.focusEndedMsg){
      ui.focusEndedMsg = true;
      const m = document.getElementById("focusMsg");
      if (m) m.textContent = session.currentInterventionId === "distraction_60_second" ? "You beat the timer." : "Stop whenever you like.";
    }
  }
  focusRaf = requestAnimationFrame(focusLoop);
}
function focusTap(){
  const g = focusGeom();
  if (!g) return;
  const orbCenter = (ui.focusX || 0) + g.ow / 2;
  if (Math.abs(orbCenter - g.w / 2) <= 24){
    const tg = document.getElementById("focusTarget"), m = document.getElementById("focusMsg");
    if (tg){ tg.classList.remove("hit"); void tg.offsetWidth; tg.classList.add("hit"); }
    if (m) m.textContent = "Nice.";

/* 6.7 Zags runtime: breathing timer, the drawing, and optional on-device voice. */
let zagsTimer = null, zagsFadeRaf = null;
function zagsBreaths(){ return reducedMotion() ? 3 : 4; }
function zagsLine(z){
  z = z || { phase:"hello" };
  if (z.phase === "breathe") return z.half ? ZAGS_LINES[z.half] : ZAGS_LINES.quiet;
  if (z.phase === "steps") return ZAGS_LINES[ZAGS_STEPS[z.step || 0]];
  return ZAGS_LINES[{ hello:"hello", check:"check", better:"better", again:"again", hard:"stillHard", bye:"bye" }[z.phase] || "hello"];
}
function zagsPhase(phase){
  if (phase !== "breathe") zagsStopBreathing();
  ui.zags.phase = phase;
  if (phase === "steps" && ui.zags.step >= ZAGS_STEPS.length) ui.zags.step = 0;
  lastRendered = null; render();
  zagsSpeak(zagsLine(ui.zags));
}
function zagsSpeak(text){
  if (!ui.zagsVoice || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.88; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch (_){}
}
function zagsHush(){ try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (_){} }
function zagsStopBreathing(){ clearTimeout(zagsTimer); zagsTimer = null; cancelAnimationFrame(zagsFadeRaf); zagsFadeRaf = null; }
function zagsStartBreathing(){
  zagsStopBreathing();
  const z = ui.zags;
  const tick = () => {
    if (session.screen !== "zags" || session.safetyLevel === "RED" || !ui.zags || ui.zags.phase !== "breathe"){ zagsStopBreathing(); return; }
    if (z.half === "in"){ z.half = "out"; }
    else { if (z.half === "out") z.breath++; z.half = "in"; }
    if (z.breath >= zagsBreaths()){ z.half = null; z.step = 0; zagsPhase("steps"); return; }
    zagsShowBreath(z);
    zagsSpeak(ZAGS_LINES[z.half]);
    zagsTimer = setTimeout(tick, z.half === "in" ? ZAGS_IN_MS : ZAGS_OUT_MS);
  };
  zagsTimer = setTimeout(tick, 2600);
}
/* Update in place (no re-render) so focus stays put; the sub-line is a polite live region. */
function zagsShowBreath(z){
  const b = document.getElementById("screen-title"), sub = document.getElementById("zagsSub"), body = document.getElementById("zbody");
  if (b) b.textContent = ZAGS_LINES[z.half];
  if (sub) sub.textContent = `Breath ${z.breath + 1} of ${zagsBreaths()}`;
  const eyesOpen = document.getElementById("zEyesOpen"), eyesCalm = document.getElementById("zEyesCalm");
  if (eyesOpen) eyesOpen.style.display = z.half === "out" ? "none" : "";
  if (eyesCalm) eyesCalm.style.display = z.half === "out" ? "" : "none";
  if (!body) return;
  if (reducedMotion()){ zagsFade(z.half === "in", z.half === "in" ? ZAGS_IN_MS : ZAGS_OUT_MS); return; }   // color fade, no scaling
  body.classList.toggle("zin", z.half === "in");
  body.classList.toggle("zout", z.half === "out");
}
/* Reduced motion: Zags gets lighter as you breathe in and deeper as you breathe out. Color only, nothing moves. */
const ZAGS_DEEP = [123,196,187], ZAGS_LIGHT = [184,226,220];
function zagsFade(toLight, ms){
  cancelAnimationFrame(zagsFadeRaf);
  const el = document.getElementById("zfill");
  if (!el) return;
  const from = (el.getAttribute("data-rgb") || ZAGS_DEEP.join(",")).split(",").map(Number), to = toLight ? ZAGS_LIGHT : ZAGS_DEEP;
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / ms);
    const c = from.map((v, i) => Math.round(v + (to[i] - v) * k));
    el.setAttribute("fill", `rgb(${c.join(",")})`); el.setAttribute("data-rgb", c.join(","));
    if (k < 1 && session.screen === "zags") zagsFadeRaf = requestAnimationFrame(step);
  };
  zagsFadeRaf = requestAnimationFrame(step);
}

function pickCodeWords(avoid = []){
  let pool = CODE_WORDS.filter(w => !avoid.includes(w));

  const out = [];
  while (out.length < 3){ const w = pool[Math.floor(Math.random() * pool.length)]; if (!out.includes(w)) out.push(w); }
  return out;
}

let memTimer = null, patTimer = null, patLitTimer = null;
function stopGameTimers(){ clearTimeout(memTimer); clearTimeout(patTimer); clearTimeout(patLitTimer); memTimer = patTimer = patLitTimer = null; ui.patPlaying = false; }
function memHide(){
  memTimer = null;
  if (session.screen !== "g-memory" || ui.memPhase !== "show") return;
  ui.memPhase = "pick"; lastRendered = null; render();
}
function patGap(){ return reducedMotion() ? 950 : 700; }
function lightPad(i, ms){
  document.querySelectorAll(".pad.lit").forEach(p => p.classList.remove("lit"));
  const el = document.getElementById("pad" + i);
  if (!el) return;
  el.classList.add("lit");
  clearTimeout(patLitTimer);
  patLitTimer = setTimeout(() => el.classList.remove("lit"), ms);
}
function setPatMsg(t){ const m = document.getElementById("patMsg"); if (m) m.textContent = t; }
function playPattern(){
  if (session.screen !== "g-pattern" || ui.patDone) return;
  clearTimeout(patTimer);
  ui.patInput = []; ui.patPlaying = true; setPatMsg("Watch.");
  const seq = ui.patSeq || PATTERNS[0], gap = patGap();
  let k = 0;
  const step = () => {
    if (session.screen !== "g-pattern"){ ui.patPlaying = false; return; }
    if (k < seq.length){ lightPad(seq[k], gap * 0.7); k++; patTimer = setTimeout(step, gap); return; }
    ui.patPlaying = false; patTimer = null; setPatMsg("Your turn.");
  };
  patTimer = setTimeout(step, 500);
}
function patternTap(i){
  if (ui.patPlaying || ui.patDone) return;
  const seq = ui.patSeq || PATTERNS[0];
  if (seq[ui.patInput.length] !== i){   // no fail state: just show it again, gently
    setPatMsg("Let's watch it again.");
    clearTimeout(patTimer); ui.patPlaying = true;
    patTimer = setTimeout(playPattern, 800);
    return;
  }
  ui.patInput.push(i); buzz(); lightPad(i, 300);
  if (ui.patInput.length === seq.length){ ui.patDone = true; lastRendered = null; render(); }
}

/* With large text (e.g. 200%) the pinned top bar, action buttons and tab bar can cover most of the screen.
   If together they'd take more than 40% of it, let the bottom ones scroll with the page. Help stays pinned. */
function fitChrome(){
  const root = document.documentElement;
  root.classList.remove("crowded");
  const h = sel => { const el = document.querySelector(sel); return el ? el.offsetHeight : 0; };
  const pinned = h("header.top") + h(".actions") + h(".tabbar");
  root.classList.toggle("crowded", window.innerHeight > 0 && pinned > window.innerHeight * 0.4);
}
window.addEventListener("resize", () => fitChrome());

function render(){
  // Until onboarding is done, anything that would land on Home (first launch, leaving a crisis
  // screen, "I feel safer") starts onboarding instead. Crisis screens are never gated.
  if (session.screen === "home" && !prefs.onboarded) dispatch({ type:"SET_SCREEN", screen:"ob-about" });
  const s = session.screen;
  const def = (SCREENS[s] || SCREENS.home)();
  const changed = s !== lastRendered;
  const crisis = CRISIS_SCREENS.includes(s);
  document.documentElement.classList.toggle("crisis-mode", crisis);
  const showY = session.yellow && !NO_YBAR.includes(s);
  app.innerHTML = `
    <header class="top">${topBar(def)}${showY ? yellowBar() : ""}</header>
    <main class="screen${changed && !crisis ? " enter" : ""}">
      <div class="content">${def.body}</div>
      ${def.actions ? `<div class="actions">${def.actions}</div>` : ""}
    </main>
    ${def.nav ? tabBar() : ""}
    ${session.devPanelOpen ? devPanel() : ""}`;
  fitChrome();
  if (changed){
    window.scrollTo(0, 0);
    const h = document.getElementById("screen-title");
    if (h) h.focus({ preventScroll:true });
    lastRendered = s;
    clearInterval(palmsTimer); palmsTimer = null;
    clearInterval(cravingTimer); cravingTimer = null;
    if (focusRaf){ cancelAnimationFrame(focusRaf); focusRaf = null; }
    clearTimeout(memTimer); memTimer = null;
    zagsStopBreathing();
    if (s !== "zags") zagsHush();
    if (s === "zags" && ui.zags && ui.zags.phase === "breathe") zagsStartBreathing();
    if (s !== "g-pattern"){ clearTimeout(patTimer); patTimer = null; }
    if (s === "craving-delay") cravingTimer = setInterval(cravingTick, 1000);
    if (s === "g-memory" && ui.memPhase === "show") memTimer = setTimeout(memHide, MEMORY_SHOW_MS);
    if (s === "g-pattern" && !ui.patDone && !ui.patPlaying) playPattern();
    if (s === "focus"){ if (!ui.focusStart) ui.focusStart = performance.now(); focusRaf = requestAnimationFrame(focusLoop); }
    if (s === "anx-palms"){

  }
}

document.addEventListener("click", e => {
  const link = e.target.closest("a[href]");
  if (link && !link.hasAttribute("data-kind") && /^(tel:|sms:|https:\/\/988lifeline)/.test(link.getAttribute("href"))) logActivity("reach");
  if (session.screen === "zags" && ui.zagsVoice) zagsHush();   // Zags's voice stops the moment the person taps anything
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  // NO-branch Call/Text: let the phone link open, and set the safety question
  // as the current screen in the same handler so it is waiting on return.
  if (el.hasAttribute("data-noexit")){
    dispatch({ type:"SET_SCREEN", screen:"safety-check" });
    setTimeout(render, 400);
    return;
  }
  if (el.tagName === "A") return;
  e.preventDefault();
  const fn = ACTIONS[act];
  if (fn) fn(el.getAttribute("data-arg"), el, e);
});

/* Thought Parking drag (handle only; tap buttons remain the accessible path) */
let drag = null;
document.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-drag]");
  if (!h || session.screen !== "spiral-sort") return;
  const card = h.closest(".tcard");
  if (!card) return;
  e.preventDefault();
  try { h.setPointerCapture(e.pointerId); } catch(_){}
  drag = { idx:Number(h.getAttribute("data-drag")), card, x0:e.clientX, y0:e.clientY, sy0:window.scrollY, zone:null };
  card.classList.add("dragging");
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0 + (window.scrollY - drag.sy0);
  drag.card.style.transform = `translate(${e.clientX - drag.x0}px, ${dy}px)`;
  drag.card.style.pointerEvents = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const zone = under && under.closest("[data-zone]");
  document.querySelectorAll(".zone.over").forEach(z => { if (z !== zone) z.classList.remove("over"); });
  if (zone) zone.classList.add("over");
  drag.zone = zone ? zone.getAttribute("data-zone") : null;
  if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 12);
  else if (e.clientY < 120) window.scrollBy(0, -12);
});
function endDrag(){
  if (!drag) return;
  const d = drag; drag = null;
  d.card.classList.remove("dragging");
  d.card.style.transform = ""; d.card.style.pointerEvents = "";
  document.querySelectorAll(".zone.over").forEach(z => z.classList.remove("over"));
  const t = ui.thoughts[d.idx];
  if (d.zone && t && t.place !== d.zone){
    t.place = d.zone;
    ui.landed = d.idx;
    render();
    ui.landed = null;
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

loadStore();
if (savedTheme && savedTheme !== "auto"){ ui.theme = savedTheme; document.documentElement.dataset.theme = savedTheme; }
document.documentElement.classList.toggle("reduce", !!prefs.reduce);
render();

// Offline support: sw.js keeps this page on the device so crisis screens open with no connection.
try {
  if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
} catch (_){}
</script>

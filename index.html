<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ZigZag Mind">
<title>ZigZag Mind — Get through what's happening right now</title>
<style>
:root{
  --bg:#F6F4EF;--surface:#FFFFFF;--text:#1E2329;--text-muted:#5E6670;
  --primary:#2F6F6A;--on-primary:#FFFFFF;--primary-soft:#E3EFEC;
  --accent:#6C63C7;--accent-soft:#ECEAFB;
  --safety:#B5562E;--on-safety:#FFFFFF;--safety-soft:#F7E6DD;
  --line:#E3DFD6;--focus:#6C63C7;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151A;--surface:#1B2027;--text:#ECEAE4;--text-muted:#A3A9B1;
    --primary:#7BC4BB;--on-primary:#12151A;--primary-soft:#1F3634;
    --accent:#A59EF0;--accent-soft:#25233D;
    --safety:#F09A6E;--on-safety:#12151A;--safety-soft:#3A2219;
    --line:#2A313A;--focus:#A59EF0;--zag-dark:#BFE6E0;--zag-eye:#12151A;--zag-cheek:#E59A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151A;--surface:#1B2027;--text:#ECEAE4;--text-muted:#A3A9B1;
  --primary:#7BC4BB;--on-primary:#12151A;--primary-soft:#1F3634;
  --accent:#A59EF0;--accent-soft:#25233D;
  --safety:#F09A6E;--on-safety:#12151A;--safety-soft:#3A2219;
  --line:#2A313A;--focus:#A59EF0;--zag-dark:#BFE6E0;--zag-eye:#12151A;--zag-cheek:#E59A80;
  color-scheme:dark;
}
:root.crisis-mode{--bg:var(--safety-soft)}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;min-height:68px}
.icon-btn{width:48px;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-size:24px;line-height:1;display:grid;place-items:center}
.spacer{width:48px;height:48px}
.help-pill{min-height:48px;padding:0 16px 0 12px;border-radius:24px;border:1.5px solid var(--safety);background:var(--safety-soft);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.help-pill svg{width:20px;height:20px;flex:none}

.ybar{margin:0 20px 8px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--safety)}
.ybar p{margin:0 0 8px;font-weight:600;font-size:15px}
.ybar .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0 10px;text-align:center}
.chip.safety{background:var(--safety);color:var(--on-safety);border-color:var(--safety)}

main.screen{flex:1;display:flex;flex-direction:column;padding:4px 20px 0}
main.screen.enter{animation:enter .25s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.content{flex:1;padding-bottom:16px}
.actions{position:sticky;bottom:0;padding:20px 0 16px;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 20px);display:flex;flex-direction:column;gap:10px}

h1{font-size:28px;line-height:1.2;font-weight:650;letter-spacing:-.01em;margin:8px 0 8px}
h2{font-size:20px;line-height:1.25;font-weight:650;margin:28px 0 10px}
p{margin:0 0 12px}
.sub{color:var(--text-muted);font-size:15px}
.small{font-size:15px;color:var(--text-muted)}
.step-big{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:12vh 0 14px}
.step-big.tight{margin-top:24px}
.step-count{font-size:13px;color:var(--text-muted);margin-top:8px}

.hero{padding:20px 0 8px}
.brand{background:none;border:none;padding:0;color:var(--primary);
  font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  font-size:38px;font-weight:600;letter-spacing:-.01em;line-height:1;min-height:48px}
.hero .sub{margin:6px 0 0;font-size:17px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{min-height:108px;border-radius:20px;background:var(--surface);border:1px solid var(--line);
  padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-weight:600;font-size:17px;line-height:1.25}
.card .em{font-size:28px;line-height:1}
.card.wide{grid-column:1 / -1;min-height:76px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.card.safety{background:var(--safety-soft);border:1.5px solid var(--safety)}
.card .meta{display:block;font-weight:400;font-size:15px;color:var(--text-muted);margin-top:2px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.list .card{min-height:68px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}

.btn{min-height:56px;border-radius:16px;font-weight:600;font-size:17px;border:none;width:100%;padding:0 20px;
  display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn-safety{background:var(--safety);color:var(--on-safety)}
.btn-outline{background:var(--surface);color:var(--text);border:1.5px solid var(--safety)}
.btn:disabled{opacity:.45;cursor:default}
.btn .cap{display:block;font-weight:400;font-size:13px;opacity:.9}
.btn.two-line{flex-direction:column;gap:0;padding:8px 20px}
.link{background:none;border:none;color:var(--text-muted);text-decoration:underline;font-size:15px;min-height:48px;padding:0 8px;align-self:center}
.stack{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.rating{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.rate{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:17px}
.rate[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-top:8px}

.field{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;padding:12px 14px;margin-top:10px}
textarea.field{min-height:150px;resize:vertical}
.notice{border-radius:14px;padding:12px 14px;background:var(--primary-soft);font-size:15px;margin-top:12px}

.dots{display:flex;flex-wrap:wrap;gap:14px;margin:28px 0 8px}
.dot{width:60px;height:60px;border-radius:50%;border:2px solid var(--accent);background:transparent;transition:background .2s ease,transform .2s ease}
.dot[aria-pressed="true"]{background:var(--accent);transform:scale(.94)}
.count{font-size:72px;font-weight:600;color:var(--primary);text-align:center;margin:28px 0 0;font-variant-numeric:tabular-nums}

.tcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;transition:opacity .3s ease,transform .3s ease}
.tcard .t{font-weight:600;word-break:break-word}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.seg button{min-height:48px;font-size:13px;line-height:1.2;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;padding:4px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.parked{margin-top:16px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line);color:var(--text-muted);font-size:15px}
.choice{display:block;width:100%;text-align:left;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;margin-top:8px;font-weight:600}
.choice[aria-pressed="true"]{border:2px solid var(--primary);background:var(--primary-soft)}
.nextcard{background:var(--primary-soft);border-radius:20px;padding:28px 22px;margin-top:20px}
.nextcard .lbl{font-size:15px;color:var(--text-muted);margin-bottom:8px}
.nextcard .big{font-size:28px;line-height:1.25;font-weight:600}
.nextcard .for{font-size:15px;color:var(--text-muted);margin-top:12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.panel h3{margin:0 0 6px;font-size:17px}
.panel ul{margin:6px 0 0;padding-left:20px}
.note{font-size:15px;color:var(--text-muted);margin-top:16px}
.safety-row{display:grid;gap:8px;margin-top:20px;padding:14px;border-radius:16px;border:1.5px solid var(--safety);background:var(--surface);font-size:15px}
.safety-row a{font-weight:600}
.disclaimer{font-size:13px;color:var(--text-muted);text-align:center;margin:16px 0 0}

.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);z-index:5}
.tab{min-height:58px;background:none;border:none;font-size:13px;font-weight:600;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab[aria-current="page"]{color:var(--primary)}
.tab .bar{width:20px;height:3px;border-radius:2px;background:transparent}
.tab[aria-current="page"] .bar{background:var(--primary)}

.seg-theme{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.seg-theme button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg-theme button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

.dev{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:406px;margin:0 auto;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2);max-height:60%;overflow:auto}
.dev dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 10px}
.dev dt{color:var(--text-muted)}
.dev dd{margin:0;font-weight:600;word-break:break-word}
.dev .hd{display:flex;justify-content:space-between;align-items:center}
.dev .hd button{min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px;font-size:13px;font-weight:600}

/* Stage 3: craving timer */
.ring-wrap{position:relative;width:220px;height:220px;margin:16px auto 4px}
.ring{width:220px;height:220px;display:block}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--primary);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label .tm{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.ring-label .lb{font-size:15px;color:var(--text-muted);margin-top:6px}
.todo{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;margin-top:8px;text-align:left;font-weight:600;text-decoration:none}
.todo .ck{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--primary);display:grid;place-items:center;font-size:15px;color:var(--on-primary)}
.todo[aria-pressed="true"] .ck{background:var(--primary)}
.todo[aria-pressed="true"] .tx{color:var(--text-muted);text-decoration:line-through}
.wave{margin-top:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;padding-bottom:14px}
.wave svg{display:block;width:100%;height:90px}
.wave .mv{animation:waveMove 7s ease-in-out infinite alternate}
.wave path{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2}
@keyframes waveMove{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.wave ol{margin:6px 0 0;padding:0 18px 0 38px}
.wave li{margin-top:6px}
/* Stage 3: focus game */
.focus-area{position:relative;height:230px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-top:20px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.focus-area .track{position:absolute;left:28px;right:28px;top:50%;height:2px;background:var(--line)}
.target{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;border:3px solid var(--accent)}
.target.hit{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 0 0 var(--accent-soft)}50%{transform:scale(1.12);box-shadow:0 0 0 14px var(--accent-soft)}100%{transform:scale(1);box-shadow:0 0 0 0 transparent}}
.orb{position:absolute;top:50%;left:0;width:42px;height:42px;margin-top:-21px;border-radius:50%;background:var(--primary);will-change:transform}
.focus-meta{display:flex;justify-content:space-between;margin-top:12px;font-size:15px;color:var(--text-muted);min-height:22px}
/* Stage 3: thought parking drag */
.tc-top{display:flex;gap:12px;align-items:center}
.handle{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--text-muted);touch-action:none;cursor:grab;font-size:22px;background:var(--bg);border:1px solid var(--line)}
.tcard.dragging{position:relative;z-index:30;box-shadow:0 14px 34px rgba(0,0,0,.22);transition:none;opacity:.96}
.zone{border-radius:20px;padding:14px;margin-top:14px;border:2px solid transparent;min-height:84px;transition:border-color .15s ease,background .15s ease}
.zone.now{background:var(--primary-soft)}
.zone.later{background:var(--surface);border-color:var(--line)}
.zone.park{border:2px dashed var(--line)}
.zone.over{border-color:var(--primary)!important;border-style:solid!important}
.zone h3{margin:0;font-size:17px}
.zone .zh{font-size:13px;color:var(--text-muted);margin:2px 0 0}
.zone .tcard{margin-top:10px}
.tchip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 6px 6px 12px;margin-top:8px;border-radius:12px;background:var(--bg);font-size:15px;color:var(--text-muted);animation:park .4s ease-out}
.tchip button{min-height:40px;border:none;background:none;text-decoration:underline;color:var(--text-muted);font-size:13px;padding:0 8px}
@keyframes park{from{transform:scale(1.06);opacity:.4}to{transform:scale(1);opacity:1}}
.landed{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(1.04)}100%{transform:scale(1)}}

/* Stage 4 */
:root.reduce *,:root.reduce *::before,:root.reduce *::after{animation:none!important;transition:none!important}
.plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.edit-btn{min-height:44px;min-width:64px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;padding:0 12px;flex:none}
.empty{color:var(--text-muted);font-size:15px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hchip{min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:600;font-size:15px}
.hchip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.hchip .x{margin-left:6px;opacity:.8}
.fieldset{border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;margin-top:14px;background:var(--surface)}
.fieldset legend{font-weight:600;font-size:15px;padding:0 6px}
.fieldset label{display:block;font-size:13px;color:var(--text-muted);margin-top:10px}
.fieldset .field{margin-top:4px}
.err{color:var(--safety);font-weight:600;font-size:15px;margin-top:12px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:none}
.stat .n{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--primary);min-width:2ch;text-align:right}
.big-change{font-size:34px;font-weight:650;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.about-hero{padding:28px 0 8px}
.about-hero .brand{font-size:44px;line-height:1.05}
.about-hero .tag{font-size:24px;line-height:1.25;font-weight:600;margin:14px 0 8px}
.crisis-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;background:var(--safety-soft);border:1.5px solid var(--safety);margin-top:16px;font-size:15px;font-weight:600}
.crisis-bar a{white-space:nowrap}
.how{counter-reset:how;list-style:none;padding:0;margin:8px 0 0}
.how li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.how li::before{counter-increment:how;content:counter(how);width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:650;display:grid;place-items:center}
.how b{display:block}
.flash{border-radius:14px;padding:12px 14px;background:var(--primary-soft);font-size:15px;font-weight:600;margin-top:12px}

/* Stage 6.1: Home */
.home-hero{padding:4px 0 0}
.home-hero .brand{font-size:34px}
h1.home-tag{font-size:16px;font-weight:400;line-height:1.35;letter-spacing:0;color:var(--text-muted);margin:4px 0 0}
.btn-big{min-height:72px;font-size:19px;border-radius:20px;margin-top:10px}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.route{min-height:80px;border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:10px 14px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;font-weight:600;font-size:17px;line-height:1.25;text-align:left}
.ico{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary);flex:none}
.ico svg{width:22px;height:22px}
.ico.alt{background:var(--accent-soft);color:var(--accent)}
.route .ico{width:34px;height:34px;border-radius:10px}
.route .ico svg{width:20px;height:20px}
.ico.safety{background:var(--surface);color:var(--safety)}
.lbl{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:14px 0 8px}
.sits{display:flex;flex-wrap:wrap;gap:8px}
.home-safe{width:100%;margin-top:12px;min-height:68px}
.home-safe + .btn-big{margin-top:12px}
/* Large text (200% makes a 390px phone ~195px wide): keep "I don't feel safe" compact so it fits on the first screen. */
@media (max-width:320px){.home-safe{padding:10px 12px;gap:10px;min-height:0}.home-safe .ico{width:30px;height:30px;border-radius:9px}.home-safe .ico svg{width:18px;height:18px}.home-safe .meta{font-size:13px}}
.list .card.dk-opt{min-height:88px}
.dk-help{text-align:center;margin-top:20px}
.dk-help .link{display:inline;min-height:48px;padding:12px 4px;font-weight:600;color:var(--text)}
.sit{min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:600;font-size:15px}

/* Stage 6.4: games. No scores anywhere. Color only changes; reduced motion stops the transitions. */
.dot.blue{border-color:#3F6FC4}.dot.blue[aria-pressed="true"]{background:#3F6FC4}
.dot.red{border-color:#C2553F}.dot.red[aria-pressed="true"]{background:#C2553F}
span.dot.on{background:var(--accent)}

/* ---------- SAFETY PHRASE LISTS (edit here; clinician-reviewable) ---------- */
const RED_PHRASES = [
  "kill myself","killing myself","want to die","wanna die","wish i was dead","wish i were dead",
  "end my life","end it all","suicide","suicidal","overdose","overdosed","hurt myself","hurting myself",

  "can't go on","don't want to live","don't want to be alive","don't want to be here anymore"
];
const YELLOW_PHRASES = [
  "hopeless","can't take it","can't take this","give up","giving up","nobody cares","no one cares",
  "worthless","trapped","can't do this anymore"
];

function normalizeText(t){
  return " " + String(t || "").toLowerCase()
    .replace(/[\u2018\u2019']/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim() + " ";
}
const RED_N = RED_PHRASES.map(normalizeText);
const YELLOW_N = YELLOW_PHRASES.map(normalizeText);

function safetyCheck(text){
  const n = normalizeText(text);
  if (RED_N.some(p => n.includes(p))) return "RED";
  if (YELLOW_N.some(p => n.includes(p))) return "YELLOW";
  return "GREEN";
}

  const region = ((navigator.language || "").split("-")[1] || "").toUpperCase();

function promoteYellow(s){
  if (s.safetyLevel === "GREEN") return { ...s, safetyLevel:"YELLOW", yellow:true };
  return { ...s, yellow:true };

function reducer(s, a){
  switch (a.type){
    case "SET_SCREEN": return { ...s, screen:a.screen };
    case "SET_SAFETY_LEVEL":
      if (a.level === "GREEN") return s;                       // never back to GREEN in a session
      if (a.level === "YELLOW") return { ...s, safetyLevel:"YELLOW", yellow:true };
      if (a.level === "RED") return { ...s, safetyLevel:"RED" };
      return s;
    case "SET_CURRENT_STATE": return { ...s, currentState:a.state };
    case "COUNT_ELSE": return { ...s, elseTaps:s.elseTaps + 1 };
    case "COUNT_UNHELPED": return { ...s, unhelpedCount:s.unhelpedCount + 1 };
    case "HUMAN_FIRST_SHOWN": return { ...s, humanFirstShown:true };
    case "SET_CURRENT_INTERVENTION": return { ...s, currentInterventionId:a.id };
    case "SET_CURRENT_INTENSITY": return { ...s, currentIntensity:a.value };
    case "SET_BEFORE_RATING": return { ...s, currentBeforeRating:a.value, currentIntensity:a.value };
    case "INCREMENT_STILL_BAD": {
      const n = { ...s, stillBadCount:s.stillBadCount + 1 };
      return n.stillBadCount >= 2 ? promoteYellow(n) : n;
    }
    case "INCREMENT_HIGH_RATING": {
      const n = { ...s, highRatingCount:s.highRatingCount + 1 };
      return n.highRatingCount >= 2 ? promoteYellow(n) : n;
    }
    case "ADD_OUTCOME": return { ...s, sessionHistory:[ ...s.sessionHistory, a.outcome ] };
    case "ADD_PICK": return { ...s, interventionPicks:[ ...s.interventionPicks, a.id ] };
    case "INCREMENT_INTERVENTION_COUNT": return { ...s, interventionCount:s.interventionCount + 1 };
    case "SET_ENGINE_RESULT": return { ...s, lastEnginePick:a.pick, lastEngineReason:a.reason };
    case "RESET_CURRENT_FLOW": return { ...s, currentFlowStep:0, currentBeforeRating:null, currentIntensity:null, currentInterventionId:null };
    case "TOGGLE_DEV_PANEL": return { ...s, devPanelOpen:!s.devPanelOpen };
    case "EXIT_CRISIS": return { ...s, safetyLevel:"YELLOW", yellow:true, screen:"home" };
    case "DELETE_DATA": return { ...s, sessionHistory:[], interventionPicks:[], interventionCount:0,
      lastEnginePick:null, lastEngineReason:"", currentState:null, currentInterventionId:null,
      currentBeforeRating:null, currentIntensity:null };   // safety level is never reset
    default: return s;
  }
}

/* ---------- INTERVENTION ENGINE ---------- */
function interventionEngine({ state, intensity, history = [], yellow = false, playbook = {}, picks = [], interventionCount = 0, exclude = [] }){
  // Rule 1: filter by state
  let pool = INTERVENTION_LIBRARY.filter(i => i.states.includes(state));
  // Rule 2: filter by intensity range
  if (typeof intensity === "number") pool = pool.filter(i => intensity >= i.intensityRange[0] && intensity <= i.intensityRange[1]);
  // Rule 5: never the same as the last pick (unless nothing else is eligible)
  const last = picks.length ? picks[picks.length - 1] : null;
  let eligible = pool.filter(i => i.id !== last && !exclude.includes(i.id));
  if (!eligible.length) eligible = pool.filter(i => i.id !== last);
  if (!eligible.length) eligible = pool;
  if (!eligible.length) return { interventionId:null, reason:"No eligible intervention found." };

  const helps = (playbook.helps || []).filter(h => findIntervention(h));
  const out = (i, reason, extra = {}) => ({ interventionId:i.id, reason, isPreviouslyHelpful:false,
    usedHistoricalData:false, historicalUses:0, averageDrop:null, ...extra });

  // Rule 3: YELLOW priority (exploration disabled)
  if (yellow){
    const order = [
      ["connection","Reaching out to someone can help when things feel heavy."],
      ...helps.map(h => [h, "This is on your list of things that help."]),
      ["grounding","A grounding step can help steady things."],
      ["environment_change","A change of space can help."]
    ];
    for (const [id, reason] of order){
      const f = eligible.find(i => i.id === id);
      if (f) return out(f, reason);
    }
    return out(eligible[0], "One small step to try.");
  }

  // Rule 6: every 4th start tries something untried this session
  if ((interventionCount + 1) % 4 === 0){
    const untried = eligible.find(i => !picks.includes(i.id));
    if (untried) return out(untried, "Something you haven't tried today.");
  }

  // Rule 4: rank by average drop (needs 2+ uses with numeric before/after)
  const stat = id => {
    const r = history.filter(h => h.interventionId === id && h.state === state &&
      typeof h.before === "number" && typeof h.after === "number");
    if (r.length < 2) return null;
    return { uses:r.length, avg:r.reduce((sum, h) => sum + (h.before - h.after), 0) / r.length };
  };
  const scored = eligible.map(i => ({ i, s:stat(i.id) }))
    .filter(x => x.s && x.s.avg > 0)
    .sort((a, b) => (b.s.avg - a.s.avg) || (helps.includes(b.i.id) - helps.includes(a.i.id)));
  if (scored.length){
    const { i, s } = scored[0];
    // Rule 7: phrase as an offer, never a promise
    return out(i, `${i.name} helped you before.`, { isPreviouslyHelpful:true, usedHistoricalData:true,
      historicalUses:s.uses, averageDrop:Math.round(s.avg * 10) / 10 });
  }
  const pb = eligible.find(i => helps.includes(i.id));
  if (pb) return out(pb, "This is on your list of things that help.");
  return out(eligible[0], "One small step to try.");
}

function runEngine(){
  const r = interventionEngine({
    state:session.currentState,
    intensity:session.currentBeforeRating,
    history:[ ...store.sensitive.baseHistory, ...session.sessionHistory ],
    yellow:session.yellow,
    playbook:getPlan(),
    picks:session.interventionPicks,
    interventionCount:session.interventionCount,
    exclude:ui.exclude
  });
  ui.engine = r;
  dispatch({ type:"SET_ENGINE_RESULT", pick:r.interventionId, reason:r.reason });
  return r;
}

function resetGame(id){

  ui.gamePart = 0; ui.gameDots = []; ui.gameFound = {};
  if (id === "distraction_color_hunt") ui.gameDots = Array(COLOR_HUNT[0].n).fill(false);

  if (st === "anxious") startIntervention("grounding", { route:"anx-feet" });
  else if (st === "spiraling") startIntervention("thought_parking");
  else if (st === "low") go("low-choose");
  else if (st === "craving") startIntervention("craving_delay");
  else if (st === "distraction") go("distract");
  else go("home");

function startIntervention(interventionId, opts = {}){
  if (blockIfRed()) return false;
  const it = findIntervention(interventionId);
  if (!it) return false;
  dispatch({ type:"ADD_PICK", id:interventionId });
  dispatch({ type:"INCREMENT_INTERVENTION_COUNT" });
  dispatch({ type:"SET_CURRENT_INTERVENTION", id:interventionId });
  ui.step = 0;
  let route = opts.route;
  if (GAME_ROUTES[interventionId]){ resetGame(interventionId); if (!route) route = GAME_ROUTES[interventionId]; }
  if (interventionId === "change_scene" && !route) route = "scene";
  if (interventionId === "zags"){ route = "zags"; if (!ui.zags || ui.zags.phase !== "hello") ui.zags = { phase:"hello", step:0, rounds:0, hard:0, breath:0, half:null }; }
  if (!route) route = interventionId === "thought_parking" ? "spiral-input"
    : interventionId === "craving_delay" ? "craving-delay"
    : interventionId === "still_true" ? "still-true" : "intervention";
  if (interventionId === "still_true"){ ui.trueIdx = 0; ui.trueCount = 0; }
  if (interventionId === "craving_delay"){
    ui.cravingStart = Date.now();
    ui.cravingEnd = Date.now() + CRAVING_MS;
    ui.cravingDone = {}; ui.waveOpen = false;
  }
  if (route === "focus"){ ui.focusStart = null; }
  if (route === "ground"){ startGround(); return true; }
  go(route);
  return true;
}

function completeCheckIn({ after, action, change }){
  if (blockIfRed()) return;
  const afterVal = action === "skip" ? null : (typeof after === "number" ? after : null);
  const outcome = { source:"session", state:session.currentState, interventionId:session.currentInterventionId,
    before:session.currentBeforeRating, after:afterVal, timestamp:Date.now() };
  if (change) outcome.change = change;   // games: "yes" | "a_little" | "no"
  if (outcome.interventionId === "change_scene" && ui.sceneOpt) outcome.option = ui.sceneOpt;
  const ended = session.currentInterventionId;
  dispatch({ type:"ADD_OUTCOME", outcome });
  if (typeof afterVal === "number" && afterVal >= 9) recordHighRating();
  if (action === "still_bad" || change === "no") recordStillBad();   // a game's "No" counts like "I still feel bad"
  ui.justStillBad = action === "still_bad" || change === "no";
  ui.rating = null; ui.exclude = []; ui.checkinNote = ""; ui.suggestIdx = 0; ui.checkinVariant = null;
  if (change === "no" && ended) ui.exclude = [ended];   // didn't change anything: offer something else
  // the next step starts from where this one ended (null if skipped — never invented)
  dispatch({ type:"SET_BEFORE_RATING", value:afterVal });
  if (action !== "helped") dispatch({ type:"COUNT_UNHELPED" });
  runEngine();
  toRecommendation();
}

function somethingElse(){
  if (blockIfRed()) return;
  const prev = ui.engine && ui.engine.interventionId;
  if (prev && !ui.exclude.includes(prev)) ui.exclude.push(prev);
  let r = runEngine();
  if (!r.interventionId || r.interventionId === prev){
    ui.exclude = prev ? [prev] : [];
    r = runEngine();
  }
  ui.suggestIdx++;
  dispatch({ type:"COUNT_ELSE" });
  if (humanFirstDue()){ dispatch({ type:"HUMAN_FIRST_SHOWN" }); go("human-first"); return; }
  render();
}

const person = () => getPlan().trustedPeople[0] || null;
/* The code word and who it goes to, or null. Matched by phone so editing the list never sends it to the wrong person. */
function codeWord(){
  const cw = getPlan().codeWord, people = getPlan().trustedPeople || [];
  if (!cw || !cw.word) return null;
  const digits = x => String(x || "").replace(/\D/g, "");
  const p = people.find(x => digits(x.phone) && digits(x.phone) === cw.phone);
  return p ? { word:cw.word, person:p } : null;
}
/* "Send my code word to [name]": opens Messages with the word only. noexit: crisis-no rule (safety check first). */
function codeWordButton(noexit, cls = "btn btn-outline"){
  const cw = codeWord();
  if (!cw) return "";
  const attr = noexit ? `data-act="noContact" data-noexit="1"` : "";
  return `<a class="${cls} codeword" href="${smsLink(cw.person.phone, cw.word)}" ${attr}>Send my code word to ${esc(cw.person.name)}</a>`;
}

function ratingRow(selected, legendLow, legendHigh){

    <div class="legend"><span>0 · ${legendLow}</span><span>10 · ${legendHigh}</span></div>`;
}

          <span class="handle" data-drag="${idx}" aria-hidden="true">⠿</span>
          <div class="t">${esc(t.text)}</div>
        </div>
        <div class="seg" role="group" aria-label="Where does this go?">
          ${places.map(([k, l]) => `<button data-act="spPlace" data-arg="${idx}:${k}" aria-pressed="${t.place === k}">${l}</button>`).join("")}
        </div>
      </div>`;
    const list = place => ui.thoughts.map((t, idx) => ({ t, idx })).filter(x => x.t.place === place);
    const unsorted = list(null);
    const parked = list("notmine");
    return { close:true, body:`
      ${title("Where does each one go?")}
      <p class="sub">Drag a card by its handle into a box, or tap a button on the card.</p>
      ${unsorted.map(x => card(x.t, x.idx)).join("")}
      ${!unsorted.length ? `<p class="notice">Everything is sorted.</p>` : ""}
      <section class="zone now" data-zone="now" aria-label="Now">
        <h3>Now</h3><p class="zh">I can act on this.</p>
        ${list("now").map(x => card(x.t, x.idx)).join("")}
      </section>
      <section class="zone later" data-zone="later" aria-label="Later">
        <h3>Later</h3><p class="zh">Matters, just not today.</p>
        ${list("later").map(x => card(x.t, x.idx)).join("")}
      </section>
      <section class="zone park" data-zone="notmine" aria-label="Not in my control">
        <h3>Not in my control</h3><p class="zh">${parked.length ? `Parked: ${parked.length} ${parked.length === 1 ? "thing" : "things"} that aren't yours to fix right now.` : "Drop things here that you can't change right now."}</p>
        ${parked.map(x => `<div class="tchip"><span>${esc(x.t.text)}</span><button data-act="spPlace" data-arg="${x.idx}:notmine" aria-label="Unpark ${esc(x.t.text)}">Unpark</button></div>`).join("")}
      </section>`,
      actions:`<button class="btn btn-primary" data-act="spSortNext" ${allPlaced ? "" : "disabled"}>${allPlaced ? "Next" : "Sort each thought to continue"}</button>` };
  },

  "spiral-step"(){
    const now = ui.thoughts.filter(t => t.place === "now");
    if (!now.length){
      return { close:true, body:`${title("Nothing here needs doing right now.")}<p class="sub">You can let these wait.</p>`,
        actions:`<button class="btn btn-primary" data-act="spNone">Continue</button>` };
    }
    const pick = now[Math.min(ui.nowIdx, now.length - 1)];
    const chooser = now.length > 1 ? `<p class="small" style="margin-top:12px">Pick one to start with:</p>` +
      now.map((t, i) => `<button class="choice" data-act="spNowSel" data-arg="${i}" aria-pressed="${i === ui.nowIdx}">${esc(t.text)}</button>`).join("")
      : `<div class="tcard"><div class="t">${esc(pick.text)}</div></div>`;
    return { close:true, body:`
      ${title("What's the smallest step?")}
      ${chooser}
      <div class="stack" style="margin-top:16px">
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Put it on my calendar">Put it on my calendar</button>
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Text one person">Text one person</button>
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Write one sentence">Write one sentence</button>
      </div>
      <label class="small" for="ownstep" style="display:block;margin-top:16px">Or in your own words</label>
      <input class="field" id="ownstep" autocomplete="off" maxlength="120">
      ${ui.msg ? `<p class="notice" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="spOwn">Use my words</button>` };
  },

  "spiral-next"(){
    return { close:true, body:`
      ${title("Here's your one next step.")}
      <div class="nextcard">
        <div class="lbl">One next step</div>
        <div class="big">${esc(ui.nextStep)}</div>
        ${ui.nextFor ? `<div class="for">For: ${esc(ui.nextFor)}</div>` : ""}
      </div>
      <p class="note">Everything else can wait.</p>`,
      actions:`<button class="btn btn-primary" data-act="spNextDone">Continue</button>` };
  },

  "craving-delay"(){
    const left = (ui.cravingEnd || Date.now()) - Date.now();
    const done = left <= 0;
    const total = Math.max(CRAVING_MS, (ui.cravingEnd || 0) - (ui.cravingStart || 0));
    const frac = done ? 1 : 1 - left / total;
    const C = 2 * Math.PI * 100;
    const todo = CRAVING_STEPS.map(([k, t]) => `<button class="todo" data-act="crvStep" data-arg="${k}" aria-pressed="${!!(ui.cravingDone || {})[k]}">
        <span class="ck" aria-hidden="true">${(ui.cravingDone || {})[k] ? "✓" : ""}</span><span class="tx">${t}</span></button>`).join("");
    const p = person();
    return { close:true, body:`
      ${title(done ? "You gave it the time." : "Let's wait 15 minutes together.")}
      <p class="sub">The urge can rise and fall. You don't have to act on it.</p>
      <div class="ring-wrap" role="timer" aria-label="Time left">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="bg" cx="110" cy="110" r="100"/>
          <circle class="fg" id="crvRing" cx="110" cy="110" r="100" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/>
        </svg>
        <div class="ring-label"><span class="tm" id="crvTime">${done ? "Done" : fmtTime(left)}</span><span class="lb">${done ? "time's up" : "left"}</span></div>
      </div>
      <h2>While you wait</h2>
      <p class="small">Any of these, in any order. Skip what doesn't fit.</p>
      ${todo}
      <button class="todo" data-act="crvFocus"><span class="ck" aria-hidden="true"></span><span class="tx">Play the 1-minute Focus game</span></button>
      ${p ? `<a class="todo" href="${smsLink(p.phone, "Can you talk for a few minutes?")}"><span class="ck" aria-hidden="true"></span><span class="tx">Text ${esc(p.name)}</span></a>` : ""}
      <button class="btn btn-secondary" style="margin-top:16px" data-act="crvWave" aria-expanded="${!!ui.waveOpen}">${ui.waveOpen ? "Hide the wave" : "Ride the wave"}</button>
      ${ui.waveOpen ? `<div class="wave">
        <svg viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true"><g class="mv"><path d="M0 60 Q 50 20 100 60 T 200 60 T 300 60 T 400 60 T 500 60 T 600 60 T 700 60 T 800 60 V 90 H 0 Z"/></g></svg>
        <ol><li>Where do you feel it in your body?</li><li>Breathe into that spot.</li><li>Watch it rise and fall.</li></ol>
      </div>` : ""}
      <div class="safety-row" role="note">
        <a href="${LINKS.call911}">Already used, or took too much? Call 911.</a>
        <span>Shaking, sweating, confused, or seeing things? Withdrawal can be a medical emergency. Get medical help.</span>
        <a href="${LINKS.call988}">Call or text 988 for support.</a>
      </div>
      <div style="display:flex;justify-content:center;margin-top:8px"><button class="link" data-act="crvUsed">I already used</button></div>`,
      actions: done ? `<button class="btn btn-primary" data-act="crvCheck">Check in</button>`
        : `<button class="btn btn-secondary" data-act="crvCheck">Check in early</button>` };
  },

  "craving-used"(){
    return { close:true, body:`
      ${title("Thanks for telling me.")}
      <p class="sub">No judgment here. What matters is the next few minutes.</p>
      <div class="safety-row" role="note">
        <a href="${LINKS.call911}">Took too much, or feel unwell? Call 911.</a>
        <span>Shaking, sweating, confused, or seeing things? Withdrawal can be a medical emergency. Get medical help.</span>
        <a href="${LINKS.call988}">Call or text 988 for support.</a>
      </div>
      <h2>Want to do one small thing for the next 10 minutes?</h2>`,
      actions:`<button class="btn btn-primary" data-act="usedYes">Yes</button>
        <button class="btn btn-secondary" data-act="usedNo">Not right now</button>` };
  },

  focus(){
    const sixty = session.currentInterventionId === "distraction_60_second";
    return { close:true, body:`
      ${title(sixty ? "For the next 60 seconds, your only job is to beat the timer." : "Tap when the dot is inside the ring.")}
      <p class="sub">${sixty ? "Tap when the dot is inside the ring. No score." : "No score. Just follow it."}</p>
      <div class="focus-area" id="focusArea" tabindex="0" role="button" aria-label="Tap when the dot is inside the ring">
        <div class="track"></div><div class="target" id="focusTarget"></div><div class="orb" id="focusOrb"></div>
      </div>
      <div class="focus-meta"><span id="focusMsg" aria-live="polite"></span><span id="focusTime">1:00</span></div>`,
      actions:`<button class="btn btn-primary" data-act="focusDone">Done</button>` };
  },

  /* 6.7: Zags. One screen; the phase decides what he says. */
  zags(){
    const z = ui.zags || { phase:"hello", step:0, rounds:0, hard:0 };
    const line = zagsLine(z);
    const voice = ("speechSynthesis" in window)
      ? `<button class="chip zvoice" data-act="zagsVoice" aria-pressed="${!!ui.zagsVoice}">${ui.zagsVoice ? "Voice on" : "Voice off"}</button>` : "";
    const p = person();
    const people = `${p ? `<div class="pair">
        <a class="btn btn-secondary" href="${smsLink(p.phone)}">Text ${esc(p.name)}</a>
        <a class="btn btn-secondary" href="${telLink(p.phone)}">Call ${esc(p.name)}</a></div>` : ""}
      <a class="btn btn-secondary" href="${WARMLINE.tel}">Call the Warm Line</a>
      ${p ? "" : `<button class="btn btn-secondary" data-act="route" data-arg="connect">Find someone to talk to</button>`}`;
    let sub = "", actions = "";
    switch (z.phase){
      case "hello":
        actions = `<button class="btn btn-primary" data-act="zagsBreathe">Okay, Zags</button>
          <button class="link" data-act="zagsBye">Not right now</button>`; break;
      case "breathe":
        sub = z.half ? `Breath ${z.breath + 1} of ${zagsBreaths()}` : "";
        actions = `<button class="btn btn-secondary" data-act="zagsSkip">Skip breathing</button>`; break;
      case "steps":
        actions = `<button class="btn btn-primary" data-act="zagsNext">${z.step === ZAGS_STEPS.length - 1 ? "Okay" : "Done"}</button>`; break;
      case "check":
        actions = `<button class="btn btn-primary" data-act="zagsFeel" data-arg="better">A bit better</button>
          <button class="btn btn-secondary" data-act="zagsFeel" data-arg="hard">Still hard</button>
          <button class="btn btn-secondary" data-act="zagsFeel" data-arg="worse">Worse</button>`; break;
      case "better":
        sub = `${WARMLINE.name}: ${WARMLINE.hours}`;
        actions = `${people}<button class="btn btn-secondary" data-act="zagsBye">I'm okay for now</button>`; break;
      case "again":
        actions = `<button class="btn btn-primary" data-act="zagsBreathe">One more round</button>${people}
          <button class="link" data-act="zagsBye">Not right now</button>`; break;
      case "hard":
        sub = `${WARMLINE.name}: ${WARMLINE.hours}`;
        actions = `${people}${row988()}`; break;
      default:   // bye: still ends at a person
        actions = `<button class="btn btn-primary" data-act="route" data-arg="connect">Reach someone</button>
          <button class="btn btn-secondary" data-act="home">Done</button>`;
    }
    const calm = z.phase === "breathe" && z.half === "out";
    return { close:true, body:`
      <div class="zstage${z.phase === "breathe" ? "" : " idle"}">
        ${voice}
        ${zagsSvg(z.half, calm)}
        <p id="screen-title" tabindex="-1" class="bubble">${line}</p>
        <p class="zsub" id="zagsSub" aria-live="polite">${sub}</p>
      </div>`,
      actions:`${actions}<p class="note znote">${ZAGS_NOTE}</p>` };
  },

  /* 6.8: Code word setup. choose_person → choose_word → compose_sms → confirm. */
  "cw-person"(){
    const people = getPlan().trustedPeople || [];
    return { close:false, body:`
      <p class="lbl">Set up with your people · Code word</p>
      ${title("Who should get your code word?")}
      <p class="sub">Pick someone who'd want to know when things are hard.</p>
      ${people.length ? `<div class="list">${people.map((p, i) =>
        `<button class="card" data-act="cwPerson" data-arg="${i}">${icon("people")}<span>${esc(p.name)}${p.relationship ? `<span class="meta">${esc(p.relationship)}</span>` : ""}</span></button>`).join("")}</div>`
        : `<p class="note">Add someone you trust first. Then come back here.</p>
          <button class="btn btn-secondary" data-act="planEdit" data-arg="trustedPeople">Add someone</button>`}`,
      actions:`<button class="btn btn-secondary" data-act="cwCancel">Back to My Plan</button>` };
  },
  "cw-word"(){
    const p = (getPlan().trustedPeople || [])[ui.cwPerson];
    if (!p) return SCREENS["cw-person"]();
    const opts = ui.cwOptions || [];
    const own = ui.cwOwn;
    const word = own ? (ui.cwOwnText || "") : ui.cwWord;
    return { close:false, body:`
      <p class="lbl">Set up with your people · Code word</p>
      ${title(`Pick a word for ${esc(p.name)}.`)}
      <p class="sub">On a hard day, you'll send just this word. ${esc(p.name)} will know what it means. No explaining.</p>
      <div class="sits cw-words">${opts.map(w => `<button class="sit" data-act="cwWord" data-arg="${esc(w)}" aria-pressed="${!own && ui.cwWord === w}">${esc(w)}</button>`).join("")}
        <button class="sit" data-act="cwOwn" aria-pressed="${!!own}">My own word</button></div>
      <button class="link" data-act="cwShuffle">Show other words</button>
      ${own ? `<label for="cwOwnBox" class="small" style="display:block;margin-top:10px">Your word</label>
        <input class="field" id="cwOwnBox" maxlength="30" autocomplete="off" value="${esc(ui.cwOwnText || "")}">` : ""}
      ${ui.msg ? `<p class="err" role="alert">${esc(ui.msg)}</p>` : ""}
      ${word && !own ? `<p class="lbl" style="margin-top:16px">Your message to ${esc(p.name)}</p><p class="msg-preview">${esc(codeWordSetupMsg(p.name, word))}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="cwNext">Next</button>
        <button class="btn btn-secondary" data-act="cwCancel">Back to My Plan</button>` };
  },
  "cw-send"(){
    const p = (getPlan().trustedPeople || [])[ui.cwPerson];
    if (!p || !ui.cwFinal) return SCREENS["cw-person"]();
    const text = codeWordSetupMsg(p.name, ui.cwFinal);
    return { close:false, body:`
      <p class="lbl">Set up with your people · Code word</p>
      ${title(`Your message to ${esc(p.name)}`)}
      <p class="msg-preview">${esc(text)}</p>
      <a class="btn btn-primary cw-open" href="${smsLink(p.phone, text)}">Open Messages</a>
      <p class="note">ZigZag Mind never sends anything for you. You tap Send.</p>
      <h2>Did you send it?</h2>`,
      actions:`<button class="btn btn-primary" data-act="cwSaved">Yes, I sent it</button>
        <button class="btn btn-secondary" data-act="cwCancel">Not yet</button>` };
  },

  /* 6.6: Connect (I just feel alone). Zags (6.7) and the code word (6.8) join this screen when they're built. */
  connect(){
    const people = getPlan().trustedPeople || [];
    const first = people[0];
    return { close:true, body:`
      ${title("You don't have to sit with this alone.")}
      <div class="panel conn">
        <p class="lbl">Talk to someone who's been there</p>
        <h3>${WARMLINE.name}</h3>
        <p class="small">${WARMLINE.hours} ${WARMLINE.about}</p>
        <a class="btn btn-primary" href="${WARMLINE.tel}">Call the Warm Line</a>
        <a class="conn-more" href="${WARMLINE.elsewhereUrl}" target="_blank" rel="noopener">${WARMLINE.elsewhere}</a>
      </div>
      <div class="panel conn" id="connPeople">
        <p class="lbl">Reach one of your people</p>
        ${people.length ? people.map(p => `<h3>${esc(p.name)}${p.relationship ? ` <span class="small">· ${esc(p.relationship)}</span>` : ""}</h3>
          <div class="pair">
            <a class="btn btn-secondary" href="${smsLink(p.phone)}" aria-label="Text ${esc(p.name)}">Text</a>
            <a class="btn btn-secondary" href="${telLink(p.phone)}" aria-label="Call ${esc(p.name)}">Call</a>
          </div>`).join("") + `
          ${codeWordButton(false)}
          <p class="small" style="margin:14px 0 8px">Don't know what to say${people.length > 1 ? ` to ${esc(first.name)}` : ""}? Tap one:</p>
          <div class="sits">${MESSAGE_IDEAS.map(m => `<a class="sit idea" href="${smsLink(first.phone, m)}">${esc(m)}</a>`).join("")}</div>`
        : `<p class="small">Add someone you trust, and they'll be here with Text and Call.</p>
          <button class="btn btn-secondary" data-act="planFromConnect">Add someone to My Plan</button>`}
      </div>
      <button class="card wide zcard" data-act="zags" data-arg="connect" style="margin-top:14px">${zagsFace()}<span>Stay with Zags for a few minutes<span class="meta">Until someone calls back</span></span></button>
      <p class="lbl">If it gets heavier</p>
      ${row988()}` };
  },

  "human-first"(){
    const p = person();
    const call = p ? `<a class="btn btn-primary" href="${telLink(p.phone)}">Call someone</a>` : `<button class="btn btn-primary" data-act="route" data-arg="connect">Call someone</button>`;
    const text = p ? `<a class="btn btn-secondary" href="${smsLink(p.phone)}">Text someone</a>` : `<button class="btn btn-secondary" data-act="route" data-arg="connect">Text someone</button>`;
    return { close:true, body:`
      ${title("Would talking to a person help more than another answer?")}
      ${p ? `<p class="sub">${esc(p.name)} is in your plan.</p>` : ""}`,
      actions:`${call}${text}
        <button class="btn btn-secondary" data-act="hfPeople">Be around people</button>
        <button class="link" data-act="hfNotNow">Not right now</button>` };
  },

  /* 6.5: Change the scene. */
  scene(){
    return { close:true, body:`
      ${title("Change the scene.")}
      <p class="sub">Sometimes your brain needs a different place, not another question. Pick one.</p>
      <div class="list">${CHANGE_SCENE.map(([k, t]) =>
        `<button class="card scene-opt" data-act="scenePick" data-arg="${k}">${icon("door")}<span>${t}</span></button>`).join("")}
      </div>
      <h2 id="placesHead" tabindex="-1">Somewhere to go</h2>
      <p class="sub">Opens your phone's Maps. ZigZag Mind never sees your location.</p>
      <div class="sits places">${SCENE_PLACES.map(([label, q]) =>
        `<a class="sit" href="${mapsLink(q)}" target="_blank" rel="noopener">${label}</a>`).join("")}
      </div>
      <div class="panel scene-211">
        <h3>Need real-world help near you?</h3>
        <p class="small" style="margin:0 0 10px">211 connects you to local help: food, housing, support groups. Free.</p>
        <a class="btn btn-secondary" href="${LINKS.call211}">Call 211</a>
      </div>` };
  },

  "scene-step"(){
    const o = CHANGE_SCENE.find(x => x[0] === ui.sceneOpt) || CHANGE_SCENE[0];
    return { close:true, body:`
      <p class="step-count">Change the scene</p>
      ${stepTitle(o[2])}
      <p class="sub">Tap Done when you've done it, or whenever you're ready.</p>`,
      actions:`<button class="btn btn-primary" data-act="sceneDone">Done</button>` };
  },

  /* 6.4: Get out of my head. ("Thoughts stuck on repeat? Break the loop" waits for 6.14.) */
  distract(){
    return { close:true, body:`
      ${title("Get out of my head.")}
      <p class="sub">Quick games to interrupt the loop. 1 to 5 minutes. No points, no levels.</p>
      <div class="list">${GAMES.map(([arg, , t, m]) =>
        `<button class="card" data-act="game" data-arg="${arg}">${icon("head", true)}<span>${t}<span class="meta">${m}</span></span></button>`).join("")}
        <button class="card" data-act="distFocus">${icon("head", true)}<span>Focus<span class="meta">Tap when the dot reaches the ring. One minute.</span></span></button>
        <button class="card zcard" data-act="zags" data-arg="head">${zagsFace()}<span>Calm down with Zags<span class="meta">Breathe together for a few minutes</span></span></button>
      </div>` };
  },

  "g-color"(){
    const part = COLOR_HUNT[ui.gamePart || 0] || COLOR_HUNT[0];
    const dots = (ui.gameDots && ui.gameDots.length ? ui.gameDots : Array(part.n).fill(false)).map((on, i) =>
      `<button class="dot ${part.color}" data-act="gDot" data-arg="${i}" aria-pressed="${on}" aria-label="${part.color[0].toUpperCase() + part.color.slice(1)} thing ${i + 1}"></button>`).join("");
    const last = (ui.gamePart || 0) === COLOR_HUNT.length - 1;
    return { close:true, body:`
      <p class="step-count">Color hunt · Part ${(ui.gamePart || 0) + 1} of ${COLOR_HUNT.length}</p>
      ${stepTitle(part.text, true)}
      <p class="sub">Tap a circle for each one. No need to type.</p>
      <div class="dots">${dots}</div>
      ${part.then ? `<p class="sub">${part.then}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="gNext">${last ? "Done" : "Next"}</button>` };
  },

  "g-around"(){
    const found = ui.gameFound || {};
    return { close:true, body:`
      <p class="step-count">Around me</p>
      ${stepTitle("Look around you. Find each one.", true)}
      <p class="sub">Tap each one when you find it. Skip any you like.</p>
      ${AROUND_ME.map((t, i) => `<button class="todo" data-act="gFound" data-arg="${i}" aria-pressed="${!!found[i]}">
        <span class="ck" aria-hidden="true">${found[i] ? "✓" : ""}</span><span class="tx">${t}</span></button>`).join("")}`,
      actions:`<button class="btn btn-primary" data-act="gDone">Done</button>` };
  },

  "g-cats"(){
    const i = Math.min(ui.gamePart || 0, CATEGORIES.length - 1);
    const n = Math.min((ui.gameDots || []).length, CATEGORY_N);
    const last = i === CATEGORIES.length - 1;
    return { close:true, body:`
      <p class="step-count">Rapid categories · Part ${i + 1} of ${CATEGORIES.length}</p>
      ${stepTitle(CATEGORIES[i][1], true)}
      <p class="sub">Out loud or in your head. Tap the button for each one.</p>
      <div class="dots" aria-hidden="true">${Array.from({ length:CATEGORY_N }, (_, k) => `<span class="dot${k < n ? " on" : ""}"></span>`).join("")}</div>
      <button class="btn btn-secondary" data-act="gTally">I named one</button>`,
      actions:`<button class="btn btn-primary" data-act="gNext">${last ? "Done" : "Next"}</button>` };
  },

  "g-memory"(){
    const round = MEMORY_ROUNDS[ui.memRound || 0];
    const phase = ui.memPhase || "show";
    const shape = (k, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${MEMORY_SHAPES[k]}</svg>${extra}`;
    if (phase === "show"){
      return { close:true, body:`
        <p class="step-count">Memory snap</p>
        ${stepTitle("Look at these 6 shapes.", true)}
        <p class="sub">They'll hide in a few seconds.</p>
        <ul class="shapes" aria-label="Shapes to remember">${round.show.map(k => `<li class="shape" role="img" aria-label="${k}">${shape(k)}</li>`).join("")}</ul>` };
    }
    const picked = ui.memPicked || {};
    if (phase === "pick"){
      return { close:true, body:`
        <p class="step-count">Memory snap</p>
        ${stepTitle("Tap the ones you remember.", true)}
        <p class="sub">Guessing is fine.</p>
        <div class="shapes">${round.all.map(k => `<button class="shape" data-act="memPick" data-arg="${k}" aria-pressed="${!!picked[k]}" aria-label="${k}">${shape(k)}</button>`).join("")}</div>`,
        actions:`<button class="btn btn-primary" data-act="memReveal">Show me</button>` };
    }
    return { close:true, body:`
      <p class="step-count">Memory snap</p>
      ${stepTitle("Here's what was there.", true)}
      <p class="sub">The ones that were there are outlined. Shaded ones are the ones you tapped.</p>
      <ul class="shapes">${round.all.map(k => { const was = round.show.includes(k);
        return `<li class="shape${was ? " was" : ""}${picked[k] ? " picked" : ""}" role="img" aria-label="${k}${was ? ", was there" : ""}${picked[k] ? ", you tapped it" : ""}">${shape(k)}</li>`; }).join("")}</ul>`,
      actions:`<button class="btn btn-primary" data-act="gDone">Done</button>` };
  },

  "g-pattern"(){
    const done = !!ui.patDone;
    return { close:true, body:`
      <p class="step-count">Pattern break</p>
      ${stepTitle(done ? "That's the pattern." : "Watch the pads light up, then tap them back.", true)}
      <p class="sub">${done ? "Take a breath." : "Missed one? It just plays again."}</p>
      <div class="pads">${PATTERN_PADS.map((p, i) => `<button class="pad p${i}" id="pad${i}" data-act="padTap" data-arg="${i}" aria-label="Pad, ${p}"></button>`).join("")}</div>
      <p class="pat-msg" id="patMsg" aria-live="polite">${done ? "" : (ui.patPlaying ? "Watch." : "")}</p>`,
      actions: done ? `<button class="btn btn-primary" data-act="gDone">Done</button>`
        : `<button class="btn btn-secondary" data-act="padReplay">Show it again</button>
           <button class="link" data-act="gDone">I'm done</button>` };
  },

  /* End of every 6.4 game. Feeds the outcome history and the engine like the usual check-in. */
  "game-check"(){
    return { close:true, body:`
      ${title("Did the intensity change?")}
      <p class="sub">You can skip this.</p>`,
      actions:`<button class="btn btn-primary" data-act="gameChange" data-arg="yes">Yes</button>
        <button class="btn btn-secondary" data-act="gameChange" data-arg="a_little">A little</button>
        <button class="btn btn-secondary" data-act="gameChange" data-arg="no">No</button>
        <button class="link" data-act="ciSkip">Skip</button>` };
  },

  talk(){
    const msg = session.yellow ? HARD_TIME_MSG : "hey";
    return { close:false, body:`
      ${title("Talk to someone")}
      <p class="sub">ZigZag Mind never contacts anyone for you. These buttons open your phone.</p>
      ${codeWord() ? `<div style="margin-top:14px">${codeWordButton(false)}</div>` : ""}
      ${person() ? `<h2>${esc(person().name)} <span class="small">(${esc(person().relationship)})</span></h2>${personButtons(msg, false)}` : `<p class="note">Add someone you trust in My Plan.</p>`}
      <h2>988 Suicide &amp; Crisis Lifeline</h2>
      <p class="small">Free, 24/7. Also for substance-use crises.</p>
      ${row988()}
      <a class="btn btn-secondary" style="margin-top:10px" href="${LINKS.chat988}" target="_blank" rel="noopener">Chat online with 988</a>`,
      actions:`<button class="btn btn-secondary" data-act="talkBack">Back</button>` };
  },

  crisis(){
    return { close:false, body:`
      ${title("I'm glad you told me.")}
      ${row988()}
      ${codeWord() ? `<div style="margin-top:10px">${codeWordButton(false)}</div>` : ""}
      <div class="panel">
        <h3 style="font-size:20px;line-height:1.3">Are you in danger of hurting yourself or someone else right now?</h3>
        <div class="stack" style="margin-top:14px">
          <button class="btn btn-secondary" data-act="cYes">Yes</button>
          <button class="btn btn-secondary" data-act="cNo">No</button>
          <button class="btn btn-secondary" data-act="cNotSure">I'm not sure</button>
        </div>
      </div>
      <p class="disclaimer">ZigZag Mind is not an emergency service.</p>
      <div style="display:flex;justify-content:center"><button class="link" data-act="cBack">That's not what I meant — go back</button></div>` };
  },

  "crisis-full"(){
    const p = person();
    return { close:false, body:`
      ${title("Please reach a person right now.")}
      <div class="stack" style="margin-top:12px">
        <a class="btn btn-safety two-line" href="${LINKS.call911}">Call 911<span class="cap">If someone is hurt, or someone else is in danger</span></a>
        ${row988().replace('style="margin-top:12px"', "")}
        <a class="btn btn-secondary" href="${LINKS.chat988}" target="_blank" rel="noopener">Chat online with 988</a>
        ${codeWordButton(false)}
        ${p ? personButtons(HARD_TIME_MSG, false) : `<p class="note">Add someone you trust in My Plan.</p>`}
        <button class="btn btn-secondary" data-act="cPlaces" aria-expanded="${ui.placesOpen}">Go where other people are</button>
        ${ui.placesOpen ? `<div class="panel" style="margin-top:0"><ul>${getPlan().places.length ? getPlan().places.map(x => `<li>${esc(x)}</li>`).join("") : "<li>A shop, a library, a friend's place — anywhere with people.</li>"}</ul></div>` : ""}
        <button class="btn btn-secondary" data-act="cPlan">Open my plan</button>
      </div>
      <p class="note">If you can, put distance between yourself and anything you could use to hurt yourself.</p>
      <p class="disclaimer">ZigZag Mind is not an emergency service.</p>
      <div style="display:flex;justify-content:center"><button class="link" data-act="cBack">That's not what I meant — go back</button></div>` };
  },

  "crisis-no"(){
    return { close:false, body:`
      ${title("Okay. Thank you for checking in with yourself.")}
      ${row988()}
      ${codeWord() ? `<div style="margin-top:10px">${codeWordButton(true)}</div>` : ""}
      <h2>What would help right now?</h2>
      <div class="stack">
        <button class="btn btn-secondary" data-act="noTalk" aria-expanded="${ui.talkOpen}">Talk to someone</button>
        ${ui.talkOpen ? `<div class="panel" style="margin-top:0">${personButtons(HARD_TIME_MSG, true)}
          <p class="note" style="margin-bottom:0">ZigZag Mind never contacts anyone for you. These buttons open your phone.</p></div>` : ""}
        <button class="btn btn-secondary" data-act="noPlan">Open my plan</button>
        <button class="btn btn-secondary" data-act="noGround">Do something grounding</button>
      </div>
      <p class="disclaimer">ZigZag Mind is not an emergency service.</p>` };
  },

  "safety-check"(){
    return { close:false, body:`
      ${title("Do you feel safer than a few minutes ago?")}
      ${row988()}
      <div class="stack" style="margin-top:20px">
        <button class="btn btn-secondary" data-act="safeYes">Yes</button>
        <button class="btn btn-secondary" data-act="safeNo">No</button>
        <button class="btn btn-secondary" data-act="safeNotSure">Not sure</button>
      </div>
      <p class="disclaimer">ZigZag Mind is not an emergency service.</p>` };
  },

  plan(){
    const pb = getPlan();
    const editable = ui.planFrom === "tab";
    const ul = arr => arr.length ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="empty">Nothing here yet.</p>`;
    const head = (key, t) => `<div class="plan-head"><h3>${t}</h3>${editable ? `<button class="edit-btn" data-act="planEdit" data-arg="${key}" aria-label="Edit: ${t}">Edit</button>` : ""}</div>`;
    const people = pb.trustedPeople.length ? pb.trustedPeople.map(p => `
        <p style="margin:12px 0 8px"><strong>${esc(p.name)}</strong>${p.relationship ? ` · ${esc(p.relationship)}` : ""} · ${esc(p.phone)}</p>
        <div class="pair">
          <a class="btn btn-outline" href="${telLink(p.phone)}" aria-label="Call ${esc(p.name)}">Call</a>
          <a class="btn btn-outline" href="${smsLink(p.phone, HARD_TIME_MSG)}" aria-label="Text ${esc(p.name)}">Text</a>
        </div>
        ${editable ? `<button class="link share-guide" data-act="shareGuide" aria-label="Share the supporter guide with ${esc(p.name)}">Share the supporter guide</button>` : ""}`).join("") : `<p class="empty">Nobody added yet.</p>`;
    const pro = pb.professional && pb.professional.name ? `<p style="margin:14px 0 8px"><strong>${esc(pb.professional.name)}</strong>${pb.professional.phone ? ` · ${esc(pb.professional.phone)}` : ""}</p>
        ${pb.professional.phone ? `<a class="btn btn-secondary" href="${telLink(pb.professional.phone)}">Call ${esc(pb.professional.name)}</a>` : ""}` : "";
    return { nav:editable, close:false, body:`
      ${title("My plan for hard moments")}
      <p class="sub">${editable ? "Build it on a good day, so it's ready on a hard one. Each part saves on its own." : "Your plan, for right now."}</p>
      ${ui.flash && editable ? `<p class="flash" role="status">${esc(ui.flash)}</p>` : ""}
      <div class="panel">${head("warningSigns", "How I know a hard moment is starting")}${ul(pb.warningSigns)}</div>
      <div class="panel">${head("helps", "Things that help me on my own")}${ul(pb.helps.map(helpLabel))}</div>
      <div class="panel">${head("places", "People and places that take my mind off things")}${ul(pb.places)}</div>
      <div class="panel">${head("trustedPeople", "My trusted people")}
        <p class="note" style="margin-top:6px">ZigZag Mind will never contact these people for you. These buttons only open your phone's call or text app.</p>
        ${people}</div>
      <div class="panel">${head("professional", "Professional and crisis support")}
        <p class="small" style="margin-top:6px">988 Suicide &amp; Crisis Lifeline, free and 24/7. Always in your plan.</p>${row988()}${pro}
        ${editable ? `<p class="small strength-short" style="margin:14px 0 0">${HELP_IS_STRENGTH_SHORT} <button class="link inline" data-act="readStrength">Read more</button></p>` : ""}</div>
      ${editable ? `<div class="panel" id="setupPeople"><h3>Set up with your people</h3>
        <div class="setup-row"><span><b>Code word</b><span class="small">${codeWord() ? `${esc(codeWord().word)} · with ${esc(codeWord().person.name)}` : "One word that means: I'm struggling, call me."}</span></span>
          <button class="edit-btn" data-act="cwStart">${codeWord() ? "Change" : "Set up"}</button></div>
        ${codeWord() ? `<button class="link" data-act="cwRemove" style="margin-top:4px">Remove code word</button>` : ""}</div>` : ""}
      <div class="panel">${head("saferSpace", "Making my space safer")}
        ${pb.saferSpace ? `<p style="margin-top:6px">${esc(pb.saferSpace)}</p>` : `<p class="empty">Nothing here yet.</p>`}</div>
      <div class="panel">${head("avoid", "Things to avoid when I'm struggling")}${ul(pb.avoid)}</div>
      <div class="panel">${head("reminders", "What I want ZigZag Mind to remind me")}${ul(pb.reminders)}</div>`,
      actions: editable ? "" : `<button class="btn btn-primary" data-act="planDone">${ui.planFrom === "no" ? "I'm done" : "Back"}</button>` };
  },

  "plan-edit"(){
    const key = ui.editSection, pb = getPlan();
    const sec = PLAN_SECTIONS.find(x => x[0] === key);
    if (!sec) return SCREENS.plan();
    const [, t, kind, hint] = sec;
    let form = "";
    if (kind === "list"){
      form = `<label class="sub" for="edList">${esc(hint)}</label>
        <textarea class="field" id="edList">${esc(pb[key].join("\n"))}</textarea>`;
    } else if (kind === "text"){
      form = `<label class="sub" for="edText">${esc(hint)}</label>
        <textarea class="field" id="edText" style="min-height:110px">${esc(pb[key])}</textarea>`;
    } else if (kind === "helps"){
      const d = ui.draftHelps;
      const custom = d.filter(x => !HELP_CHIPS.some(c => c[0] === x));
      form = `<p class="sub">Tap everything that usually helps.</p>
        <div class="chips" role="group" aria-label="Things that help">
          ${HELP_CHIPS.map(([k, l]) => `<button class="hchip" data-act="helpToggle" data-arg="${esc(k)}" aria-pressed="${d.includes(k)}">${l}</button>`).join("")}
          ${custom.map(c => `<button class="hchip" data-act="helpToggle" data-arg="${esc(c)}" aria-pressed="true" aria-label="Remove ${esc(c)}">${esc(c)}<span class="x" aria-hidden="true">×</span></button>`).join("")}
        </div>
        <label class="small" for="edCustom" style="display:block;margin-top:16px">Add your own</label>
        <div style="display:flex;gap:8px;align-items:stretch">
          <input class="field" id="edCustom" maxlength="40" autocomplete="off" value="${esc(ui.customDraft || "")}" style="flex:1">
          <button class="edit-btn" data-act="helpAdd" style="margin-top:10px;min-height:52px">Add</button>
        </div>`;
    } else if (kind === "people"){
      const rows = [0,1,2].map(i => {
        const p = (ui.peopleDraft && ui.peopleDraft[i]) || pb.trustedPeople[i] || { name:"", phone:"", relationship:"" };
        return `<fieldset class="fieldset"><legend>${i === 0 ? "First person to reach" : `Person ${i + 1} (optional)`}</legend>
          <label for="pn${i}">Name</label><input class="field" id="pn${i}" maxlength="40" autocomplete="off" value="${esc(p.name)}">
          <label for="pp${i}">Phone</label><input class="field" id="pp${i}" type="tel" inputmode="tel" maxlength="20" autocomplete="off" value="${esc(p.phone)}">
          <label for="pr${i}">Relationship</label><input class="field" id="pr${i}" maxlength="30" autocomplete="off" value="${esc(p.relationship)}" placeholder="Friend, sister, coworker">
        </fieldset>`;
      }).join("");
      form = `<p class="sub">Up to 3, in the order you'd want to reach them. ZigZag Mind never contacts anyone for you.</p>${rows}`;
    } else if (kind === "pro"){
      form = `<p class="sub">988 is always in your plan. You can also add a therapist, doctor, or counselor.</p>
        <fieldset class="fieldset"><legend>Optional</legend>
          <label for="proN">Name</label><input class="field" id="proN" maxlength="40" autocomplete="off" value="${esc((ui.proDraft || pb.professional).name)}">
          <label for="proP">Phone</label><input class="field" id="proP" type="tel" inputmode="tel" maxlength="20" autocomplete="off" value="${esc((ui.proDraft || pb.professional).phone)}">
        </fieldset>`;
    }
    return { close:false, body:`
      ${title(esc(t))}
      ${form}
      ${ui.formErr ? `<p class="err" role="alert">${esc(ui.formErr)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="planSave">Save</button>
        <button class="btn btn-secondary" data-act="planCancel">Cancel</button>` };
  },

  progress(){
    const P = computeProgress();
    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    const quiet = !P.moments && !P.planUses && !P.reach && !P.actions;
    return { nav:true, close:false, body:`
      ${title("Progress")}
      <p class="sub">The last 7 days. What you did, never a score.</p>
      ${quiet ? `<div class="panel"><h3>Nothing logged this week — that's okay.</h3><p class="small" style="margin:6px 0 0">This fills in as you use ZigZag Mind.</p></div>` : `
      <div class="panel">
        <div class="stat"><span>Hard moments handled</span><span class="n">${P.moments}</span></div>
        <div class="stat"><span>Times you used your plan</span><span class="n">${P.planUses}</span></div>
        <div class="stat"><span>Times you reached out</span><span class="n">${P.reach}</span></div>
        <div class="stat"><span>Actions completed</span><span class="n">${P.actions}</span></div>
      </div>
      <div class="panel"><h3>Most helpful for you</h3>
        <p style="margin:6px 0 0">${P.best ? `${esc(P.best.name)} <span class="small">(across ${plural(P.best.uses, "check-in", "check-ins")})</span>` : `<span class="small">Shows once something has 2 or more rated check-ins.</span>`}</p></div>
      <div class="panel"><h3>Average change during a session</h3>
        ${P.rated >= 3 ? `<p class="big-change">${P.avgBefore} → ${P.avgAfter}</p><p class="small" style="margin:0">Across ${P.rated} check-ins where you rated before and after.</p>`
          : `<p class="small" style="margin:6px 0 0">Shows after 3 check-ins with a before and after rating.</p>`}</div>`}
      ${P.hasSample ? `<p class="note">Includes fictional sample data. You can remove it in Settings.</p>` : ""}` };
  },

  settings(){
    const t = ui.theme;
    const seg = (act, val, cur, label) => `<button data-act="${act}" data-arg="${val}" aria-pressed="${cur === val}">${label}</button>`;
    return { nav:true, close:false, body:`
      ${title("Settings")}
      ${ui.flash ? `<p class="flash" role="status">${esc(ui.flash)}</p>` : ""}
      <h2>Appearance</h2>
      <div class="seg-theme" role="group" aria-label="Appearance">
        ${seg("theme","auto",t,"Auto")}${seg("theme","light",t,"Light")}${seg("theme","dark",t,"Dark")}
      </div>
      <h2>Motion</h2>
      <div class="seg-theme" role="group" aria-label="Motion" style="grid-template-columns:1fr 1fr">
        ${seg("motion","auto",prefs.reduce ? "reduce" : "auto","Match my phone")}${seg("motion","reduce",prefs.reduce ? "reduce" : "auto","Reduce motion")}
      </div>
      <h2>Haptics</h2>
      <div class="seg-theme" role="group" aria-label="Haptics" style="grid-template-columns:1fr 1fr">
        ${seg("haptics","off",prefs.haptics ? "on" : "off","Off")}${seg("haptics","on",prefs.haptics ? "on" : "off","On")}
      </div>
      <p class="small" style="margin-top:8px">A light tap when you finish a step. Not every phone supports this.</p>
      <h2>Where you are</h2>
      <div class="seg-theme" role="group" aria-label="Where you are">
        ${seg("country","auto",prefs.country,"Auto")}${seg("country","us",prefs.country,"In the US")}${seg("country","other",prefs.country,"Outside the US")}
      </div>
      <p class="small" style="margin-top:8px">${prefs.country === "auto"
        ? `Auto uses your phone's time zone and language as a hint. Right now it ${likelyOutsideUS() ? "adds" : "doesn't add"} "Find a helpline in your country".`
        : prefs.country === "other" ? `Crisis screens add "Find a helpline in your country".` : "Crisis screens show US numbers."} 911 and 988 always stay on screen.</p>
      <h2>Your data</h2>
      ${STORAGE_OK ? `
      <p class="small" style="margin-bottom:8px">Save on this device</p>
      <div class="seg-theme" role="group" aria-label="Save on this device" style="grid-template-columns:1fr 1fr;margin-top:0">
        ${seg("persist","on",persistOn ? "on" : "off","On")}${seg("persist","off",persistOn ? "on" : "off","Off")}
      </div>
      <p class="small" style="margin-top:8px">${persistOn
        ? "Your plan and check-ins are saved only in this browser on this phone. Nothing is sent anywhere."
        : "Nothing is saved. Everything is gone when you close or reload. Useful on a shared phone."}</p>`
      : `<p class="small">This browser isn't letting ZigZag Mind save, so everything is gone when you reload. Nothing is sent anywhere.</p>`}
      <div class="stack" style="margin-top:12px">
        <button class="btn btn-secondary" data-act="exportData">Export my data</button>
        <button class="btn btn-secondary" data-act="loadSample">Load sample data</button>
        <button class="btn btn-outline" data-act="askDelete">Delete everything</button>
      </div>
      <h2>About</h2>
      <button class="btn btn-secondary" data-act="about">About ZigZag Mind</button>
      <p class="disclaimer" style="margin-bottom:16px">ZigZag Mind is a self-help support tool. It is not therapy, medical care, or an emergency service. If you're in danger, call 911 or call or text 988.</p>
      ${donateUrl() ? `<div class="donate-row"><a class="donate" href="${esc(donateUrl())}" target="_blank" rel="noopener">Support ZigZag Mind</a>
        <p class="small" style="margin:2px 0 0">Free for everyone, always. If it helped, you can help keep it running.</p></div>` : ""}` };
  },

  export(){
    const json = JSON.stringify(buildExport(), null, 2);
    return { close:false, body:`
      ${title("Your data")}
      <p class="sub">Copy this to keep a record. It doesn't go anywhere unless you paste it somewhere.</p>
      <textarea class="field" id="exportBox" aria-label="Your data, as text you can copy" readonly style="min-height:300px;font-size:13px;font-family:ui-monospace,Menlo,monospace">${esc(json)}</textarea>
      ${ui.flash ? `<p class="flash" role="status">${esc(ui.flash)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="copyExport">Copy</button>
        <button class="btn btn-secondary" data-act="toSettings">Back</button>` };
  },

  "confirm-delete"(){
    return { close:false, body:`
      ${title("Delete everything?")}
      <p>This removes your plan, your check-ins, and your history from this device. It can't be undone.</p>
      <p class="small">Crisis support stays available, and 988 stays in your plan.</p>`,
      actions:`<button class="btn btn-safety" data-act="deleteAll">Delete everything</button>
        <button class="btn btn-secondary" data-act="toSettings">Cancel</button>` };

  /* First launch only. Help stays in the top bar on every step, and 988 is on the first screen. */

    return { close:false, body:`
      ${title("Welcome to ZigZag Mind.")}
      <p class="sub">Help for hard moments, one small step at a time.</p>

      <div class="panel"><h3>What it is</h3><ul>

        <li>Not a person. It never contacts anyone for you.</li></ul></div>`,

  "ob-age"(){
    return { close:false, body:`
      ${title("Are you 18 or older?")}
      <p class="sub">ZigZag Mind is made for adults.</p>`,
      actions:`<button class="btn btn-primary" data-act="obAdult">Yes, I'm 18 or older</button>
        <button class="btn btn-secondary" data-act="obMinor">No, I'm under 18</button>
        <button class="btn btn-secondary" data-act="obBack">Back</button>` };
  },

  "ob-minor"(){
    return { close:false, body:`
      ${title("ZigZag Mind is made for adults.")}
      <p>You still deserve support that fits you. If things are hard right now, 988 is free, open 24/7, and there for people of any age.</p>
      ${row988()}
      <p style="margin-top:16px">You can also talk to an adult you trust: a parent, a teacher, a school counselor, or a doctor.</p>
      <p class="disclaimer">Call 911 if someone is hurt or in danger.</p>`,
      actions:`<button class="btn btn-secondary" data-act="obAgeBack">Back</button>` };

  "ob-plan"(){
    return { close:false, body:`
      ${title("Want to make your plan now?")}
      <p>Your plan holds what helps on a hard day: the early signs, things that help, people to reach, and what you want to remember.</p>
      <p class="sub">It's easiest to make on a good day. It takes a few minutes, and it's saved only on this phone.</p>
      <p class="small" style="margin-top:12px">You'll find it any time under My Plan.</p>`,
      actions:`<button class="btn btn-primary" data-act="obPlanNow">Make my plan now</button>
        <button class="btn btn-secondary" data-act="obLater">Later</button>` };
  },

  about(){

  "spiral-input"(){
    return { close:true, body:`
      ${title("Let's get it out of your head.")}
      <label class="sub" for="thoughts">What's running through your mind? One thought per line.</label>
      <textarea class="field" id="thoughts" placeholder="I might lose my job&#10;I forgot to call back"></textarea>
      ${ui.msg ? `<p class="notice" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="spMake">Make cards</button>
        <button class="link" data-act="spAlsoTrue">Or: one sentence and what's also true</button>` };
  },

  "spiral-sort"(){
    const places = [["now","Now"],["later","Later"],["notmine","Not in my control"]];
    const allPlaced = ui.thoughts.every(t => t.place);
    const card = (t, idx) => `
      <div class="tcard${ui.landed === idx ? " landed" : ""}" data-idx="${idx}">
        <div class="tc-top">
          <span class="handle" data-drag="${idx}" aria-hidden="true">⠿</span>
          <div class="t">${esc(t.text)}</div>
        </div>
        <div class="seg" role="group" aria-label="Where does this go?">
          ${places.map(([k, l]) => `<button data-act="spPlace" data-arg="${idx}:${k}" aria-pressed="${t.place === k}">${l}</button>`).join("")}
        </div>
      </div>`;
    const list = place => ui.thoughts.map((t, idx) => ({ t, idx })).filter(x => x.t.place === place);
    const unsorted = list(null);
    const parked = list("notmine");
    return { close:true, body:`
      ${title("Where does each one go?")}
      <p class="sub">Drag a card by its handle into a box, or tap a button on the card.</p>
      ${unsorted.map(x => card(x.t, x.idx)).join("")}
      ${!unsorted.length ? `<p class="notice">Everything is sorted.</p>` : ""}
      <section class="zone now" data-zone="now" aria-label="Now">
        <h3>Now</h3><p class="zh">I can act on this.</p>
        ${list("now").map(x => card(x.t, x.idx)).join("")}
      </section>
      <section class="zone later" data-zone="later" aria-label="Later">
        <h3>Later</h3><p class="zh">Matters, just not today.</p>
        ${list("later").map(x => card(x.t, x.idx)).join("")}
      </section>
      <section class="zone park" data-zone="notmine" aria-label="Not in my control">
        <h3>Not in my control</h3><p class="zh">${parked.length ? `Parked: ${parked.length} ${parked.length === 1 ? "thing" : "things"} that aren't yours to fix right now.` : "Drop things here that you can't change right now."}</p>
        ${parked.map(x => `<div class="tchip"><span>${esc(x.t.text)}</span><button data-act="spPlace" data-arg="${x.idx}:notmine" aria-label="Unpark ${esc(x.t.text)}">Unpark</button></div>`).join("")}
      </section>`,
      actions:`<button class="btn btn-primary" data-act="spSortNext" ${allPlaced ? "" : "disabled"}>${allPlaced ? "Next" : "Sort each thought to continue"}</button>` };
  },

  "spiral-step"(){
    const now = ui.thoughts.filter(t => t.place === "now");
    if (!now.length){
      return { close:true, body:`${title("Nothing here needs doing right now.")}<p class="sub">You can let these wait.</p>`,
        actions:`<button class="btn btn-primary" data-act="spNone">Continue</button>` };
    }
    const pick = now[Math.min(ui.nowIdx, now.length - 1)];
    const chooser = now.length > 1 ? `<p class="small" style="margin-top:12px">Pick one to start with:</p>` +
      now.map((t, i) => `<button class="choice" data-act="spNowSel" data-arg="${i}" aria-pressed="${i === ui.nowIdx}">${esc(t.text)}</button>`).join("")
      : `<div class="tcard"><div class="t">${esc(pick.text)}</div></div>`;
    return { close:true, body:`
      ${title("What's the smallest step?")}
      ${chooser}
      <div class="stack" style="margin-top:16px">
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Put it on my calendar">Put it on my calendar</button>
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Text one person">Text one person</button>
        <button class="btn btn-secondary" data-act="spTemplate" data-arg="Write one sentence">Write one sentence</button>
      </div>
      <label class="small" for="ownstep" style="display:block;margin-top:16px">Or in your own words</label>
      <input class="field" id="ownstep" autocomplete="off" maxlength="120">
      ${ui.msg ? `<p class="notice" role="alert">${esc(ui.msg)}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="spOwn">Use my words</button>` };
  },

  "spiral-next"(){
    return { close:true, body:`
      ${title("Here's your one next step.")}
      <div class="nextcard">
        <div class="lbl">One next step</div>
        <div class="big">${esc(ui.nextStep)}</div>
        ${ui.nextFor ? `<div class="for">For: ${esc(ui.nextFor)}</div>` : ""}
      </div>
      <p class="note">Everything else can wait.</p>`,
      actions:`<button class="btn btn-primary" data-act="spNextDone">Continue</button>` };
  },

  "craving-delay"(){
    const left = (ui.cravingEnd || Date.now()) - Date.now();
    const done = left <= 0;
    const total = Math.max(CRAVING_MS, (ui.cravingEnd || 0) - (ui.cravingStart || 0));
    const frac = done ? 1 : 1 - left / total;
    const C = 2 * Math.PI * 100;
    const todo = CRAVING_STEPS.map(([k, t]) => `<button class="todo" data-act="crvStep" data-arg="${k}" aria-pressed="${!!(ui.cravingDone || {})[k]}">
        <span class="ck" aria-hidden="true">${(ui.cravingDone || {})[k] ? "✓" : ""}</span><span class="tx">${t}</span></button>`).join("");
    const p = person();
    return { close:true, body:`
      ${title(done ? "You gave it the time." : "Let's wait 15 minutes together.")}
      <p class="sub">The urge can rise and fall. You don't have to act on it.</p>
      <div class="ring-wrap" role="timer" aria-label="Time left">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="bg" cx="110" cy="110" r="100"/>
          <circle class="fg" id="crvRing" cx="110" cy="110" r="100" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/>
        </svg>
        <div class="ring-label"><span class="tm" id="crvTime">${done ? "Done" : fmtTime(left)}</span><span class="lb">${done ? "time's up" : "left"}</span></div>
      </div>
      <h2>While you wait</h2>
      <p class="small">Any of these, in any order. Skip what doesn't fit.</p>
      ${todo}
      <button class="todo" data-act="crvFocus"><span class="ck" aria-hidden="true"></span><span class="tx">Play the 1-minute Focus game</span></button>
      ${p ? (canPhone() ? `<a class="todo" href="${smsLink(p.phone, "Can you talk for a few minutes?")}"><span class="ck" aria-hidden="true"></span><span class="tx">Text ${esc(p.name)}</span></a>`
        : textOrCopy({ phone:p.phone, body:"Can you talk for a few minutes?", label:`Text ${esc(p.name)}`, cls:"btn btn-secondary" })) : ""}
      <button class="btn btn-secondary" style="margin-top:16px" data-act="crvWave" aria-expanded="${!!ui.waveOpen}">${ui.waveOpen ? "Hide the wave" : "Ride the wave"}</button>
      ${ui.waveOpen ? `<div class="wave">
        <svg viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true"><g class="mv"><path d="M0 60 Q 50 20 100 60 T 200 60 T 300 60 T 400 60 T 500 60 T 600 60 T 700 60 T 800 60 V 90 H 0 Z"/></g></svg>
        <ol><li>Where do you feel it in your body?</li><li>Breathe into that spot.</li><li>Watch it rise and fall.</li></ol>
      </div>` : ""}
      <div class="safety-row" role="note">
        <a href="${LINKS.call911}">Already used, or took too much? Call 911.</a>
        <span>Shaking, sweating, confused, or seeing things? Withdrawal can be a medical emergency. Get medical help.</span>
        <span>For support: <a href="${LINKS.call988}">Call 988</a> · ${text988Inline()}</span>
      </div>
      <div style="display:flex;justify-content:center;margin-top:8px"><button class="link" data-act="crvBorrow">Or borrow ten minutes instead</button></div>
      <div style="display:flex;justify-content:center"><button class="link" data-act="crvUsed">I already used</button></div>`,
      actions: done ? `<button class="btn btn-primary" data-act="crvCheck">Check in</button>`
        : `<button class="btn btn-secondary" data-act="crvCheck">Check in early</button>` };
  },

  "craving-used"(){
    return { close:true, body:`
      ${title("Thanks for telling me.")}
      <p class="sub">No judgment here. What matters is the next few minutes.</p>
      <div class="safety-row" role="note">
        <a href="${LINKS.call911}">Took too much, or feel unwell? Call 911.</a>
        <span>Shaking, sweating, confused, or seeing things? Withdrawal can be a medical emergency. Get medical help.</span>
        <span>For support: <a href="${LINKS.call988}">Call 988</a> · ${text988Inline()}</span>
      </div>
      <h2>Want to do one small thing for the next 10 minutes?</h2>`,
      actions:`<button class="btn btn-primary" data-act="usedYes">Yes</button>
        <button class="btn btn-secondary" data-act="usedNo">Not right now</button>` };
  },

  focus(){
    const sixty = session.currentInterventionId === "distraction_60_second";
    return { close:true, body:`
      ${title(sixty ? "For the next 60 seconds, your only job is to beat the timer." : "Tap when the dot is inside the ring.")}
      <p class="sub">${sixty ? "Tap when the dot is inside the ring. No score." : "No score. Just follow it."}</p>
      <div class="focus-area" id="focusArea" tabindex="0" role="button" aria-label="Tap when the dot is inside the ring">
        <div class="track"></div><div class="target" id="focusTarget"></div><div class="orb" id="focusOrb"></div>
      </div>
      <div class="focus-meta"><span id="focusMsg" aria-live="polite"></span><span id="focusTime">1:00</span></div>`,
      actions:`<button class="btn btn-primary" data-act="focusDone">Done</button>` };
  },

  /* 6.7: Zags. One screen; the phase decides what he says. */
  zags(){
    const z = ui.zags || { phase:"hello", step:0, rounds:0, hard:0 };
    const line = zagsLine(z);
    const voice = ("speechSynthesis" in window)
      ? `<button class="chip zvoice" data-act="zagsVoice" aria-pressed="${!!ui.zagsVoice}">${ui.zagsVoice ? "Voice on" : "Voice off"}</button>` : "";
    const p = person();
    const people = `${p ? pairOrStack(textOrCopy({ phone:p.phone, label:`Text ${esc(p.name)}`, cls:"btn btn-secondary" }),
        `<a class="btn btn-secondary" href="${telLink(p.phone)}">${callText(`Call ${esc(p.name)}`, p.phone)}</a>`) : ""}
      <a class="btn btn-secondary" href="${WARMLINE.tel}">${callText("Call the Warm Line", WARMLINE.number)}</a>
      ${p ? "" : `<button class="btn btn-secondary" data-act="route" data-arg="connect">Find someone to talk to</button>`}`;
    let sub = "", actions = "";
    switch (z.phase){
      case "hello":
        actions = `<button class="btn btn-primary" data-act="zagsBreathe">Okay, Zags</button>
          <button class="link" data-act="zagsBye">Not right now</button>`; break;
      case "breathe":
        sub = z.half ? `Breath ${z.breath + 1} of ${zagsBreaths()}` : "";
        actions = `<button class="btn btn-secondary" data-act="zagsSkip">Skip breathing</button>`; break;
      case "steps":
        actions = `<button class="btn btn-primary" data-act="zagsNext">${z.step === ZAGS_STEPS.length - 1 ? "Okay" : "Done"}</button>`; break;
      case "check":
        actions = `<button class="btn btn-primary" data-act="zagsFeel" data-arg="better">A bit better</button>
          <button class="btn btn-secondary" data-act="zagsFeel" data-arg="hard">Still hard</button>
          <button class="btn btn-secondary" data-act="zagsFeel" data-arg="worse">Worse</button>`; break;
      case "better":
        sub = `${WARMLINE.name}: ${WARMLINE.hours}`;
        actions = `${people}<button class="btn btn-secondary" data-act="zagsBye">I'm okay for now</button>`; break;
      case "again":
        actions = `<button class="btn btn-primary" data-act="zagsBreathe">One more round</button>${people}
          <button class="link" data-act="zagsBye">Not right now</button>`; break;
      case "hard":
        sub = `${WARMLINE.name}: ${WARMLINE.hours}`;
        actions = `${people}${row988()}`; break;
      default:   // bye: still ends at a person
        actions = `<button class="btn btn-primary" data-act="route" data-arg="connect">Reach someone</button>
          ${ui.griefZags && ui.grief && ui.grief.who ? `<button class="btn btn-secondary" data-act="griefBack">Back to "${GRIEF.help}"</button>` : ""}
          <button class="btn btn-secondary" data-act="home">Done</button>`;
    }
    const calm = z.phase === "breathe" && z.half === "out";
    return { close:true, body:`
      <div class="zstage${z.phase === "breathe" ? "" : " idle"}">
        ${voice}
        ${zagsSvg(z.half, calm)}
        <p id="screen-title" tabindex="-1" class="bubble">${line}</p>
        <p class="zsub" id="zagsSub" aria-live="polite">${sub}</p>
      </div>`,
      actions:`${actions}<p class="note znote">${ZAGS_NOTE}</p>` };
  },

  /* 6.8: Code word setup. choose_person → choose_word → compose_sms → confirm. */
  "cw-person"(){
    const people = getPlan().trustedPeople || [];
    return { close:false, body:`
      <p class="lbl">Set up with your people · Code word</p>
      ${title("Who should get your code word?")}
      <p class="sub">Pick someone who'd want to know when things are hard.</p>
      ${people.length ? `<div class="list">${people.map((p, i) =>
        `<button class="card" data-act="cwPerson" data-arg="${i}">${icon("people")}<span>${esc(p.name)}${p.relationship ? `<span class="meta">${esc(p.relationship)}</span>` : ""}</span></button>`).join("")}</div>`
        : `<p class="note">Add someone you trust first. Then come back here.</p>
          <button class="btn btn-secondary" data-act="planEdit" data-arg="trustedPeople">Add someone</button>`}`,
      actions:`<button class="btn btn-secondary" data-act="cwCancel">Back to My Plan</button>` };
  },
  "cw-word"(){
    const p = (getPlan().trustedPeople || [])[ui.cwPerson];
    if (!p) return SCREENS["cw-person"]();
    const opts = ui.cwOptions || [];
    const own = ui.cwOwn;
    const word = own ? (ui.cwOwnText || "") : ui.cwWord;
    return { close:false, body:`
      <p class="lbl">Set up with your people · Code word</p>
      ${title(`Pick a word for ${esc(p.name)}.`)}
      <p class="sub">On a hard day, you'll send just this word. ${esc(p.name)} will know what it means. No explaining.</p>
      <div class="sits cw-words">${opts.map(w => `<button class="sit" data-act="cwWord" data-arg="${esc(w)}" aria-pressed="${!own && ui.cwWord === w}">${esc(w)}</button>`).join("")}
        <button class="sit" data-act="cwOwn" aria-pressed="${!!own}">My own word</button></div>
      <button class="link" data-act="cwShuffle">Show other words</button>
      ${own ? `<label for="cwOwnBox" class="small" style="display:block;margin-top:10px">Your word</label>
        <input class="field" id="cwOwnBox" maxlength="30" autocomplete="off" value="${esc(ui.cwOwnText || "")}">` : ""}
      ${ui.msg ? `<p class="err" role="alert">${esc(ui.msg)}</p>` : ""}
      ${word && !own ? `<p class="lbl" style="margin-top:16px">Your message to ${esc(p.name)}</p><p class="msg-preview">${esc(codeWordSetupMsg(p.name, word))}</p>` : ""}`,
      actions:`<button class="btn btn-primary" data-act="cwNext">Next</button>
        <button class="btn btn-secondary" data-act="cwCancel">Back to My Plan</button>` };
  },
  "cw-send"(){
    const p = (getPlan().trustedPeople || [])[ui.cwPerson];
    if (!p || !ui.cwFinal) return SCREENS["cw-person"]();
    const text = codeWordSetupMsg(p.name, ui.cwFinal);
    return { close:false, body:`
      <p class="lbl">Set up with your people · Code word</p>
      ${title(`Your message to ${esc(p.name)}`)}
      <p class="msg-preview">${esc(text)}</p>
      ${canPhone() ? `<a class="btn btn-primary cw-open" href="${smsLink(p.phone, text)}">Open Messages</a>` : `<p class="small">Send it to ${esc(p.name)} (${esc(p.phone)}) from your phone, or paste it anywhere.</p>${copyButton(text, "btn btn-primary cw-open", "Copy message")}`}
      <p class="note">ZigZag Mind never sends anything for you. You tap Send.</p>
      <h2>Did you send it?</h2>`,
      actions:`<button class="btn btn-primary" data-act="cwSaved">Yes, I sent it</button>
        <button class="btn btn-secondary" data-act="cwCancel">Not yet</button>` };
  },

  /* 6.10: Check-in reminders. choose_person → share_link (or text it) → confirm. */
  "ci-name"(){
    return { close:false, body:`
      <p class="lbl">Set up with your people · Check-in reminders</p>
      ${title("What name should their reminders show?")}
      <p class="sub">Your first name, so their calendar says "Check in on [your name]". Optional. If you leave it blank, it says "your friend".</p>
      <label for="ciNameBox" class="small" style="display:block;margin-top:12px">Your first name (saved in your plan)</label>
      <input class="field" id="ciNameBox" maxlength="40" autocomplete="given-name" value="${esc(getPlan().myName || "")}">`,
      actions:`<button class="btn btn-primary" data-act="ciName">Next</button>
        <button class="btn btn-secondary" data-act="ciCancel">Back to My Plan</button>` };
  },
  "ci-person"(){
    const people = getPlan().trustedPeople || [];
    return { close:false, body:`
      <p class="lbl">Set up with your people · Check-in reminders</p>
      ${title("Who would you like to check in on you?")}
      <p class="sub">They'll get a link that adds gentle reminders to their own calendar. Nothing is sent by ZigZag Mind.</p>
      ${people.length ? `<div class="list">${people.map((p, i) =>
        `<button class="card" data-act="ciPerson" data-arg="${i}">${icon("people")}<span>${esc(p.name)}${p.relationship ? `<span class="meta">${esc(p.relationship)}</span>` : ""}</span></button>`).join("")}</div>`
        : `<p class="note">Add someone you trust first. Then come back here.</p>
          <button class="btn btn-secondary" data-act="planEdit" data-arg="trustedPeople">Add someone</button>`}`,
      actions:`<button class="btn btn-secondary" data-act="ciCancel">Back to My Plan</button>` };
  },
  "ci-send"(){
    const p = (getPlan().trustedPeople || [])[ui.ciPerson];
    if (!p) return SCREENS["ci-person"]();
    const url = checkinUrl(), text = `${CHECKIN_ASK} ${url}`;
    return { close:false, body:`
      <p class="lbl">Set up with your people · Check-in reminders</p>
      ${title(`Your message to ${esc(p.name)}`)}
      <p class="msg-preview">${esc(text)}</p>
      ${canPhone() ? `<a class="btn btn-primary ci-open" href="${smsLink(p.phone, text)}">Text it to ${esc(p.name)}</a>` : `<p class="small">Send it to ${esc(p.name)} (${esc(p.phone)}) from your phone, or paste it anywhere.</p>${copyButton(text, "btn btn-primary ci-open", "Copy message")}`}
      <button class="btn btn-secondary" style="margin-top:10px" data-act="ciShare">Share another way</button>
      ${ui.flash ? `<p class="flash" role="status">${esc(ui.flash)}</p>` : ""}
      <p class="note">ZigZag Mind never sends anything for you. ${firstName(getPlan().myName) ? `The link has only your first name, ${esc(firstName(getPlan().myName))}, nothing else from your plan.` : "The link has no name and nothing from your plan. Their reminders will say \"your friend\"."}</p>
      <h2>Did you send it?</h2>`,
      actions:`<button class="btn btn-primary" data-act="ciSaved">Yes, I sent it</button>
        <button class="btn btn-secondary" data-act="ciCancel">Not yet</button>` };
  },

  /* 6.12: I need my plan: the essentials, read-only, in this order. Same plan data; never a second plan.
     From the NO branch, calling or texting moves to the safety check in the same tap, and "I'm done" goes there too. */
  "plan-now"(){
    const pb = getPlan(), no = ui.planFrom === "no";
    const attr = no ? ` data-act="noContact" data-noexit="1"` : "";
    const td = pb.timeDistance || {};
    const tdLines = TD_FIELDS.filter(([k]) => td[k]).map(([k, t]) => `<p class="td-q">${t}</p><p class="td-a">${esc(td[k])}</p>`).join("");
    const people = pb.trustedPeople || [];
    return { close:false, body:`
      ${title("Your plan.")}
      <p class="sub">Just the essentials, right now.</p>
      <div class="panel pn"><p class="lbl">Do this first</p><p class="pn-first">${esc(firstStep())}</p></div>
      <div class="panel pn"><p class="lbl">Reach a person</p>
        ${codeWord() ? codeWordButton(no, "btn btn-primary") : ""}
        ${people.length ? people.map(p => pairOrStack(`<a class="btn btn-outline" href="${telLink(p.phone)}"${attr} aria-label="${callText(`Call ${esc(p.name)}`, p.phone)}">${callText(`Call ${esc(p.name)}`, p.phone)}</a>`,
            textOrCopy({ phone:p.phone, body:HARD_TIME_MSG, label:`Text ${esc(p.name)}`, cls:"btn btn-outline", attr:attr.trim(), aria:`Text ${esc(p.name)}` }), "margin-top:10px")).join("")
          : `<p class="small" style="margin:6px 0 0">No one in your plan yet. 988 is below, any time.</p>`}</div>
      ${(pb.reasons || []).length ? `<div class="panel pn"><p class="lbl">Reasons to stay</p>${pb.reasons.map(x => `<p>${esc(x)}</p>`).join("")}</div>` : ""}
      ${pb.places.length ? `<div class="panel pn"><p class="lbl">Places I can go</p><p>${pb.places.map(esc).join(" · ")}</p></div>` : ""}
      ${tdLines ? `<div class="panel pn"><p class="lbl">My time and distance plan</p>${tdLines}</div>` : ""}
      ${pb.reminders.length ? `<div class="panel pn"><p class="lbl">What I want to remember</p>${pb.reminders.map(x => `<p>${esc(x)}</p>`).join("")}</div>` : ""}
      <p class="lbl" style="margin-top:18px">Crisis support</p>
      ${row988().replace(/<a class="btn btn-safety"/g, `<a class="btn btn-safety"${no ? ' data-act="noContact" data-noexit="1"' : ""}`)}
      <a class="btn btn-safety two-line" style="margin-top:10px" href="${LINKS.call911}"${attr}>Call 911<span class="cap">If someone is hurt or in danger</span></a>
      <p class="note">ZigZag Mind is not an emergency service.</p>`,
      actions:`<button class="btn btn-primary" data-act="planDone">I'm done</button>` };
  },

  /* 6.6: Connect (I just feel alone). Zags (6.7) and the code word (6.8) join this screen when they're built. */
  connect(){
    const people = getPlan().trustedPeople || [];
    const first = people[0];
    const night = isNight();   // 6.18 D2: at night 988 comes first and the Warm Line moves below your people
    const ideas = night ? [NIGHT_IDEA, ...MESSAGE_IDEAS.filter(m => m !== NIGHT_IDEA)] : MESSAGE_IDEAS;
    const warm = `<div class="panel conn" id="connWarm">
        <p class="lbl">${l10n("connect.warmLbl")}</p>
        <h3>${WARMLINE.name}</h3>
        <p class="small">${WARMLINE.hours} ${WARMLINE.about}</p>
        ${night ? `<p class="small warm-night">${l10n("connect.warmNight")}</p>` : ""}
        <a class="btn btn-primary" href="${WARMLINE.tel}">${callText(l10n("connect.callWarm"), WARMLINE.number)}</a>
        <a class="conn-more" href="${WARMLINE.elsewhereUrl}" target="_blank" rel="noopener">${WARMLINE.elsewhere}</a>
      </div>`;
    const crisis988 = `<p class="lbl">${l10n("connect.heavier")}</p>
      ${row988()}
      ${vetLine()}
      ${ctlLine()}`;
    return { close:true, body:`
      ${title(l10n("connect.title"))}
      ${night ? crisis988 : warm}
      <div class="panel conn" id="connPeople">
        <p class="lbl">${l10n("connect.people")}</p>
        ${people.length ? people.map(p => `<h3>${esc(p.name)}${p.relationship ? ` <span class="small">· ${esc(p.relationship)}</span>` : ""}</h3>
          ${pairOrStack(textOrCopy({ phone:p.phone, label:canPhone() ? l10n("person.text") : `${l10n("person.text")} ${esc(p.name)}`, cls:"btn btn-secondary", aria:`${l10n("person.text")} ${esc(p.name)}` }),
            `<a class="btn btn-secondary" href="${telLink(p.phone)}" aria-label="${callText(`${l10n("person.call")} ${esc(p.name)}`, p.phone)}">${callText(l10n("person.call"), p.phone)}</a>`)}`).join("") + `
          ${codeWordButton(false)}
          <button class="link ideas-toggle" data-act="ideasToggle" aria-expanded="${!!ui.ideasOpen}" style="margin-top:14px">${l10n("connect.dontKnow")}${people.length > 1 ? ` ${l10n("connect.to")} ${esc(first.name)}` : ""}?</button>
          ${ui.ideasOpen ? `<p class="small" style="margin:8px 0 8px">${canPhone() ? l10n("connect.tapOne") : l10n("connect.tapCopy")}</p>
          <p class="small ideas-note" style="margin:0 0 8px">${l10n("connect.ideasNote")}</p>
          <div class="sits">${ideas.map(m => canPhone() ? `<a class="sit idea" href="${smsLink(first.phone, m)}">${esc(m)}</a>` : copyButton(m, "sit idea", esc(m))).join("")}</div>` : ""}`
        : `<p class="small">${l10n("connect.addHint")}</p>
          <button class="btn btn-secondary" data-act="planFromConnect">${l10n("connect.addSomeone")}</button>`}
      </div>
      ${night ? warm : ""}
      ${ui.connMoreOpen ? `<button class="card wide around-card" data-act="aroundPeople" style="margin-top:14px">${icon("people")}<span>${l10n("connect.around")}</span></button>
      <button class="card wide zcard" data-act="zags" data-arg="connect" style="margin-top:10px">${zagsFace()}<span>${l10n("connect.zags")}</span></button>
      <button class="link" data-act="songStart" data-arg="connect">${l10n("connect.song")}</button>`
      : `<button class="card wide conn-more-card" data-act="connMore" aria-expanded="false" style="margin-top:14px">${icon("people")}<span>${l10n("connect.more")}<span class="meta">${l10n("connect.moreMeta")}</span></span></button>`}
      ${nearMeLink()}
      ${faithOn() ? `<button class="link faith-link" data-act="faith">${l10n("common.hope")}</button>` : ""}
      ${night ? "" : crisis988}` };
  },

  "human-first"(){
    const p = person();
    const call = p ? `<a class="btn btn-primary" href="${telLink(p.phone)}">${callText("Call someone", p.phone)}</a>` : `<button class="btn btn-primary" data-act="route" data-arg="connect">Call someone</button>`;
    const text = p ? textOrCopy({ phone:p.phone, label:"Text someone", cls:"btn btn-secondary" }) : `<button class="btn btn-secondary" data-act="route" data-arg="connect">Text someone</button>`;
    return { close:true, body:`
      ${title("Would talking to a person help more than another answer?")}
      ${p ? `<p class="sub">${esc(p.name)} is in your plan.</p>` : ""}`,
      actions:`${call}${text}
        <button class="btn btn-secondary" data-act="hfPeople">Be around people</button>
        <button class="link" data-act="hfNotNow">Not right now</button>` };
  },

  /* 6.13: After the ER or hospital. */
  "after-setup"(){
    return { close:true, body:`
      ${title("When did you leave?")}
      <p class="sub">For the next 30 days, ZigZag Mind keeps a few things close: 988, your people, and a short, optional checklist. You can end this any time in Settings.</p>
      <div class="list">${AFTER_LEFT.map(([k, t]) => `<button class="card" data-act="afterLeft" data-arg="${k}"><span>${t}</span></button>`).join("")}</div>` };
  },
  after(){
    const a = afterCrisis() || { done:{} };
    const p = person();
    const done = k => k === "code" ? !!codeWord() || !!a.done.code : k === "checkin" ? checkinAsked().length > 0 || !!a.done.checkin : !!a.done[k];
    const box = k => `<button class="after-box" data-act="afterToggle" data-arg="${k}" aria-pressed="${done(k)}" aria-label="Mark as done: ${esc(AFTER_ITEMS.find(x => x[0] === k)[1])}">${done(k) ? "✓" : ""}</button>`;
    const item = (k, extra) => `<div class="after-item">${box(k)}<div class="after-txt"><b>${AFTER_ITEMS.find(x => x[0] === k)[1]}</b>${extra || ""}</div></div>`;
    return { close:true, body:`
      ${afterBar()}
      ${title("Welcome home. One small thing at a time.")}
      <p class="sub">All optional. Any order.</p>
      ${item("tell", p ? textOrCopy({ phone:p.phone, body:AFTER_HOME_MSG, label:`Text ${esc(p.name)}`, cls:"btn btn-secondary after-btn" })
        : `<button class="btn btn-secondary after-btn" data-act="planEdit" data-arg="trustedPeople">Add someone to My Plan</button>`)}
      ${item("code", codeWord() ? `<span class="small">Done · ${esc(codeWord().word)} with ${esc(codeWord().person.name)}</span>` : `<button class="btn btn-secondary after-btn" data-act="cwStart">Set it up</button>`)}
      ${item("appt", `<span class="small">${AFTER_NO_APPT}</span>
        <div class="after-appt"><label for="apptDate" class="small">Date</label><input class="field" type="date" id="apptDate">
        <label for="apptTime" class="small">Time (optional)</label><input class="field" type="time" id="apptTime"></div>
        <button class="btn btn-secondary after-btn" data-act="afterAppt">Add it to my calendar</button>`)}
      ${item("checkin", checkinAsked().length ? `<span class="small">Asked: ${checkinAsked().map(x => esc(x.name)).join(", ")}</span>` : `<button class="btn btn-secondary after-btn" data-act="ciStart">Ask someone</button>`)}
      ${item("daily", `<span class="small">Adds them to your own calendar.</span><button class="btn btn-secondary after-btn" data-act="afterDaily">Add daily reminders</button>`)}
      ${ui.flash ? `<p class="flash" role="status">${esc(ui.flash)}</p>` : ""}
      <p class="small" style="margin-top:18px">${HELP_IS_STRENGTH}</p>` };
  },

  /* 6.15 Faith & hope (opt-in) */
  faith(){
    if (!faithOn()) return SCREENS.home();
    return { close:true, body:`
      <p class="step-count">Faith &amp; hope</p>
      ${title("Need a little hope?")}
      <p class="sub">Pick what fits right now.</p>
      <div class="list">${FAITH_PASSAGES.map(([k, m]) => `<button class="card" data-act="faithPick" data-arg="${k}"><span>${m}</span></button>`).join("")}</div>` };
  },
  "faith-passage"(){
    const f = FAITH_PASSAGES.find(x => x[0] === ui.faithKey);
    if (!faithOn() || !f) return SCREENS.home();
    const p = person();
    return { close:true, body:`
      <p class="step-count">${f[1]}</p>
      ${stepTitle(`“${f[2]}”`, true)}
      <p class="small">${f[3]} (KJV)</p>
      <p class="sub" style="margin-top:18px">Take this with you. Then:</p>
      <div class="sits faith-next">
        <button class="sit" data-act="faithPray">Pray</button>
        ${p ? (canPhone() ? `<a class="sit" href="${smsLink(p.phone, HARD_TIME_MSG)}">Text someone</a>` : copyButton(HARD_TIME_MSG, "sit", "Copy a text for someone")) : `<button class="sit" data-act="route" data-arg="connect">Text someone</button>`}
        <button class="sit" data-act="lowPick" data-arg="walking">Take a walk</button>
        <button class="sit" data-act="lowPick" data-arg="grounding">Ground myself</button>
        <button class="sit" data-act="planNow">Open my plan</button>
      </div>` };
  },
  "faith-pray"(){
    if (!faithOn()) return SCREENS.home();
    return { close:true, body:`${stepTitle(FAITH_PRAY, true)}`,
      actions:`<button class="btn btn-primary" data-act="home">Done</button>
        <button class="btn btn-secondary" data-act="route" data-arg="connect">I'd like to talk to someone</button>` };
  },

  /* 6.14 Tech check */
  tech(){
    return { close:true, body:`

  "song-line"(){
    const i = ui.songIdx || 0;

  "song-play"(){
    const s = ui.song;

    const lyric = (t, i) => `<p class="lyric${i >= 2 ? " still" : ""}${ui.songEnded ? " now" : ""}" id="ly${i}">${t.split(" ").map((w, j) => `<span class="w" id="sw${i}_${j}">${esc(w)}</span>`).join(" ")}</p>`;
    const voice = ("speechSynthesis" in window)
      ? `<button class="chip zvoice" data-act="songVoice" aria-pressed="${!!ui.songVoice}">${ui.songVoice ? "Voice on" : "Voice off"}</button>` : "";
    let after = "", acts = "";
    if (ui.songEnded && !ui.songReplay){
      const p = person();
      after = `<p class="sub song-made">${SONG_MADE}</p>`;
      acts = `<button class="btn btn-primary" data-act="songKeep"${ui.songKept ? " disabled" : ""}>${ui.songKept ? "Kept in My songs" : "Keep it in My songs"}</button>
        ${canPhone() ? `<a class="btn btn-secondary" href="${smsLink(p ? p.phone : "", SONG_SHARE_MSG)}">Share how you're doing with someone</a>` : copyButton(SONG_SHARE_MSG, "btn btn-secondary", "Copy a message for someone")}

        <button class="link" data-act="songAgain">Make another</button>`;
    } else if (ui.songEnded){
      after = `<h2 class="song-q">How does this feel now?</h2>`;

    } else acts = "";
    return { close:true, body:`
      <div class="song-player">

        <p class="step-count" id="songSec" aria-live="polite">${ui.songEnded ? "That's your song." : `${SONG_MOODS[s.mood].label} · ${s.date ? "from " + esc(songDate(s.date)) : "your song"}`}</p>

function computeProgress(){
  const since = Date.now() - 7 * 86400000;
  const hist = [ ...store.sensitive.baseHistory, ...session.sessionHistory ].filter(h => (h.timestamp || 0) >= since);
  const act = store.sensitive.activity.filter(a => a.ts >= since);
  const count = t => act.filter(a => a.type === t).length;
  const rated = hist.filter(h => typeof h.before === "number" && typeof h.after === "number");
  const by = {};
  rated.forEach(h => { if (!findIntervention(h.interventionId)) return; (by[h.interventionId] = by[h.interventionId] || []).push(h.before - h.after); });
  let best = null;
  Object.entries(by).forEach(([id, drops]) => {
    if (drops.length < 2) return;
    const avg = drops.reduce((a, b) => a + b, 0) / drops.length;
    if (avg > 0 && (!best || avg > best.avg)) best = { name:findIntervention(id).name, uses:drops.length, avg };
  });
  const r1 = x => Math.round(x * 10) / 10;
  return {
    moments:count("moment"), planUses:count("plan"), reach:count("reach"), actions:hist.length,
    best, rated:rated.length,
    avgBefore:rated.length ? r1(rated.reduce((a, h) => a + h.before, 0) / rated.length) : null,
    avgAfter:rated.length ? r1(rated.reduce((a, h) => a + h.after, 0) / rated.length) : null,
    hasSample:store.sensitive.baseHistory.some(h => h.source === "sample") || store.sensitive.activity.some(a => a.sample)
  };
}

function buildExport(){
  const strip = h => ({ state:h.state, interventionId:h.interventionId, before:h.before, after:h.after,
    date:h.timestamp ? new Date(h.timestamp).toISOString() : null, sample:h.source === "sample" || undefined });
  return {
    exportedAt:new Date().toISOString(),
    app:store.product.appVersion,
    plan:getPlan(),
    checkIns:[ ...store.sensitive.baseHistory, ...session.sessionHistory ].map(strip),
    activity:store.sensitive.activity.map(a => ({ type:a.type, date:new Date(a.ts).toISOString(), sample:a.sample || undefined })),
    first30Days:store.sensitive.afterCrisis ? { start:new Date(store.sensitive.afterCrisis.start).toISOString(), until:new Date(store.sensitive.afterCrisis.until).toISOString(), done:store.sensitive.afterCrisis.done } : undefined,

}

/* 6.22 DOODLE: drawing. Strokes are kept as points relative to the canvas (0–1), so the page redraws them after any
   re-render or resize. No animation (reduced motion needs nothing special). */
let doodleLive = null;   // the stroke being drawn
function doodleCtx(){ const c = document.getElementById("doodleCanvas"); if (!c) return null; let g = null; try { g = c.getContext("2d"); } catch (_){} return g ? { c, g } : null; }
function doodleStroke(g, st, w, h){
  if (!st.points.length) return;
  g.save();
  g.globalCompositeOperation = st.erase ? "destination-out" : "source-over";
  g.strokeStyle = st.erase ? "#000" : st.color; g.fillStyle = g.strokeStyle;
  g.lineWidth = st.size; g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath();
  const [x0, y0] = st.points[0]; g.moveTo(x0 * w, y0 * h);
  if (st.points.length === 1){ g.arc(x0 * w, y0 * h, st.size / 2, 0, Math.PI * 2); g.fill(); }
  else { for (const [x, y] of st.points.slice(1)) g.lineTo(x * w, y * h); g.stroke(); }
  g.restore();
}
function doodleRedraw(){
  const k = doodleCtx(); if (!k) return;
  const { c, g } = k, w = c.width / (c._dpr || 1), h = c.height / (c._dpr || 1);
  g.setTransform(c._dpr || 1, 0, 0, c._dpr || 1, 0, 0);
  g.clearRect(0, 0, w, h);
  for (const st of (ui.doodle && ui.doodle.strokes) || []) doodleStroke(g, st, w, h);
}
function doodleMount(){
  const c = document.getElementById("doodleCanvas"); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
  c._dpr = dpr; c.width = Math.max(1, Math.round((r.width || 320) * dpr)); c.height = Math.max(1, Math.round((r.height || 400) * dpr));
  doodleRedraw();
}
function doodlePoint(e, c){ const r = c.getBoundingClientRect(); const w = r.width || 1, h = r.height || 1;
  return [Math.min(1, Math.max(0, (e.clientX - r.left) / w)), Math.min(1, Math.max(0, (e.clientY - r.top) / h))]; }
document.addEventListener("pointerdown", e => {
  if (!e.target || e.target.id !== "doodleCanvas") return;
  if (blockIfRed()) return;
  e.preventDefault();

    ${session.devPanelOpen ? devPanel() : ""}`;
  fitChrome();

    if (crisis){ ui.grief = null; ui.fsGrief = false; }    // nothing from the grief path survives a crisis screen
    window.scrollTo(0, 0);
    const h = document.getElementById("screen-title");
    if (h) h.focus({ preventScroll:true });
    lastRendered = s;
    clearInterval(palmsTimer); palmsTimer = null;
    clearInterval(cravingTimer); cravingTimer = null;
    if (focusRaf){ cancelAnimationFrame(focusRaf); focusRaf = null; }
    clearTimeout(memTimer); memTimer = null;
    zagsStopBreathing();
    clearInterval(borrowTimer); borrowTimer = null;
    if (s === "borrow-step" && ui.borrowEnd) borrowTimer = setInterval(borrowTick, 1000);

    if (s !== "song-play") songStop();

    clearInterval(tcTimer); tcTimer = null;
    clearInterval(minuteTimer); minuteTimer = null;

    clearInterval(cozyTimer); cozyTimer = null;
    if (s.startsWith("cozy") && ui.cozy && ui.cozy.until) cozyTimer = setInterval(cozyTick, 1000);   // leaving (Help, X, RED) stops the coffee lines
    if (s === "minute-down" && ui.minutePhase === "wait") minuteTimer = setInterval(minuteTick, 1000);
    if (s === "tc-loop" && ui.tcLoopEnd) tcTimer = setInterval(tcTick, 1000);   // leaving the player (Help, X, RED) stops the song at once
    if (s === "zags" && ui.zags && ui.zags.phase === "breathe") zagsStartBreathing();
    if (s !== "g-pattern"){ clearTimeout(patTimer); patTimer = null; }
    if (s === "craving-delay") cravingTimer = setInterval(cravingTick, 1000);

    if (s === "anx-palms"){
      let n = 10;

        if (el) el.textContent = Math.max(n, 0);
        if (n <= 0){ clearInterval(palmsTimer); palmsTimer = null; if (el) el.textContent = "✓"; }
      }, 1000);
    }
  }

  async diaryLockSet(){
    if (blockIfRed() || ui.diaryBusy || store.diaryLock || !ui.diaryWarned) return;
    const a = document.getElementById("diaryPass1"), b = document.getElementById("diaryPass2");
    const p1 = (a && a.value) || "", p2 = (b && b.value) || "";
    if (p1.length < 4){ ui.msg = DIARY.tooShort; render(); return; }
    if (p1 !== p2){ ui.msg = DIARY.mismatch; render(); return; }
    ui.diaryBusy = true; ui.msg = ""; render();
    try {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await diaryDerive(p1, salt);
      store.diaryLock = { salt:b64(salt), check:await diaryEncrypt(key, DIARY_CHECK) };
      diaryKey = key;
      const ok = await saveDiary();
      if (!ok){ store.diaryLock = null; store.diaryBlob = null; diaryKey = null; writeDiary(); ui.msg = DIARY.full; return; }
      diaryStartTimer();
      ui.diaryWarned = false; ui.flash = DIARY.locked; go("diary");
    } catch (_){ store.diaryLock = null; store.diaryBlob = null; diaryKey = null; ui.msg = DIARY.lockNoCrypto; }
    finally { ui.diaryBusy = false; if (session.screen !== "diary") render(); }

  motion(arg){ prefs.reduce = arg === "reduce"; document.documentElement.classList.toggle("reduce", prefs.reduce); savePrefs(); render(); },
  haptics(arg){ prefs.haptics = arg === "on"; if (prefs.haptics) buzz(); savePrefs(); render(); },
  country(arg){ if (["auto","us","other"].includes(arg)){ prefs.country = arg; savePrefs(); } render(); },
  persist(arg){
    persistOn = arg === "on";
    if (persistOn){ saveStore(); saveNoticed(); writeDiary(); ui.flash = "Saving is on. Your data stays on this device."; }
    else { clearSaved(); ui.flash = "Saving is off. Saved data was removed from this device."; }
    savePrefs(); render();
  },

  theme(arg){
    ui.theme = arg;
    if (arg === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = arg;
    savePrefs();
    render();
  }
};

document.addEventListener("click", e => {
  const link = e.target.closest("a[href]");
  if (link && !link.hasAttribute("data-kind") && /^(tel:|sms:|https:\/\/988lifeline)/.test(link.getAttribute("href"))) logActivity("reach");
  if (session.screen === "zags" && ui.zagsVoice) zagsHush();   // Zags's voice stops the moment the person taps anything
  const cp = e.target.closest("[data-copy]");
  if (cp) copyMsg(cp);   // desktop: copy the prepared message (a data-noexit copy still goes to the safety check below)
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  // NO-branch Call/Text: let the phone link open, and set the safety question
  // as the current screen in the same handler so it is waiting on return.
  if (el.hasAttribute("data-noexit")){
    dispatch({ type:"SET_SCREEN", screen:"safety-check" });
    setTimeout(render, 400);
    return;
  }
  if (el.tagName === "A") return;
  e.preventDefault();
  const fn = ACTIONS[act];
  if (fn) fn(el.getAttribute("data-arg"), el, e);
});

/* 6.21 C: the diary re-locks when the page is hidden. */
document.addEventListener("visibilitychange", () => { if (document.hidden) diaryRelock(true); });

/* FIND SOMETHING: the phone's camera (or a photo picker) hands back a photo; it stays in this page as a local preview. */
document.addEventListener("change", e => {
  if (!e.target || e.target.id !== "fsCam") return;
  if (blockIfRed()) return;
  const f = e.target.files && e.target.files[0];
  if (!f || !/^image\//.test(f.type || "")) return;
  fsDropPhoto();
  try { ui.fsPhoto = URL.createObjectURL(f); } catch (_){ ui.fsPhoto = null; }
  ui.fsKept = false; ui.msg = "";
  go("fs-found");
});

/* Focus game input */
document.addEventListener("pointerdown", e => {
  if (session.screen === "focus" && e.target.closest("#focusArea")){ e.preventDefault(); focusTap(); }
});
document.addEventListener("keydown", e => {
  if (session.screen === "focus" && document.activeElement && document.activeElement.id === "focusArea" && (e.key === " " || e.key === "Enter")){
    e.preventDefault(); focusTap();
  }
});

/* Thought Parking drag (handle only; tap buttons remain the accessible path) */
let drag = null;
document.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-drag]");
  if (!h || session.screen !== "spiral-sort") return;
  const card = h.closest(".tcard");
  if (!card) return;
  e.preventDefault();
  try { h.setPointerCapture(e.pointerId); } catch(_){}
  drag = { idx:Number(h.getAttribute("data-drag")), card, x0:e.clientX, y0:e.clientY, sy0:window.scrollY, zone:null };
  card.classList.add("dragging");
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0 + (window.scrollY - drag.sy0);
  drag.card.style.transform = `translate(${e.clientX - drag.x0}px, ${dy}px)`;
  drag.card.style.pointerEvents = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const zone = under && under.closest("[data-zone]");
  document.querySelectorAll(".zone.over").forEach(z => { if (z !== zone) z.classList.remove("over"); });
  if (zone) zone.classList.add("over");
  drag.zone = zone ? zone.getAttribute("data-zone") : null;
  if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 12);
  else if (e.clientY < 120) window.scrollBy(0, -12);
});
function endDrag(){
  if (!drag) return;
  const d = drag; drag = null;
  d.card.classList.remove("dragging");
  d.card.style.transform = ""; d.card.style.pointerEvents = "";
  document.querySelectorAll(".zone.over").forEach(z => z.classList.remove("over"));
  const t = ui.thoughts[d.idx];
  if (d.zone && t && t.place !== d.zone){
    t.place = d.zone;
    ui.landed = d.idx;
    render();
    ui.landed = null;
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

loadStore();
if (savedTheme && savedTheme !== "auto"){ ui.theme = savedTheme; document.documentElement.dataset.theme = savedTheme; }
document.documentElement.classList.toggle("reduce", !!prefs.reduce);
render();

// Offline support: sw.js keeps this page on the device so crisis screens open with no connection.
try {
  if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
} catch (_){}
</script>
